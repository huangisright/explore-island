<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索紀錄本｜數學探索島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#fdfcf8; --card:#fffefa; --ink:#1d1d1d; --ink-2:#555; --ink-3:#8a8a8a;
  --edge:#b9b5aa; --edge-soft:#dedad0; --grass:#cfe3bf; --sand:#efe8d6;
  --red:#c8321e; --blue:#24489a; --green:#2f7a3a; --orange:#d4472b;
  --indigo:#24489a; --hl:#fff2a8;
  --hand:"LXGW WenKai TC","Kaiti TC","KaiTi","STKaiti",serif;
  --sans:var(--hand);
  --wob:255px 14px 225px 14px/14px 225px 14px 255px;
  --wob2:14px 255px 14px 225px/225px 14px 255px 14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hand);line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 70px}
.top{padding:18px 0 0;font-size:15px}
.top a{color:var(--blue);text-decoration:none}
header{padding:16px 0 10px;text-align:center}
h1{font-size:clamp(36px,6vw,54px);margin:0;letter-spacing:.1em}
.say{margin:2px 0 0;color:var(--ink-2);font-size:17px}
.who{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:6px 22px;margin-top:14px;font-size:18px}
.who input{font:inherit;font-size:20px;width:7.5em;text-align:center;padding:0 4px 2px;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink)}
.who input:focus{outline:none;background:var(--hl)}
.tally{color:var(--ink-2);font-size:16px}
.tally b{color:var(--red);font-size:24px}
.mapbox{position:relative;overflow-x:auto;border:2.5px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;background:var(--card);padding:6px;margin-top:10px}
svg.map{display:block;width:100%;height:auto;min-width:880px}
.swipe{display:none;text-align:center;font-size:13px;color:var(--ink-3);margin:4px 0 0}
@media (max-width:900px){.swipe{display:block}}
svg.map text{font-family:var(--hand);fill:var(--ink)}
svg.map a{cursor:pointer}
svg.map a:hover .isle{fill:#e3f0d6}
svg.map a:focus-visible{outline:none}
svg.map a:focus-visible .isle{stroke:var(--blue);stroke-width:3.5}
svg.map .lab{font-size:15px}
svg.map .tiny{font-size:12.5px;fill:var(--ink-2)}
svg.map .big{font-size:22px;font-weight:700}
svg.map .note{font-size:14px;fill:var(--ink-2)}
.grey text{fill:var(--ink-3)}
.note{margin:38px auto 0;max-width:40em;text-align:center;font-size:15px;color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;margin-top:10px;font-size:14.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:14px;border:1.8px solid var(--ink);border-radius:var(--wob2)}
.legend .st{color:var(--red);font-weight:700}
.isl-auth{font-family:var(--hand)!important;border:2px solid var(--ink)!important;border-radius:var(--wob)!important}
.isl-auth button{border:2px solid var(--ink)!important;border-radius:var(--wob2)!important;background:var(--card)!important;color:var(--ink)!important}
@media print{ .note,.top,.isl-auth{display:none!important} .who input{border-bottom:1px solid #999} }
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="index.html">← 回到地圖</a></div>
<header>
  <h1>探索紀錄本</h1>
  <p class="say">記你走過哪些島的本子。走完一座島，這裡就會蓋一個章。</p>
  <div class="who"><label>這本是 <input id="nm" type="text" maxlength="20" placeholder="你的名字"> 的</label><span class="tally" id="tally"></span></div>
  <div class="legend">
    <span><i style="background:var(--grass)"></i>能去的島</span>
    <span><i style="border-style:dashed;border-color:var(--edge);background:#efe8d6"></i>橋還沒蓋好</span>
    <span><span class="st">○完成</span>走完的島</span>
  </div>
</header>
<main id="main"></main>
<p class="swipe">← 地圖可以左右滑 →</p><div class="mapbox"><svg class="map" id="map" viewBox="0 0 1200 900" role="img" aria-label="探索紀錄地圖"></svg></div>
<p class="note">沒登入的時候，這本只記在這台電腦裡；用名單上的帳號登入，就會記在雲端，換一台電腦也看得到。在大家一起用的電腦上，用完記得登出。</p>
</div>
<script>window.ISLAND_MAP = { units: [{"slug": "g7a-ch1-number-line", "grade": "七年級上", "kind": "正課", "ch": "七上 1", "title": "一條數線，兩把尺", "open": true}, {"slug": "g7a-ch2-skeleton", "grade": "七年級上", "kind": "正課", "ch": "七上 2", "title": "拆開來看", "open": true}, {"slug": "g7a-ch2-modular", "grade": "七年級上", "kind": "補充卷", "ch": "七上 2", "title": "把數線捲起來", "open": true}, {"slug": "g7a-ch2-fraction-unit", "grade": "七年級上", "kind": "正課", "ch": "七上 2", "title": "分母是單位", "open": true}, {"slug": "g7a-ch3-naming", "grade": "七年級上", "kind": "正課", "ch": "七上 3", "title": "先給它一個名字", "open": true}, {"slug": "g7b-ch1-simultaneous", "grade": "七年級下", "kind": "正課", "ch": "七下 1", "title": "一條不夠", "open": true}, {"slug": "g7b-ch2-coordinates", "grade": "七年級下", "kind": "正課", "ch": "七下 2", "title": "一個數不夠", "open": true}, {"slug": "g7b-ch3-ratio", "grade": "七年級下", "kind": "正課", "ch": "七下 3", "title": "換一個基準看", "open": true}, {"slug": "g7b-ch4-inequality", "grade": "七年級下", "kind": "正課", "ch": "七下 4", "title": "答案是一整段", "open": true}, {"slug": "g7b-ch5-statistics", "grade": "七年級下", "kind": "正課", "ch": "七下 5", "title": "誰能代表大家", "open": true}, {"slug": "g7b-ch6-geometry", "grade": "七年級下", "kind": "正課", "ch": "七下 6", "title": "正對著看", "open": true}, {"slug": "g8a-ch1-polynomial", "grade": "八年級上", "kind": "正課", "ch": "八上 1", "title": "把十換成 x", "open": true}, {"slug": "g8a-s1-1-binomial", "grade": "八年級上", "kind": "補充卷", "ch": "八上 1-1", "title": "不要乘，用數的", "open": true}, {"slug": "g8a-ch2-sqrt-pythagoras", "grade": "八年級上", "kind": "正課", "ch": "八上 2", "title": "把面積翻回邊長", "open": true}, {"slug": "g8a-ch3-factoring", "grade": "八年級上", "kind": "正課", "ch": "八上 3", "title": "拆成乘法才看得見", "open": true}, {"slug": "g8a-ch3-genfunc-1", "grade": "八年級上", "kind": "補充卷", "ch": "八上 3", "title": "係數才是主角", "open": true}, {"slug": "g8a-ch3-genfunc-2", "grade": "八年級上", "kind": "補充卷", "ch": "八上 3", "title": "一直加下去", "open": true}, {"slug": "g8a-ch4-quadratic", "grade": "八年級上", "kind": "正課", "ch": "八上 4", "title": "變回你會解的樣子", "open": true}, {"slug": "g8a-ch5-statistics", "grade": "八年級上", "kind": "正課", "ch": "八上 5", "title": "中間的那個人在哪裡", "open": true}, {"slug": "g8b-ch1-sequences", "grade": "八年級下", "kind": "正課", "ch": "八下 1", "title": "規則才是數列", "open": true}, {"slug": "g8b-ch1-recursion", "grade": "八年級下", "kind": "補充卷", "ch": "八下 1", "title": "裡面有一個小的自己", "open": true}, {"slug": "g8b-ch2-functions", "grade": "八年級下", "kind": "正課", "ch": "八下 2", "title": "它不會改口", "open": true}, {"slug": "g8b-ch3-triangle", "grade": "八年級下", "kind": "正課", "ch": "八下 3", "title": "不能再動了", "open": true}, {"slug": "g8b-ch4-parallel", "grade": "八年級下", "kind": "正課", "ch": "八下 4", "title": "那條線本來不在圖上", "open": true}, {"slug": "g9a-ch1-similar", "grade": "九年級上", "kind": "正課", "ch": "九上 1", "title": "兩個角就夠了", "open": true}, {"slug": "g9a-ch2-circle", "grade": "九年級上", "kind": "正課", "ch": "九上 2", "title": "怎麼看都一樣", "open": true}, {"slug": "g9a-ch3-proof", "grade": "九年級上", "kind": "正課", "ch": "九上 3", "title": "不是剛好", "open": true}, {"slug": "g9b-ch1-quadratic", "grade": "九年級下", "kind": "正課", "ch": "九下 1", "title": "同一條，搬了家", "open": true}, {"slug": "g9b-ch2-statprob", "grade": "九年級下", "kind": "正課", "ch": "九下 2", "title": "算出來之前，先問", "open": true}, {"slug": "g9b-ch3-solids", "grade": "九年級下", "kind": "正課", "ch": "九下 3", "title": "多出來的那個方向", "open": true}], grades: ["七年級上", "七年級下", "八年級上", "八年級下", "九年級上", "九年級下"], plain: {"g7a-ch1-number-line": "這座島上有一條長長的路：加法是在路上走，乘法是把整條路拉長、壓短或翻過來。", "g7a-ch2-skeleton": "這座島上的數都可以拆開，拆到再也拆不開的零件，叫作質數。", "g7a-ch2-fraction-unit": "這座島上，分母是一把尺的刻度：先看一份有多大，再數你有幾份。", "g7a-ch2-modular": "這座島把數線捲成一個圈：只留下餘數，商丟掉不要。", "g7a-ch3-naming": "這座島上，還不知道的數可以先取個名字，帶著它一路算下去。", "g7b-ch1-simultaneous": "這座島上，一條線索不夠：兩個不知道的數，要兩條說法才釘得住。", "g7b-ch2-coordinates": "這座島上一個數不夠用：平面上的每一個點，都要一對有順序的數。", "g7b-ch3-ratio": "這座島上，比之前要先說好以誰為基準；換一個基準看，結論可能整個翻過來。", "g7b-ch4-inequality": "這座島上的答案不是一個數，是數線上的一整段。", "g7b-ch5-statistics": "這座島上，要選一個數代表一群人：平均、中間的那個、最多人的那個，各回答不同的問題。", "g7b-ch6-geometry": "這座島上要正對著看：最短的路是垂直的那一條，對折之後只要看一半。", "g8a-ch1-polynomial": "這座島上，把數字裡的 10 換成 x，一個數就變成一條可以餵任何數的規則。", "g8a-s1-1-binomial": "這座島上的係數都在數數：從好幾個括號裡挑出幾個，一共有幾種挑法。", "g8a-ch2-sqrt-pythagoras": "這座島上，平方把邊長變成面積，開方要把面積翻回邊長；往回翻的時候會出事。", "g8a-ch3-factoring": "這座島上，把加起來的式子改寫成乘起來，答案就會自己掉出來。", "g8a-ch3-genfunc-1": "這座島上的 x 只是掛鉤：把一列數字掛上去，乘一乘，係數就幫你數完了。", "g8a-ch3-genfunc-2": "這座島上，一條無限長的數列，可以裝進一個很短的式子裡。", "g8a-ch4-quadratic": "這座島上的每一招，都是把方程式搬回你本來就會解的樣子。", "g8a-ch5-statistics": "這座島上，一群人的成績被排隊、分組、畫成圖；每換一種看法，就丟掉一些東西，也換到一些東西。", "g8b-ch1-sequences": "這座島上，數列不是猜出來的，是規則寫出來的；第 1 項站在原地，一步都還沒走。", "g8b-ch1-recursion": "這座島上的每個大問題，裡面都藏著一個小一號的自己。", "g8b-ch2-functions": "這座島上的機器：餵一個數進去，它只吐一個出來，而且從來不改口。", "g8b-ch3-triangle": "這座島上，看不能當憑據：條件夠了，圖形就不能再動，不用量也知道。", "g8b-ch4-parallel": "這座島上的難題，常常要先補一條本來不在圖上的線。", "g9a-ch1-similar": "這座島上只管形狀、不管大小：兩個角一樣，三角形就長得一樣。", "g9a-ch2-circle": "這座島是一個圓：從圓心看出去每個方向都一樣遠，所以怎麼轉都和自己一樣。", "g9a-ch3-proof": "這座島上，看起來對的不算數；三條線剛好交在一點，背後一定有理由。", "g9b-ch1-quadratic": "這座島上所有的拋物線都是同一條，只是搬了家、變了胖瘦。", "g9b-ch2-statprob": "這座島上，算機率之前先問一句：分母是誰？", "g9b-ch3-solids": "這座島上多了一個方向：表面要攤平來看，體積要一層一層疊起來。"} };</script>
<script src="island-map.js"></script>
<script>
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const nm = document.getElementById("nm");
nm.addEventListener("input", () => { if (!nm.readOnly) set("isl:name", nm.value); });
function render(cloud, cname) {
  if (cloud) { nm.value = cname || ""; nm.readOnly = true; } else { nm.value = get("isl:name") || ""; nm.readOnly = false; }
  window.__who = cloud ? (cname || "") : (get("isl:name") || "");
  const open = ISLAND_MAP.units.filter(u => u.open);
  let stamps = 0;
  open.forEach(u => {
    let S = null;
    if (cloud) S = cloud[u.slug]; else { try { S = JSON.parse(get("isl:" + u.slug)); } catch (e) {} }
    if (S && S.stampAt) stamps++;
  });
  document.getElementById("tally").innerHTML = "已經蓋了 <b>" + stamps + "</b> 個章（能去的島有 " + open.length + " 座）";
  IslandMap.draw(cloud, { book: true });
}
window.ISLAND_PASSPORT = { show: render };
render(null);
</script>
<script src="firebase-config.js"></script>
<script type="module" src="island-cloud.js"></script>
</body>
</html>
