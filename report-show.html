<style>
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:4px 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--ink);margin:0 0 14px}
.tabs button{border:0;border-radius:6px 6px 0 0;background:none;font-weight:600;padding:6px 14px;color:var(--ink-3)}
.tabs button.on{background:var(--sand);color:var(--ink)}
.tabs .go{margin-left:auto;margin-bottom:4px;border:2px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;background:var(--red);color:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{border:1.8px solid var(--ink);border-radius:8px 18px 10px 16px/16px 8px 18px 10px;background:var(--card);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;position:relative}
.card:hover{background:#f3f8ee}
.card .cover{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--edge);border-radius:5px;background:#f4f1e8}
.card .nocover{width:100%;aspect-ratio:4/3;border:1px dashed var(--edge);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:14px}
.card .who{font-weight:700}
.card .tt{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cc{font-size:14.5px;border-left:3px solid var(--red);padding-left:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .ordno{position:absolute;top:-10px;left:-10px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;font-family:var(--sans)}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--edge-soft);text-align:left;vertical-align:top}
.tbl td:nth-child(-n+4),.tbl th{white-space:nowrap}
.tbl th{font-size:12.5px;color:var(--ink-3);font-weight:600;background:var(--card);position:sticky;top:0}
.scroll{overflow-x:auto}
.qbar{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:14px;font-family:var(--sans);margin:4px 0 10px}
.qbar i{display:block;height:13px;border-radius:3px;background:var(--blue)}
.ord{list-style:none;margin:0;padding:0;max-width:720px}
.ord li{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:8px;background:var(--card);padding:7px 10px;margin:0 0 7px;cursor:grab;font-family:var(--sans);font-size:15px}
.ord li.drag{opacity:.4}
.ord li.over{border-color:var(--red);border-width:2.5px}
.ord li .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ord li .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-size:14px}
.ord li button{padding:0 10px;font-size:14px;border-width:1.5px}
.rub{display:grid;grid-template-columns:auto auto;gap:4px 12px;align-items:center;font-size:15px}
.rub .lv{display:flex;gap:4px}
.rub .lv button{padding:1px 10px;font-size:14px;border-width:1.5px;font-weight:600}
.rub .lv button.on{background:var(--grass);border-color:var(--ink);border-width:2px}
/* 放大看 */
.ov{position:fixed;inset:0;background:rgba(20,20,20,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.ov .box{background:var(--paper);border:2px solid var(--ink);border-radius:12px;max-width:1100px;width:100%;max-height:100%;overflow:auto;padding:16px 20px;position:relative}
.ov .x{position:sticky;top:0;float:right}
.viewer{display:flex;flex-direction:column;gap:8px}
.viewer img{max-width:100%;max-height:72vh;object-fit:contain;border:1.5px solid var(--ink);border-radius:6px;background:#fff;align-self:center}
.viewer .strip{display:flex;gap:6px;justify-content:center}
.viewer .strip button{padding:2px 12px;font-size:14px;border-width:1.5px}
.viewer .strip button.on{background:var(--sand)}
/* 報告模式 */
#stage{position:fixed;inset:0;background:var(--paper);z-index:60;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);grid-template-rows:1fr auto;gap:0}
#stage .pv{padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:8px;border-right:2px solid var(--ink)}
#stage .pv img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;border:2px solid var(--ink);border-radius:6px;background:#fff;cursor:zoom-in}
#stage .pv img.big{position:fixed;inset:0;max-height:100vh;width:100vw;height:100vh;z-index:70;border:0;cursor:zoom-out;background:#fff}
#stage .side{padding:18px 20px;overflow:auto;min-height:0}
#stage .side h2{font-size:34px;margin:0}
#stage .side .q{font-size:18px;margin:8px 0}
#stage .side .cc{font-size:22px;font-weight:700;border-left:5px solid var(--red);padding:4px 0 4px 12px;margin:10px 0}
#stage .nav{grid-column:1/3;border-top:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--card)}
#stage .nav .mid{font-size:18px;font-weight:700;margin:0 6px}
.peerbox{border:2px dashed var(--ink);border-radius:10px;padding:10px 14px;margin:12px 0;background:var(--card)}
.peerbox .big{font-size:30px;font-weight:700}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:14px}
.dist i{display:block;height:14px;background:#f2c94c;border:1px solid var(--ink);border-radius:3px}
.cm{list-style:none;padding:0;margin:6px 0 0;font-size:15.5px}
.cm li{border-bottom:1px dashed var(--edge);padding:4px 0}
@media (max-width:820px){#stage{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow:auto}#stage .pv{border-right:0;border-bottom:2px solid var(--ink)}#stage .nav{grid-column:1}}
</style>

<script>window.REPORT_DATA = [{"id": "g7a-1", "sem": "七上", "code": "七上1", "name": "整數的運算", "title": "一條數線，兩把尺", "qs": [{"k": "推廣", "t": "在數線上只能「往右跳 5 格」或「往左跳 3 格」，從 0 出發，跳得到哪些整數？", "c": "這一章把加法看成數線上的平移。如果平移的步伐只准用兩種，能到的地方就被限制住了。", "s": ["從 0 出發，試著跳到 1、2、3、4。各要怎麼跳？最少幾步？", "換成「右 6、左 4」，還跳得到 1 嗎？跳得到哪些數？換成「右 6、左 9」呢？", "找出規律：兩種步伐是 *a*、*b* 時，跳得到的數和 *a*、*b* 有什麼關係？"], "show": "至少三組步伐的實驗表、自己猜出的規律，以及「為什麼跳不到」的理由。"}, {"k": "反過來", "t": "哪些正整數可以寫成「連續正整數的和」？如果允許用負數，又會變成怎樣？", "c": "15 ＝ 7 ＋ 8 ＝ 4 ＋ 5 ＋ 6 ＝ 1 ＋ 2 ＋ 3 ＋ 4 ＋ 5。有些數有好幾種寫法，有些數一種都沒有。", "s": ["把 1～40 一個一個試，哪些寫不出來？它們有什麼共同點？", "一個數有幾種寫法？例如 15 有三種、9 有兩種，猜猜看和什麼有關。", "如果允許用負整數和 0（例如 −2 ＋ −1 ＋ 0 ＋ 1 ＋ 2 ＋ 3 ＋ 4），哪些數寫得出來？寫法會變多嗎？"], "show": "1～40 的結果表、「寫不出來的數」的規律與理由，以及允許負數之後的發現。"}, {"k": "證明", "t": "任何數的 0 次方都是 1，那 0 的 0 次方是多少？數學家為什麼會為這件事吵架？", "c": "這一章用「指數律不准壞掉」說明 *a*^{0} ＝ 1。可是 0^{n} ＝ 0，兩條規律在 0^{0} 撞在一起。", "s": ["列出 3^{0}、2^{0}、1^{0}、0.1^{0}……的規律，也列出 0^{3}、0^{2}、0^{1}……的規律。各指向什麼答案？", "查一查：計算機、試算表、程式語言各把 0^{0} 算成多少？", "選一個立場，說明在什麼情況下規定 0^{0} ＝ 1 比較方便，什麼情況下乾脆不定義比較安全。"], "show": "兩條互相衝突的規律、工具實測的結果，以及自己的立場與理由。"}, {"k": "應用", "t": "一則謠言，每個知道的人每天再告訴一個還不知道的人。幾天會傳遍金門？", "c": "每天人數加倍，就是 2 的次方。這一章學了指數，正好可以估算。", "s": ["第 0 天 1 人知道，寫出第 1、2、3、……天知道的人數。", "金門縣戶籍人口約 14 萬（查最新數字），最快第幾天就超過？用 2^{10} ≈ 10^{3} 估算，再用計算機核對。", "真實情況會比這個慢，列出至少三個原因，並修改模型（例如「告訴的人有一半早就知道了」）。"], "show": "人數表或圖、估算過程、和真實情況的差距分析，以及修改後的模型。"}, {"k": "連結", "t": "電腦裡只有 0 和 1，怎麼存「負數」？為什麼 127 ＋ 1 可能會變成 −128？", "c": "這一章的數線是一條直線。電腦裡的數線卻是一個「圈」：8 個位元只能存 256 種數。", "s": ["查「二補數」：8 位元怎麼表示 −1、−5、−128？", "把 0～255 排成一個圓，標出哪些代表正數、哪些代表負數。127 再加 1 會走到哪裡？", "查一個真實的「溢位」事件（例如遊戲裡的數值突然變成負的），說明發生了什麼事。"], "show": "8 位元的「數字圈」圖、幾個數的二補數寫法，以及一個溢位事件的分析。"}, {"k": "創作", "t": "只用四個 4 和加減乘除、括號，能湊出 0 到 20 的哪些數？加上次方以後呢？", "c": "例如 4 ＋ 4 − 4 − 4 ＝ 0、4 ÷ 4 ＋ 4 ÷ 4 ＝ 2。湊算式考的是運算順序和括號。", "s": ["先只用加減乘除與括號，盡量湊出 0～20，做成一張表。", "哪幾個數怎麼湊都湊不出來？試著說明為什麼很難。", "再允許用次方（例如 4^{4}）或把兩個 4 寫成 44，表能補滿嗎？設計一份「四個 4」挑戰卡給同學玩。"], "show": "0～20 的算式表（標出湊不出來的）、新增規則後的補完，以及挑戰卡與同學的作答紀錄。"}]}, {"id": "g7a-2", "sem": "七上", "code": "七上2", "name": "分數的運算", "title": "拆開來看／分母是單位", "qs": [{"k": "推廣", "t": "輾轉相除法最多要除幾次？哪兩個數讓它做得最久？", "c": "這一章用輾轉相除法求最大公因數。有的數對兩三步就做完，有的要做很多步。", "s": ["隨便選 10 組兩位數，記錄各要除幾次。", "在 100 以內，找出步數最多的一組。它們有什麼特別？（提示：把那串除法的商和餘數列出來。）", "如果數字變成 1000 以內，最多要幾步？猜一個規律。"], "show": "步數紀錄表、步數最多的數對與它的特徵，以及自己的猜想。"}, {"k": "反過來", "t": "6 的因數（不含自己）1 ＋ 2 ＋ 3 ＝ 6，28 也一樣。還有哪些這種「完美數」？它們長什麼樣子？", "c": "這一章用質因數分解算因數。反過來問：什麼樣的數，它的因數加起來剛好等於自己？", "s": ["用質因數分解算出 1～500 中每個數的「真因數和」，找出完美數。", "把找到的完美數做質因數分解，有什麼共同的樣子？", "查一查：有沒有奇數的完美數？完美數有無限多個嗎？這兩個問題現在解決了沒？"], "show": "完美數的質因數分解、自己找到的規律，以及兩個未解問題的現況。"}, {"k": "證明", "t": "什麼樣的分數會變成有限小數、什麼樣的會循環？循環節最長可以多長？", "c": "1/8 ＝ 0.125 會停，1/3 ＝ 0.333…會循環，1/7 ＝ 0.142857142857…循環 6 位。", "s": ["把分母 2～20 的單位分數都化成小數，分成「會停」和「會循環」兩類。會停的分母有什麼共同點？", "做 1 ÷ 7 的長除法，記下每一步的餘數。餘數最多有幾種？為什麼一定會開始循環？", "1/17 的循環節有幾位？1/41 呢？分母是 *p* 時，循環節最多幾位？"], "show": "分類表、長除法的餘數紀錄，以及「一定會循環」與「最多幾位」的說明。"}, {"k": "應用", "t": "地球繞太陽一圈 1 年，火星大約 1.88 年。地球和火星多久「排成一直線」一次？", "c": "兩個人在操場上同向繞圈，快的人多久追上慢的人一次？行星的「會合週期」是同一個問題，只是速度要用分數表示。", "s": ["先算操場題：甲跑一圈 2 分鐘、乙跑一圈 3 分鐘，同時同地出發，甲多久追上乙？用「每分鐘跑幾分之幾圈」想。", "用同樣的方法算地球與火星的會合週期。", "查火星「最接近地球」的年份（火星大接近），和算出來的週期對得起來嗎？"], "show": "操場題與行星題的計算、真實資料的比對，以及一般的公式。"}, {"k": "連結", "t": "質數有無限多個，那「差 2 的質數」（像 11 和 13、17 和 19）也有無限多對嗎？", "c": "這一章證明過質數有無限多個。可是只要換一個小小的問法，就變成數學家到今天都還沒解決的問題。", "s": ["列出 200 以內所有差 2 的質數對，數一數每 50 個數裡有幾對，越往後越少嗎？", "查一查 2013 年張益唐的研究：他證明了什麼？「7000 萬」和後來的「246」是什麼意思？", "說說看：為什麼「質數無限多」可以用一頁證完，「孿生質數無限多」卻這麼難？"], "show": "孿生質數表與分布觀察、張益唐研究的白話說明，以及自己對「為什麼這麼難」的看法。"}, {"k": "創作", "t": "替小學五年級設計一套分數教具，讓他們不會再犯「1/2 ＋ 1/3 ＝ 2/5」的錯。", "c": "這一章說「分母是單位」。能把這句話做成小學生摸得到的東西，代表自己真的懂了。", "s": ["訪問一位小學老師或回想自己：學分數時最常見的錯有哪些？", "設計教具（分數條、圓餅、摺紙、量杯……）和一段 5 分鐘的教學步驟，讓學生自己發現為什麼要通分。", "找一位弟妹或小學生試教，記錄他卡在哪裡，再修改一次。"], "show": "教具照片或設計圖、教學步驟、試教紀錄與修改前後的比較。"}]}, {"id": "g7a-3", "sem": "七上", "code": "七上3", "name": "一元一次方程式", "title": "先給它一個名字", "qs": [{"k": "推廣", "t": "把一個數的個位數搬到最前面，新數剛好是原數的 2 倍。這樣的數存在嗎？最小是多少？", "c": "這一章最後一段有「首位搬家」：把開頭的 1 搬到最後。現在反過來搬，而且倍數換成 2。", "s": ["設原數的個位數是 *d*，其他部分是 *x*（有 *n* 位），把原數和新數都用 *x*、*d*、*n* 寫出來。", "列出方程式。*n* 要多大，*x* 才會是整數？（可以用計算機一位一位試。）", "找到答案後驗算。再試試看「3 倍」「4 倍」有沒有解。"], "show": "方程式的推導、找答案的過程與驗算，以及換倍數之後的發現。"}, {"k": "反過來", "t": "爸爸 40 歲、兒子 10 歲。在哪些年份，爸爸的年齡剛好是兒子的整數倍？", "c": "年齡問題通常是「已知倍數，求幾年後」。反過來問：哪些倍數真的會出現？", "s": ["設 *t* 年後爸爸是兒子的 *k* 倍，列出方程式，把 *t* 用 *k* 表示。", "*k* ＝ 2、3、4、5、6、……逐一檢查，*t* 是不是整數？（*t* 可以是負的，代表以前。）", "找出規律：會出現的倍數，和父子的年齡差 30 有什麼關係？換一對父子再驗證。"], "show": "方程式與倍數表、自己找到的規律，以及換一組年齡的驗證。"}, {"k": "證明", "t": "0.999…（9 一直寫下去）等於 1 嗎？用方程式說明，並回應三種常見的反對意見。", "c": "這一章用「給它一個名字」解方程式。把 0.999…叫做 *x*，就能用等量公理算出它是多少。", "s": ["設 *x* ＝ 0.999…，算 10*x* − *x*，解出 *x*。", "蒐集三種反對意見（例如「它永遠差一點點」「最後一位是 9 不是 0」），一一回應。", "再用另一種方法說明：1/3 ＝ 0.333…，兩邊乘 3 會得到什麼？兩種方法的說服力一樣嗎？"], "show": "兩種證明、三種反對意見與回應，以及自己認為最有說服力的說法。"}, {"k": "應用", "t": "阿基米德怎麼不弄壞王冠，就判斷金匠有沒有摻銀？", "c": "傳說國王懷疑王冠摻了銀。金和銀一樣重時體積不同（每立方公分：金約 19.3 公克、銀約 10.5 公克），把王冠放進水裡量體積，就能列方程式。", "s": ["假設王冠重 1000 公克、排開的水是 60 立方公分。設金有 *x* 公克，列出體積的方程式並解出 *x*。", "如果王冠全是金，排開的水應該多少？量測誤差 1 立方公分會讓答案差多少？", "用家裡的東西做一次：量一塊黏土或一顆石頭的質量與排水體積，算出它的密度。"], "show": "方程式與解、誤差的影響，以及自己的實測紀錄。"}, {"k": "連結", "t": "蹺蹺板怎麼才會平衡？用一元一次方程式找出平衡點，再用直尺和硬幣驗證。", "c": "槓桿原理：兩邊「重量 × 到支點的距離」相等時就會平衡。這就是一條等式。", "s": ["用一把直尺、一支鉛筆當支點、幾枚硬幣做實驗：左邊放 3 枚在 10 公分處，右邊放 2 枚要放在哪裡？先列式預測，再實測。", "如果支點可以移動，一邊放 50 公斤的人、一邊放 30 公斤的人，板長 4 公尺，支點要放在哪裡？", "直尺本身也有重量，實驗結果和預測差多少？怎麼把它算進去？"], "show": "實驗紀錄（預測與實測）、方程式，以及誤差原因的分析。"}, {"k": "創作", "t": "出一份「解了會懷疑人生」的方程式陷阱題集：每一題都藏一種陷阱，並寫好解析。", "c": "這一章遇過三種命運（一解、無解、每個數都是解），也遇過解出負的人數。把這些陷阱變成題目，給同學挑戰。", "s": ["至少設計 5 題，陷阱各不相同（例如無解、無限多解、解是負數、單位不一致、乘 0 失去解）。", "每一題寫出完整解析：陷阱在哪裡、怎麼看出來。", "找五位同學試做，記錄每一題有幾個人中陷阱，再修改題目。"], "show": "陷阱題集、解析、試做的統計與修改紀錄。"}]}, {"id": "g7b-1", "sem": "七下", "code": "七下1", "name": "二元一次聯立方程式", "title": "一條不夠", "qs": [{"k": "推廣", "t": "3 × 3 的幻方（每一列、每一行、兩條對角線的和都一樣），中間一定是 5 嗎？一共有幾種？", "c": "1～9 填進九格，八條線的和都相等。九個未知數、八條等式——這是一個很大的聯立方程式。", "s": ["九個數的總和是多少？三列加起來呢？所以每一條線的和是多少？", "把「經過中間那一格」的四條線加起來，會得到什麼？用它解出中間那一格。", "接著推出四個角和四個邊各能放什麼，一共有幾種幻方？轉動、翻面算不算不同？"], "show": "推導過程（不是只靠試）、所有幻方的列表，以及「轉動翻面算同一種」時的種數。"}, {"k": "反過來", "t": "速食店只公布套餐的價格。能不能反推出漢堡、薯條、飲料各自多少錢？", "c": "套餐 A ＝ 漢堡 ＋ 薯條、套餐 B ＝ 漢堡 ＋ 飲料……每一個套餐就是一條式子。", "s": ["找一家真實店家的菜單（或自己設計），把套餐寫成聯立方程式。三樣東西至少要幾個套餐才算得出來？", "解出來的單價，和店家公布的單點價格一樣嗎？如果不一樣，差在哪裡？", "有沒有可能套餐的資訊「互相矛盾」，聯立方程式無解？那代表什麼？"], "show": "菜單資料、聯立方程式與解，以及解與單點價格的比較和解讀。"}, {"k": "證明", "t": "加減消去法為什麼不會「漏掉」或「多出」解？", "c": "把兩條式子相加相減，得到新的式子。新的聯立方程式和原來的，解一定一樣嗎？", "s": ["試一試：*x* ＋ *y* ＝ 5、*x* − *y* ＝ 1。把它換成「兩式相加」與「兩式相減」兩條，解一樣嗎？", "如果把它換成「兩式相加」和「兩式相加的 2 倍」，還解得出來嗎？少了什麼？", "說明：什麼樣的「換式子」保證解不變？（提示：換完之後，能不能再換回去？）"], "show": "例子與反例、自己整理的「安全換法」規則，以及為什麼安全的理由。"}, {"k": "應用", "t": "一個圓環有四個路口，已知每個路口進出的車輛數，圓環每一段路上有多少車？", "c": "每一個路口都是「進來的車 ＝ 出去的車」，就是一條式子。四個路口、四段路，看起來剛好。", "s": ["自己設定四個路口每小時進、出圓環的車輛數（進出總數要相等），把四段路的車流量設成 *a*、*b*、*c*、*d*，列出四條式子。", "解解看。四條式子能釘死四個未知數嗎？為什麼？", "如果每一段路的車流量不能是負的，*a* 的範圍是多少？交通單位要知道什麼，才能確定答案？"], "show": "圓環示意圖、方程式、解的情況與範圍，以及給交通單位的建議。"}, {"k": "連結", "t": "化學方程式的係數怎麼找？它其實是一組聯立方程式。", "c": "丙烷燃燒：□C_{3}H_{8} ＋ □O_{2} → □CO_{2} ＋ □H_{2}O。反應前後每一種原子的個數要相等。", "s": ["把四個係數設成 *a*、*b*、*c*、*d*，對碳、氫、氧各列一條式子。", "三條式子、四個未知數，怎麼解？（提示：先讓 *a* ＝ 1。）", "再平衡兩個化學方程式（可以問理化老師挑），並說明為什麼係數只能決定到「比」。"], "show": "原子守恆的式子、解的過程、另外兩個方程式，以及「為什麼只能決定比」的說明。"}, {"k": "創作", "t": "寫一份「解任何二元一次聯立方程式」的步驟說明書，讓完全不懂的人照著做也解得出來——包括無解和無限多解。", "c": "電腦解題靠的是一步一步的指令（演算法）。把這一章的解法變成指令，就要想清楚每一種例外。", "s": ["把一般式寫成 *ax* ＋ *by* ＝ *c*、*dx* ＋ *ey* ＝ *f*，設計每一步要做什麼。", "畫成流程圖，標出「什麼時候會無解」「什麼時候無限多解」的判斷點。", "找一位同學（或家人）只看流程圖解三題，記錄他在哪裡卡住，再修改。"], "show": "流程圖、三題測試的紀錄，以及修改前後的差別。"}]}, {"id": "g7b-2", "sem": "七下", "code": "七下2", "name": "直角坐標與二元一次方程式的圖形", "title": "一個數不夠", "qs": [{"k": "推廣", "t": "兩點的中點是坐標平均。那 *A*、*B* 之間 1：2 的點在哪裡？三角形的重心為什麼剛好是三個頂點坐標的平均？", "c": "這一章用坐標描述點的位置。中點公式只是「分點」的一個特例。", "s": ["*A*(0, 0)、*B*(6, 3)，找出把 *AB* 分成 1：2 的點，再找 2：1 的點。猜一個一般公式。", "三角形三頂點 (0, 0)、(6, 0)、(3, 6)，畫出三條中線，量出交點，和三個頂點坐標的平均比一比。", "換一個三角形再驗證。為什麼會這樣？（提示：重心在中線上的位置是 2：1。）"], "show": "分點的實驗與公式、重心的驗證，以及自己的說明。"}, {"k": "反過來", "t": "已知平行四邊形的三個頂點，第四個頂點在哪裡？一共有幾種可能？", "c": "給 (0, 0)、(4, 1)、(1, 3) 三點，要補一點圍成平行四邊形。", "s": ["在方格紙上試著補出第四點，找得到幾個？", "用「平移」的想法說明每一個點的坐標怎麼算。", "三種答案各自用到哪兩點當對角？如果三點在同一條直線上，會怎樣？"], "show": "三種答案的圖與坐標、平移的說明，以及三點共線的特殊情況。"}, {"k": "證明", "t": "在方格紙上，能不能找到三個格子點，連成一個正三角形？", "c": "方格紙上很容易畫出正方形，連斜放的都有。正三角形呢？", "s": ["先試著畫畫看，找最接近的幾個例子，量量看三邊長。", "用這一章「框起來再減掉」的方法，格子點三角形的面積一定是什麼樣的數？", "正三角形的面積是「邊長平方 × √3/4」。邊長平方是整數時，這個面積可能是上一題那種數嗎？（八上學到 √3 不是分數以後就能說清楚。）"], "show": "最接近的嘗試、格子點三角形面積的規律，以及不可能的理由。"}, {"k": "應用", "t": "從家裡到學校，「直線距離」和「實際要走的路」差多少？金門哪兩個地方最「繞」？", "c": "在地圖上畫坐標，兩點之間的直線距離可以算出來；實際的路要沿著道路走。兩者的比值叫做「迂迴係數」。", "s": ["在地圖上量出至少 5 組地點的直線距離，再用線上地圖查實際路程，算出比值。", "哪一組最大？原因是什麼（海、山、道路設計）？", "如果一座城市的道路是棋盤式的，迂迴係數大概會是多少？試著算幾個例子。"], "show": "地點與距離表、比值的比較圖，以及對「最繞」那一組的解釋。"}, {"k": "連結", "t": "電腦螢幕也是坐標平面，但它的 *y* 軸往下。像素坐標怎麼和數學坐標互換？", "c": "螢幕上每個像素都有坐標，原點通常在左上角、往右是 *x*、往下是 *y*。", "s": ["查一查常見螢幕的解析度（例如 1920 × 1080），中心點的像素坐標是多少？", "數學坐標的 (0, 0) 放在螢幕正中央、每 10 像素算 1 單位，寫出兩種坐標的換算規則。", "用方格紙或試算表畫一張 16 × 16 的像素畫，並寫出幾個關鍵點在兩種坐標下的位置。"], "show": "換算規則與例子、像素畫，以及「為什麼螢幕要讓 *y* 往下」的查證或推測。"}, {"k": "創作", "t": "設計一個坐標尋寶或密室逃脫關卡：每一個線索都要用到坐標、對稱或直線方程式。", "c": "這一章學了點的坐標、對稱點、直線方程式和交點。把它們變成謎題，讓同學一關一關解。", "s": ["設計 4～6 個關卡，例如「寶藏在兩條直線的交點」「鑰匙在 (3, −2) 對 *y* 軸的對稱點」。", "畫出完整的地圖與標準答案，檢查每一關答案唯一。", "請同學試玩，記錄時間和卡關的地方，再修改。"], "show": "關卡說明、地圖與答案、試玩紀錄與修改。"}]}, {"id": "g7b-3", "sem": "七下", "code": "七下3", "name": "比與比例式", "title": "換一個基準看", "qs": [{"k": "推廣", "t": "兩種濃度的糖水要混成第三種濃度，各要倒多少？為什麼「交叉相減」就是答案？", "c": "濃度 10% 和 25% 的糖水要混出 15%，有一個口訣叫「十字交叉法」：把差寫在對角，就得到比例。", "s": ["用口訣做一次：10% 和 25% 混成 15%，比例是多少？用一元一次方程式驗算。", "說明口訣為什麼對：多出來的糖和不夠的糖要互相抵消。畫一張圖。", "推廣：三種濃度要混出一種，比例還唯一嗎？平均速度、平均成績也能用這個口訣嗎？"], "show": "口訣的驗算、圖解的說明，以及推廣到三種或其他情境的發現。"}, {"k": "反過來", "t": "想要「踩一圈，腳踏車前進 5 公尺」，前後齒盤要配幾齒？", "c": "腳踏車踩一圈，前齒盤轉一圈，後輪轉「前齒數 ÷ 後齒數」圈，前進的距離是那麼多圈的輪子周長。", "s": ["量一台腳踏車的輪子周長（推一圈量地上），數前後齒數，算出踩一圈前進多遠，再實際推推看驗證。", "反過來：要踩一圈前進 5 公尺，齒數比要多少？找出幾種真實存在的齒數組合。", "為什麼爬坡要用小齒比、平路用大齒比？用比例說明。"], "show": "量測與驗證、反推的計算與組合表，以及爬坡與平路的說明。"}, {"k": "證明", "t": "如果 *a*/*b* ＝ *c*/*d*，那麼 (*a* ＋ *c*)/(*b* ＋ *d*) 也等於它們嗎？如果兩個比不相等呢？", "c": "「分子加分子、分母加分母」平常是錯的算法。可是在某些情況下，它竟然是對的。", "s": ["先試 2/3 ＝ 4/6，算 (2 ＋ 4)/(3 ＋ 6)。再試幾組，說明為什麼相等（提示：設 *a* ＝ *kb*、*c* ＝ *kd*）。", "如果 *a*/*b* ＜ *c*/*d*（例如 1/3 和 1/2），(*a* ＋ *c*)/(*b* ＋ *d*) 會落在哪裡？試很多組，猜一個規律並說明。", "用「兩班的及格率合併」說明這件事的意義。"], "show": "相等情況的證明、不相等時的規律與說明，以及一個生活例子。"}, {"k": "應用", "t": "金門的老年人口比例和扶養比，跟台灣其他縣市比起來怎麼樣？", "c": "「扶養比」是用 15～64 歲的人當基準，看他們要扶養多少 0～14 歲和 65 歲以上的人。換一個基準，同一份人口資料會說出不同的事。", "s": ["查內政部或縣府的人口統計，找出金門和至少三個縣市各年齡層的人數。", "算出老年人口比例、扶養比、老化指數（65 歲以上 ÷ 0～14 歲），做成比較表。", "三種指標排出來的名次一樣嗎？各自適合回答什麼問題？"], "show": "資料來源、三種指標的計算與比較表，以及「哪個指標回答哪個問題」的說明。"}, {"k": "連結", "t": "為什麼弦長比 2：3 的兩個音聽起來特別和諧？畢達哥拉斯怎麼用比例定出音階？", "c": "撥一條弦，再把弦長縮成一半，音高高一個八度；縮成 2/3，就是「五度音」。古希臘人用簡單的整數比定出整套音階。", "s": ["用手機的調音 App 或吉他、尤克里里，驗證弦長一半時音高是不是高八度。", "從一個音開始，一直乘 3/2（太高就除以 2 拉回來），算出 12 個音的頻率比。", "乘了 12 次以後，有沒有剛好回到原來的音（的某個八度）？差多少？這個差距造成什麼問題？"], "show": "實驗紀錄、五度相生的計算表，以及「回不去」的說明。"}, {"k": "創作", "t": "把一份 4 人份的食譜放大成 30 人份。哪些東西可以照比例放大？哪些不行？", "c": "材料照比例乘就好嗎？鍋子的大小、加熱的時間、鹽的用量，可能都不是這樣。", "s": ["選一份真實食譜，先全部照比例放大，列出新份量。", "找出至少三樣「不能直接照比例」的東西（例如烤箱溫度、烹煮時間、鍋子面積），查資料或問家人說明原因。", "寫一份「30 人份企劃書」，含採購清單、器材、時間安排，有機會就實際做一次。"], "show": "原食譜與放大表、不能照比例的項目與理由，以及企劃書。"}]}, {"id": "g7b-4", "sem": "七下", "code": "七下4", "name": "一元一次不等式", "title": "答案是一整段", "qs": [{"k": "推廣", "t": "兩個未知數的不等式畫在坐標平面上，是一整片區域。工廠要怎麼安排生產，利潤最大？", "c": "一元一次不等式的解是數線上的一段。兩個未知數時，解會變成平面上的一塊區域。", "s": ["在坐標平面上塗出 *x* ＋ *y* ≤ 10、*x* ≥ 0、*y* ≥ 0 的區域。再加上 2*x* ＋ *y* ≤ 14，區域變成什麼形狀？", "設計一個情境：做一個甲產品賺 30 元、乙產品賺 20 元，材料和時間有限（就是上面兩個條件）。各做幾個利潤最大？", "試試區域裡的很多點，最大值出現在哪裡？為什麼？"], "show": "可行區域的圖、情境與條件、各點利潤的比較，以及「最大值在哪裡」的觀察。"}, {"k": "反過來", "t": "成績單只寫「五科平均 85 分（四捨五入）」，能反推出總分是多少嗎？", "c": "四捨五入以後的數字，背後其實是一整段。反過來推，答案也是一整段。", "s": ["把「平均四捨五入是 85」寫成不等式，求出總分的範圍（總分是整數）。", "如果平均寫到小數第一位（85.4 分），範圍變多小？", "設計一題：給兩三個「四捨五入後的資訊」，剛好可以推回唯一的原始數字。"], "show": "不等式與範圍、精確度和範圍大小的關係，以及自己設計的反推題。"}, {"k": "證明", "t": "周長固定的長方形，為什麼正方形面積最大？不用公式，用一張圖證明。", "c": "往後延伸填過周長 20 的長方形表，發現長寬越接近，面積越大。這件事能不能「看」出來？", "s": ["把四個「長 *a*、寬 *b*」的長方形繞成一個大正方形（中間會空出一個小正方形）。大正方形的邊長是多少？", "比較大正方形的面積和四個長方形的面積，中間空出的那塊代表什麼？", "由此說明：*a* ＋ *b* 固定時，*ab* 什麼時候最大？最大是多少？"], "show": "拼圖的圖解、推理過程，以及結論（含「等號什麼時候成立」）。"}, {"k": "應用", "t": "尺上量到 12.3 公分，真實長度可能是多少？兩個量到的數相加、相乘以後，誤差會變多大？", "c": "量測一定有誤差。12.3 公分代表「最接近的 0.1 公分是 12.3」，真實值其實是一整段。", "s": ["把「量到 12.3 公分」寫成不等式。", "長方形量到長 12.3、寬 4.6 公分，周長和面積各可能在什麼範圍？", "自己量一個東西的長、寬，算出面積的範圍。範圍有多寬？量得更準一位，範圍會縮多少？"], "show": "量測的不等式、周長與面積的範圍計算，以及自己實測的結果。"}, {"k": "連結", "t": "電梯、橋梁的限重標示，為什麼比真正會壞掉的重量少很多？", "c": "工程師會在「真正撐得住的重量」和「允許的重量」之間留一段距離，叫做安全係數。", "s": ["找一部電梯或一座橋的限重標示（拍照），查它大約能承受多少，算出安全係數。", "用不等式寫出「實際載重 ≤ 限重 ≤ 極限 ÷ 安全係數」的關係。", "為什麼不同東西的安全係數不一樣（電梯、建築、繩索）？查資料說明。"], "show": "真實標示與資料、不等式關係、安全係數的比較與解釋。"}, {"k": "創作", "t": "替校運會設計一套「成績換積分」的規則：跑得快的人一定分數高、各項滿分公平。", "c": "100 公尺跑越少秒越好，跳遠跳越遠越好，各項的單位不同。要合成一個總積分，規則就得用不等式檢查。", "s": ["選三個項目，設計把成績換成 0～100 分的規則（可以是一次式，加上上下限）。", "用不等式說明：A 的成績比 B 好，A 的積分一定不比 B 低。", "用班上（或自設）的資料試算，看看會不會有「某一項特別吃香」的情況，再修改。"], "show": "換算規則、單調性的說明、試算結果與修改紀錄。"}]}, {"id": "g7b-5", "sem": "七下", "code": "七下5", "name": "統計圖表與資料分析", "title": "誰能代表大家", "qs": [{"k": "推廣", "t": "改變權重，第一名就換人？設計一組資料，讓三種不同的計分方式選出三個不同的第一名。", "c": "學期成績、選拔評分常常是「加權平均」。權重一改，排名可能整個翻過來。", "s": ["自己設定三位同學在三個項目的分數。", "設計三組權重，讓每一組選出不同的第一名。", "找一個真實的加權例子（例如學期成績的計算方式、比賽評分規則），說說權重是怎麼決定的、公不公平。"], "show": "分數表、三組權重與結果，以及對真實例子的評論。"}, {"k": "反過來", "t": "只給一張直方圖，能還原每個人的分數嗎？最多能知道什麼？", "c": "分組會丟掉資訊。反過來問：從圖上還留下了什麼？", "s": ["找一張真實的直方圖（或用班上資料自己畫），列出從圖上「一定知道」「可以估計」「完全不知道」的事。", "從直方圖估平均數，最大可能值和最小可能值各是多少？（每組的人都擠在最左邊或最右邊。）", "中位數在哪一組一定知道嗎？它在組裡的位置知道嗎？"], "show": "三欄整理表、平均數的上下限計算，以及中位數能知道到什麼程度。"}, {"k": "證明", "t": "平均數一定在最大值和最小值之間嗎？兩班合併後的平均，一定介於兩班平均之間嗎？", "c": "這兩件事聽起來理所當然。可是「理所當然」要怎麼說清楚？", "s": ["用「每一個數都 ≤ 最大值」把所有數加起來，說明平均 ≤ 最大值。最小值同理。", "A 班 20 人平均 75、B 班 30 人平均 70，合併平均為什麼一定在 70 和 75 之間？用式子說明。", "那「中位數」也一定介於兩班中位數之間嗎？找一個反例或說明理由。"], "show": "兩個證明，以及中位數的反例（或證明）。"}, {"k": "應用", "t": "金門的觀光人數這十年怎麼變化？用圖表說一個有根據的故事。", "c": "縣府和交通部觀光署都有公開的旅客統計。這一章學的圖表與代表值，可以拿來讀真實的資料。", "s": ["找金門近十年的旅客人數（或小三通旅客數），註明資料來源。", "選最合適的圖畫出來，算出平均數、中位數，找出變化最大的年份。", "提出一個解釋（例如疫情、政策、交通），並說明這個解釋還需要什麼資料才能確認。"], "show": "資料來源、圖表、代表值，以及有根據的解釋與限制。"}, {"k": "連結", "t": "影音平台怎麼判斷一支影片「好不好」？觀看次數、按讚比例、平均觀看時間，哪一個最能代表？", "c": "平台每天都在用統計做決定。不同的代表值，會選出不同的「好影片」。", "s": ["選 5 支影片，記錄觀看次數、按讚數、片長等公開數字，算出幾種指標。", "用不同指標排名，結果一樣嗎？哪一種指標容易被灌水或誤導？", "如果自己設計推薦規則，會怎麼結合這些數字？說出理由。"], "show": "資料表、不同指標的排名比較，以及自己的推薦規則。"}, {"k": "創作", "t": "做一張介紹金門某個主題的資訊圖表，至少用三種圖，每一種都說明為什麼選它。", "c": "資訊圖表要讓人一眼看懂。選哪一種圖，取決於想讓讀者看到什麼。", "s": ["選一個主題（人口、天氣、觀光、學校、特產），蒐集真實資料並註明來源。", "至少用三種不同的圖（圓形圖、長條圖、折線圖、直方圖……），每一張寫一句「為什麼用這種圖」。", "請三位同學看 30 秒，再問他們記得什麼，檢查有沒有傳達出想說的事。"], "show": "資訊圖表本身、選圖理由，以及同學讀圖的回饋。"}]}, {"id": "g7b-6", "sem": "七下", "code": "七下6", "name": "生活中的幾何", "title": "正對著看", "qs": [{"k": "推廣", "t": "牆壁、地板上重複的圖案，一共有幾種「對稱的方式」？找 5 種不同的磁磚或花布來分類。", "c": "這一章學了線對稱和點對稱。重複的圖案（壁紙、磁磚、布料）還有平移、旋轉、滑移反射等對稱。", "s": ["拍或找 5～8 種重複圖案，每一種標出：能平移嗎？有對稱軸嗎？轉幾度會重合？", "依照對稱的方式分類，哪幾張其實是同一類？", "查一查：數學家證明平面重複圖案只有 17 種對稱類型。挑其中 3 種畫出來。"], "show": "圖案照片與對稱標示、分類表，以及自己畫的三種類型。"}, {"k": "反過來", "t": "一個圖形如果有兩條對稱軸，它還一定有什麼對稱？兩條軸夾 60°、90°、45° 時各怎樣？", "c": "先對一條線翻、再對另一條線翻，等於做了什麼？這一章的兩面鏡子已經給了線索。", "s": ["在紙上畫兩條夾 90° 的線，把一個字母（例如 F）先對第一條翻、再對第二條翻，最後的 F 和原來的差了什麼？", "換成夾 60°、45° 再做一次。", "所以有兩條對稱軸夾 θ 角的圖形，一定還有轉幾度的旋轉對稱？用正方形、正六邊形檢查。"], "show": "翻兩次的作圖紀錄、規律，以及用正多邊形的檢查。"}, {"k": "證明", "t": "找出兩個「三視圖完全一樣、卻是不同」的立體，並證明它們真的不一樣。", "c": "這一章說三視圖的代價是「深度被壓扁」。壓扁以後，不同的立體可能留下同樣的三張圖。", "s": ["用積木或方格紙設計兩個立體，讓前視、上視、右視三張圖完全相同。", "說明它們「真的不一樣」：例如積木數不同，或某一塊的位置不同。", "三視圖相同的立體，積木數最多和最少差多少？自己設定一組三視圖試試看。"], "show": "兩個立體的圖與三視圖、「不一樣」的證明，以及最多最少的探究。"}, {"k": "應用", "t": "全身鏡至少要多高才照得到全身？要掛多高？站遠一點會不會照得比較多？", "c": "很多人以為站遠一點就能在小鏡子裡看到全身。用這一章的「鏡中的像和物對稱」來檢查。", "s": ["畫側面圖：一個人身高 160 公分、眼睛高 150 公分，站在鏡子前 1 公尺。找出看到頭頂和腳尖的光線打在鏡子的哪裡。", "改成站 2 公尺、3 公尺，鏡子需要的高度變了嗎？", "在家用鏡子和便利貼實測：在鏡子上貼出「剛好看到頭頂」和「剛好看到腳尖」的位置，量量看。"], "show": "側面光線圖、不同距離的比較，以及實測照片與數據。"}, {"k": "連結", "t": "萬花筒、潛望鏡、汽車後照鏡裡，各用了幾面鏡子、怎麼擺？畫出光線走的路。", "c": "這一章學了光碰到鏡子的反射，以及兩面鏡子會照出好幾個像。很多光學儀器就是幾面鏡子的組合。", "s": ["做一個簡單的潛望鏡（兩面鏡子、紙盒），說明兩面鏡子要擺幾度，為什麼。", "做一個三面鏡的萬花筒，看到的圖案有什麼對稱？鏡子夾角改成 45° 會怎樣？", "查汽車的後照鏡或照後鏡，有的是平面鏡、有的是凸面鏡，各有什麼好處和缺點？"], "show": "作品照片、光線路徑圖，以及三種儀器的比較。"}, {"k": "創作", "t": "只用一張紙，剪摺出一個立體（不能用膠帶黏，或只准黏一處），並畫出它的展開圖和三視圖。", "c": "展開圖、三視圖、摺紙，都是在平面和立體之間來回。設計一個自己的作品，讓別人照著做得出來。", "s": ["先試做正方體、三角柱等基本立體，再設計一個自己的造型（例如房子、風獅爺台座）。", "畫出精確的展開圖（含尺寸、摺線與剪線）和三視圖。", "請一位同學只看圖做一次，記錄哪裡看不懂，再修改說明。"], "show": "作品照片、展開圖、三視圖，以及同學試做的紀錄。"}]}, {"id": "g8a-1", "sem": "八上", "code": "八上1", "name": "乘法公式與多項式", "title": "把十換成 x", "qs": [{"k": "推廣", "t": "(*a* ＋ *b* ＋ *c*)^{2} 展開有幾項？(*a* ＋ *b* ＋ *c*)^{3}、(*a* ＋ *b* ＋ *c*)^{n} 呢？係數怎麼數？", "c": "這一章的 (*a* ＋ *b*)^{n} 有一張係數表（巴斯卡三角）。多一個字母，表會變成什麼樣子？", "s": ["展開 (*a* ＋ *b* ＋ *c*)^{2} 和 (*a* ＋ *b* ＋ *c*)^{3}，數一數各有幾項、每一項的係數。", "*a*^{2}*bc* 這種項的係數，怎麼「用數的」得到？（從 *n* 個括號裡各挑一個字母。）", "猜出 (*a* ＋ *b* ＋ *c*)^{n} 的項數公式，並把係數排成一個「巴斯卡三角錐」。"], "show": "展開與數項的過程、係數的「數法」說明、項數公式與三角錐圖。"}, {"k": "反過來", "t": "已知 *f*(1) ＝ 3、*f*(2) ＝ 7、*f*(3) ＝ 13、*f*(4) ＝ 21，*f*(*x*) 是什麼多項式？任何一串數都找得到多項式嗎？", "c": "這一章是「給多項式，算出值」。反過來：只給幾個值，能不能找回多項式？", "s": ["算相鄰兩個的差、差的差。哪一層開始固定？由此猜 *f* 是幾次多項式。", "設 *f*(*x*) ＝ *ax*^{2} ＋ *bx* ＋ *c*，用三個值列聯立方程式解出 *a*、*b*、*c*，再用第四個值檢查。", "如果只給 3、7、13 三個值，第四個值一定是 21 嗎？能不能找到另一個多項式，前三個一樣、第四個不一樣？"], "show": "差分表、聯立方程式與答案，以及「只給幾個值能不能確定」的討論。"}, {"k": "證明", "t": "1^{3} ＋ 2^{3} ＋ …… ＋ *n*^{3} ＝ (1 ＋ 2 ＋ …… ＋ *n*)^{2}，為什麼？", "c": "先算幾個：1 ＝ 1^{2}、1 ＋ 8 ＝ 9 ＝ 3^{2}、1 ＋ 8 ＋ 27 ＝ 36 ＝ 6^{2}……右邊的 1、3、6 都是三角數。", "s": ["驗證 *n* ＝ 1～6 都成立。", "畫一個邊長 1 ＋ 2 ＋ …… ＋ *n* 的大正方形，把它切成一圈一圈的 L 形，每一圈的面積是多少？", "用乘法公式說明「最外面那一圈的面積剛好是 *n*^{3}」。"], "show": "驗算表、L 形切割的圖，以及最外圈面積的代數說明。"}, {"k": "應用", "t": "以前的會計怎麼檢查乘法有沒有算錯？「棄九法」為什麼有效？", "c": "棄九法：把一個數的各位數字一直相加到剩一位（9 當成 0）。兩數相乘以後的結果，也要符合同樣的檢查。", "s": ["用棄九法檢查 3742 × 58 ＝ 217036 對不對。再檢查一個故意算錯的結果。", "把 3742 寫成 3*x*^{3} ＋ 7*x*^{2} ＋ 4*x* ＋ 2（*x* ＝ 10），再把 *x* 換成 1，得到什麼？為什麼 10 和 1 在「除以 9 的餘數」上一樣？", "棄九法抓不到哪一種錯？舉例。"], "show": "檢查的實例、用「把十換成 *x*」說明原理，以及抓不到的錯誤類型。"}, {"k": "連結", "t": "電腦要算 *x*^{100}，最少要做幾次乘法？", "c": "直接乘要 99 次。可是 *x*^{2} 再平方就是 *x*^{4}，一直平方，次方長得很快。", "s": ["用「一直平方」算 *x*^{64} 要幾次？*x*^{100} ＝ *x*^{64} × *x*^{32} × *x*^{4}，總共要幾次？", "把 100 寫成二進位，和上面的拆法有什麼關係？", "能不能比上面的方法更少次？試試看 *x*^{15}：一直平方的方法要幾次？有沒有更省的路？"], "show": "*x*^{100} 的乘法步驟、和二進位的對照，以及 *x*^{15} 的探究。"}, {"k": "創作", "t": "設計一個「猜多項式」的魔術：對方心裡想一個係數都是 0～9 的多項式，只問一個值就猜出全部係數。", "c": "如果 *f*(*x*) ＝ 3*x*^{2} ＋ 7*x* ＋ 4，那 *f*(10) ＝ 374——係數全寫在答案裡。這就是「把十換成 *x*」倒過來用。", "s": ["說明為什麼係數都在 0～9 時，問 *f*(10) 就夠了。", "如果係數可以是任何正整數（沒有上限），只問一次還夠嗎？想一個「問兩次」的辦法。（提示：先問 *f*(1)。）", "設計成一個可以表演的魔術，寫好台詞，找同學試演並記錄成功與失敗。"], "show": "原理說明、係數沒有上限時的解法，以及魔術的台詞與試演紀錄。"}]}, {"id": "g8a-2", "sem": "八上", "code": "八上2", "name": "平方根與畢氏定理", "title": "把面積翻回邊長", "qs": [{"k": "推廣", "t": "巴比倫人怎麼算 √2？「猜一個數、和 2 除以它取平均」為什麼越算越準，而且快得驚人？", "c": "這一章用直式開方法算平方根。四千年前的巴比倫人用的是另一個辦法。", "s": ["從 1 開始：(1 ＋ 2/1) ÷ 2 ＝ 1.5，再 (1.5 ＋ 2/1.5) ÷ 2 ＝ ？一直做下去，記錄每一次有幾位正確。", "用面積解釋：邊長 1.5 的正方形面積比 2 大，把它改成「面積 2、一邊 1.5」的長方形，另一邊是多少？取平均代表什麼？", "用同樣方法算 √10、√50，各要幾步才到小數第 6 位？和直式開方比，哪個快？"], "show": "每一步的數值表、面積的解釋，以及和直式開方的比較。"}, {"k": "反過來", "t": "斜邊是 25 的整數邊直角三角形有幾種？斜邊 65 呢？什麼樣的斜邊特別多？", "c": "這一章用畢氏定理從兩股算斜邊。反過來，只給斜邊，找所有整數的兩股。", "s": ["找出斜邊 25 的所有整數直角三角形。再找斜邊 5、13、65。", "斜邊 3、7、11、21 有嗎？列出 1～50 中「當得了斜邊」的數。", "觀察：當得了斜邊的數，質因數有什麼特徵？65 ＝ 5 × 13，為什麼它特別多？"], "show": "各斜邊的列表、1～50 的分類，以及自己猜出的規律。"}, {"k": "證明", "t": "√2 ＋ √3 是無理數嗎？無理數加無理數、乘無理數，一定還是無理數嗎？", "c": "這一章證明了 √2 不是分數。那把兩個無理數加起來或乘起來呢？", "s": ["找反例：兩個無理數相加是有理數、相乘是有理數，各舉一例。", "證明 √2 ＋ √3 是無理數。（提示：假設它是分數 *r*，兩邊平方。）", "整理一張表：有理 ± 有理、有理 ± 無理、無理 ± 無理、乘法……哪些一定、哪些不一定。"], "show": "反例、√2 ＋ √3 的證明，以及完整的整理表。"}, {"k": "應用", "t": "站在金門太武山頂，能看多遠？看得到廈門嗎？看得到台灣嗎？", "c": "地球是圓的，站得越高看得越遠。視線剛好擦過地面的那一點，和地心、眼睛連成一個直角三角形。", "s": ["畫圖：地球半徑 *R*、山高 *h*，視線碰到地面的點和地心連線垂直於視線。用畢氏定理寫出看得到的距離。", "查太武山的高度和地球半徑，算出能看多遠。再查金門到廈門、到台灣本島的距離。", "因為 *h* 比 *R* 小很多，距離可以近似成 √(2*Rh*)。為什麼可以這樣近似？誤差多少？"], "show": "示意圖、計算過程、和真實距離的比較，以及近似的說明。"}, {"k": "連結", "t": "手機螢幕的 PPI（每吋像素數）是怎麼算的？比較幾支手機，哪一支最細緻？", "c": "螢幕規格常寫「6.1 吋、1920 × 1080」。吋數是對角線，像素數是長和寬——中間缺的那一步就是畢氏定理。", "s": ["用畢氏定理算出 1920 × 1080 的對角線有幾個像素，再除以 6.1 吋。", "找 4 支手機或平板的規格，算出 PPI，和官方數字比一比。", "人眼在一般距離大約分辨得出多少 PPI？查資料說明「超過多少就看不出差別」。"], "show": "計算過程、比較表，以及「看不看得出差別」的說明。"}, {"k": "創作", "t": "畫一棵「畢氏樹」：每個正方形上長出兩個小正方形，畫到第 5 層，所有正方形的面積加起來是多少？", "c": "在正方形的上邊作一個直角三角形，再在兩股上各作正方形，然後對新的正方形重複同樣的事，就長成一棵樹。", "s": ["用 45°（等腰直角三角形）畫出前 4～5 層，每一層的正方形邊長是多少？", "每一層的正方形面積加起來是多少？為什麼每一層都一樣？", "改用 30°–60° 的直角三角形畫一棵歪的樹。面積的結論還成立嗎？畫出來比較兩棵樹。"], "show": "兩棵畢氏樹的作品、每一層面積的計算，以及「為什麼每層一樣」的說明。"}]}, {"id": "g8a-3", "sem": "八上", "code": "八上3", "name": "因式分解", "title": "拆成乘法才看得見", "qs": [{"k": "推廣", "t": "*x*^{n} − 1 可以分解成幾個因式？把 *n* ＝ 2～12 全部分解到底，找出規律。", "c": "這一章分解過 *x*^{2} − 1、*x*^{3} − 1。一直往上，會發現因式的個數藏著一個學過的東西。", "s": ["分解 *x*^{2} − 1、*x*^{3} − 1、*x*^{4} − 1、*x*^{6} − 1，分到整數係數不能再分為止。", "數一數每一個分成幾個因式，和 *n* 有什麼關係？用 *x*^{12} − 1 檢驗這個猜想。", "*x* − 1 每一次都出現，*x* ＋ 1 什麼時候出現？*x*^{2} ＋ *x* ＋ 1 呢？"], "show": "分解結果表、因式個數的規律與驗證，以及每個因式「什麼時候出現」的整理。"}, {"k": "反過來", "t": "*x*^{2} ＋ *bx* ＋ *c* 什麼時候能在整數範圍分解？把能分解的 (*b*, *c*) 點在坐標平面上，會看到什麼？", "c": "這一章是給一個式子，問能不能分解。反過來：哪些 *b*、*c* 能分解？", "s": ["固定 *c* ＝ 24，找出所有讓 *x*^{2} ＋ *bx* ＋ 24 能分解的整數 *b*。", "讓 *b*、*c* 都在 −10～10 之間，把能分解的點畫在坐標平面上。", "這些點排成什麼樣子？能分解的條件，和 *b*^{2} − 4*c* 有什麼關係？"], "show": "*c* ＝ 24 的結果、坐標圖，以及自己找到的判斷條件。"}, {"k": "證明", "t": "*n*^{3} − *n* 一定是 6 的倍數。那 *n*^{5} − *n* 一定是 30 的倍數嗎？*n*^{7} − *n* 呢？", "c": "這一章最後一段用分解證明了 *n*^{3} − *n* 是 6 的倍數。把次方提高，會發生什麼事？", "s": ["先代 *n* ＝ 2～10 算 *n*^{5} − *n*，它們的最大公因數是多少？*n*^{7} − *n* 呢？", "分解 *n*^{5} − *n*，說明為什麼一定被 2、3、5 整除。（被 5 整除的部分：把 *n* 按除以 5 的餘數分五種情況。）", "猜一猜：*n*^{p} − *n* 什麼時候一定是 *p* 的倍數？查「費馬小定理」驗證。"], "show": "代數字的觀察、*n*^{5} − *n* 的證明，以及對一般規律的猜想與查證。"}, {"k": "應用", "t": "要用 2025 塊 1 × 1 的地磚，鋪一個「回」字形的廣場（大正方形挖掉中間的正方形）。外框和內框邊長可以是多少？", "c": "回字形的面積是兩個正方形面積相減，正好是平方差：外邊長^{2} − 內邊長^{2} ＝ (外 ＋ 內)(外 − 內)。", "s": ["把 2025 做質因數分解，列出所有「兩個因數相乘 ＝ 2025」的組合。", "哪些組合能變成整數的外、內邊長？一共有幾種回字形？", "加上實際條件（例如步道寬度至少 3 塊、內框至少 20 塊寬），還剩哪幾種？哪一種最適合當廣場？"], "show": "質因數分解、所有可能的邊長表，以及加上條件後的建議。"}, {"k": "連結", "t": "QR code 弄髒了一角，為什麼還掃得出來？查一查它和多項式的關係。", "c": "QR code 用了一種叫「里德－所羅門碼」的錯誤更正方法，核心是多項式：只要知道足夠多個值，就能把整個多項式找回來。", "s": ["做一個小實驗：把一張 QR code 遮住不同大小的區域，記錄遮到多少就掃不出來。", "用簡單的例子體會原理：一次多項式只要兩個值就能確定。如果多傳一個值，其中一個傳錯了，能不能發現？能不能改回來？", "查一查 QR code 的四種「容錯等級」，各能救回多少比例的資料？代價是什麼？"], "show": "遮蔽實驗的紀錄、簡化例子的說明，以及容錯等級的整理。"}, {"k": "創作", "t": "設計一個「看起來不能分解、其實可以」的式子，並寫出找到分解的思路，讓同學挑戰。", "c": "*x*^{4} ＋ 4 看起來不能分解，加一項再減一項卻能變成平方差：*x*^{4} ＋ 4*x*^{2} ＋ 4 − 4*x*^{2}。", "s": ["先完成 *x*^{4} ＋ 4、*x*^{4} ＋ *x*^{2} ＋ 1 的分解，整理出「加一項減一項」的手法。", "用同樣的手法自己設計至少三個式子，難度由淺到深，並附上提示與解答。", "請同學挑戰，記錄每一題的解出人數，分析難在哪裡。"], "show": "示範的分解、自己設計的題目與解析，以及同學挑戰的紀錄。"}]}, {"id": "g8a-4", "sem": "八上", "code": "八上4", "name": "一元二次方程式", "title": "變回你會解的樣子", "qs": [{"k": "推廣", "t": "1 ＋ 1/(1 ＋ 1/(1 ＋ ……)) 等於黃金比例。那 2 ＋ 1/(2 ＋ 1/(2 ＋ ……)) 呢？任意 *a* 呢？", "c": "一個無限長的式子，如果「裡面有一個和自己一樣的東西」，就能列出一元二次方程式。", "s": ["設 *x* ＝ 1 ＋ 1/(1 ＋ ……)，說明為什麼 *x* ＝ 1 ＋ 1/*x*，解出 *x*。", "用同樣的方法求 2 ＋ 1/(2 ＋ ……)，再寫出 *a* ＋ 1/(*a* ＋ ……) 的一般答案。", "用計算機一層一層算，真的會接近解出的數嗎？另一個解跑到哪裡去了？"], "show": "方程式的推導、一般公式、計算機的驗證，以及「捨去另一個解」的理由。"}, {"k": "反過來", "t": "整數係數的二次方程式，兩個根能不能是 √2 和 √3？", "c": "給兩個根就能造出方程式：(*x* − *p*)(*x* − *q*) ＝ 0。可是如果要求係數都是整數，根就不能隨便選。", "s": ["造出根是 2 和 5、根是 √2 和 −√2、根是 1 ＋ √2 和 1 − √2 的方程式，檢查係數是不是整數。", "試著造根是 √2 和 √3 的方程式，係數是什麼？為什麼不是整數？", "說明：整數係數的方程式如果有一個根是 1 ＋ √2，另一個根一定是什麼？"], "show": "三個方程式的建構、√2 和 √3 失敗的原因，以及「根一定成對」的說明。"}, {"k": "證明", "t": "整數係數的一元二次方程式，什麼時候有「分數根」？證明：剛好在判別式是完全平方數的時候。", "c": "這一章的判別式能判斷有幾個解。它其實還能判斷解是不是分數。", "s": ["舉例：2*x*^{2} ＋ 5*x* − 3 ＝ 0 和 *x*^{2} ＋ 3*x* ＋ 1 ＝ 0，各算判別式，再看解。", "從公式解說明：判別式是完全平方數 ⇒ 根是分數。", "反過來：如果根是分數，判別式一定是完全平方數嗎？說明理由。"], "show": "例子、兩個方向的證明。"}, {"k": "應用", "t": "從 10 公尺跳台跳水，多久會入水？用方程式算，再用影片計時驗證。", "c": "跳水選手離開跳台時略往上跳，高度大約可以寫成 *h* ＝ 10 ＋ 2*t* − 4.9*t*^{2}（公尺、秒）。", "s": ["解 *h* ＝ 0，算出入水時間。另一個解代表什麼？", "找一段 10 公尺跳台的比賽影片，計時從起跳到入水，和算出來的比較。", "如果起跳的初速改成每秒 3 公尺，或從 3 公尺跳板跳，時間各變多少？"], "show": "方程式與解、影片計時的紀錄，以及改條件後的比較。"}, {"k": "連結", "t": "計算機用公式解，會不會算錯？試試 *x*^{2} − 100000000*x* ＋ 1 ＝ 0。", "c": "公式解在紙上一定對，但計算機只記得十幾位數字。兩個很接近的大數相減時，有效數字可能全部消失。", "s": ["用計算機照公式解算這題的兩個根，記錄結果。代回去檢查，小的那個根對不對？", "用「兩根相乘 ＝ 1」算出小的根，和上面的結果比較。", "說明為什麼會出錯，以及電腦程式通常怎麼避免。"], "show": "計算機的結果、改用根與係數算出的結果，以及錯誤原因的說明。"}, {"k": "創作", "t": "設計一份「看到方程式該用哪一招」的流程圖，並用 10 題測試同學是否變快。", "c": "這一章有因式分解、開平方、配方、公式解。每一招都會，但看到題目時選哪一招，常常是最難的一步。", "s": ["整理每一招最適合的方程式長相，畫成流程圖。", "出 10 題測試題（含要先整理、要換元的），請兩組同學作答：一組用流程圖、一組不用，記錄時間與正確率。", "根據結果修改流程圖。"], "show": "流程圖（修改前後）、測試題、兩組的比較數據與分析。"}]}, {"id": "g8a-5", "sem": "八上", "code": "八上5", "name": "統計資料處理", "title": "中間的那個人在哪裡", "qs": [{"k": "推廣", "t": "如果每一筆資料的「重要程度」不一樣，中位數怎麼找？", "c": "三個班的平均分數是 60、70、90，班級人數是 40、10、10。「各班平均的中位數」是 70，可是「全部學生分數的中位數」呢？", "s": ["用上面的例子，說明為什麼不能直接取 70。把人數當成權重，畫出累積相對次數，找出加權的中位數。", "加權中位數和加權平均數哪一個比較受極端的班級影響？", "找一個真實需要「加權」的統計（例如各縣市的所得、各國人口），說明不加權會怎麼誤導。"], "show": "例子的計算與累積圖、兩種加權代表值的比較，以及真實例子。"}, {"k": "反過來", "t": "只給一張累積相對次數折線圖，能還原出原本的次數分配表嗎？", "c": "這一章從表畫出圖。反過來，從圖讀回表，「累積只增不減，所以它讀得回來」。", "s": ["找一張真實的累積相對次數圖（或請同學畫一張），讀出每一組的累積比例，還原成次數分配表。", "如果不知道總人數，還原得出「次數」嗎？還原得出什麼？", "圖上折線變陡、變平的地方，各代表資料的什麼特徵？"], "show": "讀圖過程與還原的表、總人數未知時的討論，以及「陡和平」的解讀。"}, {"k": "證明", "t": "從累積折線圖讀出的中位數，和把資料排好找出的中位數，為什麼常常不一樣？什麼時候會一樣？", "c": "這一章用累積折線圖讀中位數。圖是用直線把組界的點連起來——這一步其實藏了一個假設。", "s": ["用一組 20 筆的真實資料，分別用排序法和讀圖法找中位數，差多少？", "畫圖時把點用直線連起來，等於假設那一組的人是怎麼分布的？", "設計一組資料讓兩種方法剛好一樣，再設計一組讓它們差最多。"], "show": "兩種方法的比較、「直線連接」背後假設的說明，以及兩組自己設計的資料。"}, {"k": "應用", "t": "金門學生的會考成績分布，和全國比起來怎麼樣？", "c": "國中教育會考每年會公布各縣市各科「精熟、基礎、待加強」的人數比例。用這一章的累積圖，可以把縣市和全國放在一起比。", "s": ["找最近一年的會考各縣市統計，記錄金門和全國某一科的等級比例。", "畫成累積相對次數圖（由待加強往精熟累積），兩條線放在一起比。", "「待加強以下」占幾成？「基礎以上」呢？近三年有什麼變化？提出可能的原因與需要的資料。"], "show": "資料來源、累積圖、兩條線的比較與近年變化，以及有根據的解讀。"}, {"k": "連結", "t": "社會課的「所得分配」怎麼看？勞倫茲曲線和吉尼係數，原來就是累積相對次數。", "c": "把全國人口照所得由低到高排好，橫軸是累積的人口比例、縱軸是累積的所得比例，畫出來就是勞倫茲曲線。", "s": ["用一個 5 人的小例子（例如所得 1、2、3、4、10 萬），畫出勞倫茲曲線。如果每個人所得一樣，曲線長什麼樣子？", "吉尼係數是「曲線和對角線之間的面積」占多少。估算這個例子的吉尼係數。", "查台灣近年的吉尼係數或「五等分位所得倍數」，說說它代表什麼。"], "show": "小例子的曲線與吉尼係數、真實資料的整理與解讀。"}, {"k": "創作", "t": "替導師做一份一頁的「班級數據儀表板」，用這一章的工具呈現一項全班資料。", "c": "儀表板要讓忙碌的人一眼看懂重點。選對圖、選對代表值，才是統計真正的用途。", "s": ["和導師討論想了解什麼（例如睡眠時間、通勤時間、閱讀量），設計匿名的蒐集方式。", "用相對次數表、累積圖、中位數等，做成一頁的儀表板，最上面寫一句最重要的發現。", "請導師看完後說出他讀到什麼，和想傳達的一樣嗎？再修改一次。"], "show": "儀表板（修改前後）、資料蒐集方式，以及導師的回饋。"}]}, {"id": "g8b-1", "sem": "八下", "code": "八下1", "name": "數列與級數", "title": "規則才是數列", "qs": [{"k": "推廣", "t": "1 ＋ 2 ＋ …… ＋ *n* 可以用配對算。那 1^{2} ＋ 2^{2} ＋ …… ＋ *n*^{2} 呢？", "c": "這一章用「頭尾配對」算出等差級數。平方和沒辦法配對，需要別的想法。", "s": ["算出 *n* ＝ 1～8 的平方和，猜一猜它和 *n*(*n* ＋ 1)(2*n* ＋ 1) 有什麼關係。", "用小方塊堆出 1^{2} ＋ 2^{2} ＋ …… ＋ *n*^{2} 的金字塔，三座這樣的金字塔能拼成什麼形狀？", "用差分表（差、差的差、差的差的差）檢查，平方和是 *n* 的幾次式？"], "show": "數值表與猜想、拼合的圖或照片，以及差分的檢查。"}, {"k": "反過來", "t": "3、7、11、15、……（除以 4 餘 3 的數）裡面，有沒有平方數？1、4、7、10、…… 裡呢？", "c": "給一個等差數列，問裡面有沒有某種特別的數。答案可能是「無限多個」，也可能是「一個都沒有」。", "s": ["列出前 30 項，找找看有沒有平方數。", "把每個整數平方後除以 4，餘數只可能是多少？由此說明第一個數列為什麼一個平方數都沒有。", "1、4、7、10、……裡有平方數嗎？有幾個？再找一個「一個平方數都沒有」的等差數列。"], "show": "前 30 項的觀察、「平方除以 4 的餘數」的證明，以及第二個數列的結論。"}, {"k": "證明", "t": "怎麼確定一個式子「對所有的 *n* 都成立」？用 1 ＋ 3 ＋ 5 ＋ …… ＋ (2*n* − 1) ＝ *n*^{2} 練習數學歸納法。", "c": "這一章提醒過：看幾項都不夠。要保證對所有的 *n* 都對，需要一種像推倒骨牌的證明方法。", "s": ["驗證 *n* ＝ 1、2、3、4 成立，並畫出「一層一層加 L 形」的正方形圖。", "說明：如果 *n* ＝ *k* 時成立，*n* ＝ *k* ＋ 1 時為什麼也成立？", "找一個「前幾項都對、後來錯」的假規律，說明它在歸納法的哪一步失敗。"], "show": "圖解、歸納法的兩步證明，以及假規律的分析。"}, {"k": "應用", "t": "一座湖每年流入 10 噸污染物，湖水每年自然淨化掉 20%。長期下來，湖裡的污染會一直增加嗎？", "c": "每年的量 ＝ 去年的 80% ＋ 10。這是一個遞迴，寫開來會出現等比級數。", "s": ["假設一開始湖裡沒有污染，算出前 10 年每年年底的量。", "把第 *n* 年的量寫成等比級數，求出它最後會接近多少。", "如果想讓長期污染降到 20 噸以下，流入量要減到多少？或淨化率要提高到多少？"], "show": "逐年數值表與圖、等比級數的推導與極限，以及政策建議的計算。"}, {"k": "連結", "t": "金門的海岸線有多長？用不同長度的「尺」量，答案為什麼差那麼多？", "c": "用一把 10 公里的尺沿著海岸走，和用 1 公里的尺走，量到的長度不一樣——尺越短，海岸線越長。", "s": ["在地圖上用 5 公里、2 公里、1 公里、0.5 公里的「圓規步長」沿金門海岸走一圈，記錄步數與總長。", "把「尺的長度」和「量到的總長」做成表或圖，有什麼規律？", "查「海岸線悖論」與碎形維度，說明海岸線的長度為什麼「沒有標準答案」。"], "show": "量測表與圖、規律的觀察，以及海岸線悖論的說明。"}, {"k": "創作", "t": "設計一份 30 天的挑戰計畫（閱讀、運動、背單字……），用等差或等比讓它「做得到又有挑戰」。", "c": "等差每天多一點，等比每天多一成。哪一種前面輕鬆、後面爆炸？挑戰要設計得剛好。", "s": ["決定目標總量（例如 30 天讀 600 頁），分別用等差、等比設計每天的量。", "比較兩種計畫第 1 天、第 15 天、第 30 天的量，哪一種比較實際？", "自己實際執行至少一週，記錄完成率，再根據結果調整計畫。"], "show": "兩種計畫的數列與總量計算、比較，以及執行紀錄與修改。"}]}, {"id": "g8b-2", "sem": "八下", "code": "八下2", "name": "函數", "title": "它不會改口", "qs": [{"k": "推廣", "t": "把 *f*(*x*) ＝ *x*/2 ＋ 3 的輸出一直餵回去，最後會停在哪裡？什麼樣的一次函數會停、什麼樣的會跑掉？", "c": "往後延伸提過「把同一台機器接到自己身上」。這一題把它做到底。", "s": ["從 *x* ＝ 0 開始，一直餵 *f*，記錄前 10 個數。換一個起點再做一次。", "會停的那個數叫「不動點」，它滿足什麼方程式？", "換成 *f*(*x*) ＝ 2*x* ＋ 3、*f*(*x*) ＝ −*x*/2 ＋ 3，結果怎樣？在坐標平面上畫 *y* ＝ *f*(*x*) 和 *y* ＝ *x*，用「蜘蛛網圖」說明。"], "show": "三個函數的數列、不動點的計算，以及蜘蛛網圖和「會停」的條件。"}, {"k": "反過來", "t": "只給一些真實的資料點，怎麼找出最適合的函數？如果點不在一條直線上呢？", "c": "這一章給函數畫圖形。真實世界常常相反：先有資料，再找規則。", "s": ["蒐集一組資料（例如不同距離的計程車費、身高與鞋號、每天的氣溫），畫成散布圖。", "用尺畫一條「最貼近」的直線，寫出它的式子。不同同學畫的線一樣嗎？", "定一個「最貼近」的標準（例如每個點到線的垂直距離加起來最小），比較幾條線哪一條最好。"], "show": "散布圖、自己畫的直線與式子、比較的標準與結果。"}, {"k": "證明", "t": "為什麼一次函數的圖形一定是一條直線？", "c": "這一章常說「一次函數的圖形是直線」。可是畫幾個點連起來，並不能保證中間的點也在同一條線上。", "s": ["在 *y* ＝ 2*x* ＋ 1 上取三點，說明它們共線。（提示：每往右 1，就往上 2。）", "用相似三角形說明：圖形上任兩點連線的斜度都一樣，所以全部的點在同一條直線上。", "反過來：一條不是鉛直的直線，一定是某個一次函數的圖形嗎？"], "show": "三點共線的說明、一般的證明，以及反方向的說明。"}, {"k": "應用", "t": "台電的電費是怎麼算的？夏天和非夏天各省 10 度電，省下的錢一樣嗎？", "c": "家庭電費是「分段累進」：用得越多，超過的那一段每度越貴，夏月和非夏月的價格也不同。", "s": ["查台電最新的住宅用電累進費率表，畫出「用電度數 → 電費」的函數圖形。", "自己家（或假設）一個月用 400 度，夏月和非夏月各要付多少？各省 10 度，各省多少錢？", "這個函數圖形會「跳」嗎？還是連續的、只是轉彎？和停車費比較。"], "show": "費率表與函數圖形、計算過程，以及省電效果的比較。"}, {"k": "連結", "t": "試算表裡的 IF、VLOOKUP 是函數嗎？做一個自動算郵資或成績等第的試算表。", "c": "試算表的每一個公式，都是「給輸入、得輸出」的機器。有些長得不像數學，但仍然是函數。", "s": ["在試算表輸入一欄重量，用 IF 寫出郵資，用公式自動算。", "再用 VLOOKUP（或查表）做一個「分數 → 等第」的對照。", "這兩個都是函數嗎？它們的「定義域」是什麼？輸入超出範圍時會怎樣？"], "show": "試算表截圖、公式說明，以及「是不是函數」的分析。"}, {"k": "創作", "t": "替一款遊戲設計「升級需要多少經驗值」的函數，並說明為什麼這樣設計。", "c": "遊戲升級的經驗值有的每級加一樣多（一次函數）、有的越來越多（二次、指數）。不同的函數，玩起來感覺完全不同。", "s": ["查兩款真實遊戲的升級經驗值表，畫成圖，判斷它像什麼樣的函數。", "替自己設計的遊戲寫出經驗值函數（含式子與前 20 級的表），說明設計理由。", "假設玩家每天獲得固定的經驗值，算出升到第 10、20、50 級各要幾天，檢查設計合不合理。"], "show": "真實遊戲的資料與圖、自己的函數與表，以及升級天數的檢查。"}]}, {"id": "g8b-3", "sem": "八下", "code": "八下3", "name": "三角形的基本性質", "title": "不能再動了", "qs": [{"k": "推廣", "t": "五角星五個尖角加起來是幾度？七角星呢？有沒有一個公式？", "c": "這一章用內角、外角算多邊形的角度和。星形多邊形的尖角，可以用同樣的工具算。", "s": ["畫一個五角星，量五個尖角，加起來大約幾度？再用三角形外角的性質證明。", "七個點的圓上，每隔 2 點連一條（七角星）、每隔 3 點連一條，尖角和各是多少？", "猜一個公式：*n* 個點、每隔 *k* 點連線，尖角和是多少？用「走一圈轉了幾圈」解釋。"], "show": "量測與證明、兩種七角星的計算，以及公式與「轉幾圈」的解釋。"}, {"k": "反過來", "t": "從 1～10 公分的木棒中任挑三根不同長度的，能圍成三角形的機率是多少？", "c": "這一章的三邊關係說：任兩邊的和要大於第三邊。反過來數：有多少組符合？", "s": ["列出所有挑法一共有幾種。", "用「兩根短的加起來大於最長的」判斷，數出能圍成三角形的有幾種（可以依最長邊分類）。", "換成 1～20 公分，比例會變大還是變小？猜一猜長度越多時，比例會接近多少。"], "show": "分類計數的過程、機率，以及 1～20 的結果與猜想。"}, {"k": "證明", "t": "「等腰三角形兩底角相等」有幾種證法？為什麼歐幾里得的證明被叫做「驢橋」？", "c": "這一章用全等證明等腰三角形的性質。兩千多年來，這個定理有很多種證法。", "s": ["寫出至少兩種證明：作頂角平分線、作底邊中線。各用到哪一個全等條件？", "還有一種很妙的證法：把三角形「翻面」和自己比較（△ABC 和 △ACB 全等）。它合理嗎？", "查「驢橋定理」的由來，說說為什麼它被當成初學者的門檻。"], "show": "兩三種證明的比較、「翻面」證法的評價，以及驢橋的由來。"}, {"k": "應用", "t": "不過河、不爬樹，怎麼量出河寬或建築物的距離？用全等三角形在校園實際量一次。", "c": "古代的測量員用全等三角形量「到不了」的距離：在河這一邊做一個和對岸三角形全等的三角形，再量這一邊就好。", "s": ["查一種用全等三角形測距的方法（例如拿破崙軍隊的帽簷測距、在岸邊標出全等三角形）。", "在校園選一個「量不到」的距離（例如操場對面的旗桿到某處），設計測量步驟，寫出用到哪一個全等條件。", "實際量一次，再用捲尺或地圖檢查，誤差多少？誤差從哪裡來？"], "show": "方法說明、測量設計與全等條件、實測數據與誤差分析。"}, {"k": "連結", "t": "藝術裡的「不可能三角形」為什麼不可能？用三角形內角和說明。", "c": "潘洛斯三角形看起來是三根互相垂直的木條接成的三角形，可是現實裡做不出來（照片裡的都是錯覺）。", "s": ["找潘洛斯三角形和艾雪的版畫，描述每個轉角看起來是幾度。", "如果它是平面上的三角形，三個角都是 90° 可能嗎？如果是立體的，三根木條能首尾相接嗎？", "查一查真實世界的「不可能三角形」雕塑是怎麼騙過眼睛的，自己做一個（紙或積木），拍出錯覺照片。"], "show": "圖像的分析、內角和的推理，以及自己做的錯覺照片與說明。"}, {"k": "創作", "t": "把一個正三角形剪成四塊，拼成一個正方形。照著杜德尼的方法做一次，並說明為什麼拼得剛好。", "c": "1902 年，杜德尼找到把正三角形剪成四塊、拼成正方形的方法，四塊還可以用鉸鏈連起來像門一樣轉。", "s": ["查杜德尼的四塊拼法，照步驟用厚紙板剪一個（先算好正方形的邊長要多少）。", "說明每一個切點是怎麼找到的，以及為什麼拼起來角度剛好、邊剛好對齊。", "把四塊用膠帶當鉸鏈連起來，錄一段從三角形轉成正方形的影片。"], "show": "作品照片或影片、尺寸計算，以及「為什麼剛好」的說明。"}]}, {"id": "g8b-4", "sem": "八下", "code": "八下4", "name": "平行與四邊形", "title": "那條線本來不在圖上", "qs": [{"k": "推廣", "t": "平行四邊形兩條對角線的平方和，等於四邊的平方和。一般的四邊形呢？多出來的那一塊是什麼？", "c": "平行四邊形有一個漂亮的等式：*AC*^{2} ＋ *BD*^{2} ＝ *AB*^{2} ＋ *BC*^{2} ＋ *CD*^{2} ＋ *DA*^{2}。", "s": ["用坐標驗證：取一個平行四邊形（例如 (0, 0)、(5, 0)、(7, 3)、(2, 3)），算兩邊。", "換成一般四邊形，兩邊差多少？試幾個例子，差的那個數和「兩條對角線的中點距離」有什麼關係？", "用這個關係說明：為什麼平行四邊形剛好相等？"], "show": "驗證計算、一般四邊形的例子與猜想，以及回到平行四邊形的說明。"}, {"k": "反過來", "t": "四根木棒長度固定，接成四邊形還能動。面積最大的時候，是什麼形狀？", "c": "這一章說四邊形「還能動」。動的時候形狀改變，面積也跟著變。", "s": ["用四根長度不同的紙條和圖釘做一個四邊形（例如 3、4、5、6 公分），推動它，量幾個形狀的面積（切成兩個三角形算）。", "面積最大的時候，四個頂點有什麼特別的關係？（提示：試著畫一個圓經過三個頂點，看第四個點在哪裡。）", "四邊長都一樣（菱形）時，面積最大是什麼形狀？和上面的結論一致嗎？"], "show": "量測紀錄、最大面積時的形狀與觀察，以及菱形的檢查。"}, {"k": "證明", "t": "梯形面積 ＝ (上底 ＋ 下底) × 高 ÷ 2。能想出幾種不同的證明？", "c": "這個公式小學就背了。這一章的「平行線保住面積」「補一條線」，可以給它很多種不同的理由。", "s": ["寫出至少四種證明，例如：切成兩個三角形、補成平行四邊形、兩個梯形倒過來拼、用中位線剪拼。", "每一種證明各用到這一章的哪一個性質？", "哪一種證明最容易推廣到其他形狀（例如三角形是上底為 0 的梯形）？"], "show": "四種以上的圖解證明、各自用到的性質，以及推廣的比較。"}, {"k": "應用", "t": "一塊不規則的土地，怎麼量出面積？試試測量員的「切成三角形和梯形」。", "c": "地政人員量不規則的土地時，常拉一條基準線，從各個轉角往基準線量垂直距離，把土地切成很多梯形和三角形。", "s": ["在校園或住家附近選一塊不規則的區域（花圃、空地），或在地圖上選一塊土地。", "拉一條基準線，量出每個轉角到基準線的垂直距離和間隔，算出面積。", "用另一種方法（例如方格紙數格子、坐標框起來再減掉）再算一次，兩者差多少？"], "show": "測量示意圖與數據、兩種方法的計算與比較。"}, {"k": "連結", "t": "理化課的「力的合成」為什麼要畫平行四邊形？兩個力合起來為什麼是對角線？", "c": "兩個人用繩子同時拉一個箱子，箱子會往哪裡動？畫兩個箭頭當兩條邊，平行四邊形的對角線就是合起來的效果。", "s": ["做一個實驗：用兩個彈簧秤（或橡皮筋）拉同一個點，記錄兩個力的大小與方向，再找出能單獨抵消它們的第三個力。", "把兩個力畫成平行四邊形的兩邊，對角線的長度和方向，和第三個力相符嗎？", "說明：為什麼「先走一條邊、再走另一條邊」會和「直接走對角線」到同一個地方？"], "show": "實驗紀錄、平行四邊形作圖與比較，以及「先走再走」的說明。"}, {"k": "創作", "t": "設計一套「四邊形家族」卡牌遊戲，規則要用到性質的繼承關係。", "c": "正方形同時是長方形和菱形，所以它繼承了兩邊的所有性質。這種「家族關係」可以變成遊戲規則。", "s": ["列出六種四邊形和至少十條性質（對邊平行、對角線等長……），做成「誰有哪些性質」的表。", "設計遊戲規則（例如出一張性質卡，手上的四邊形要符合才能出），讓玩的人必須用到繼承關係。", "和同學試玩至少三局，記錄爭議的地方（例如梯形的定義），修改規則。"], "show": "性質表、遊戲規則與卡牌設計、試玩紀錄與修改。"}]}, {"id": "g9a-1", "sem": "九上", "code": "九上1", "name": "相似形", "title": "兩個角就夠了", "qs": [{"k": "推廣", "t": "直角三角形斜邊上的高，把它切成兩個和原來相似的小三角形。其他三角形也能被一刀切成兩個和自己相似的三角形嗎？", "c": "這一章最常用的圖之一：直角三角形從直角頂點畫到斜邊的高，切出來的兩個小三角形都和大三角形相似。", "s": ["先說明直角三角形為什麼可以：三個三角形的角各是多少？", "試著切一個銳角三角形、一個鈍角三角形（從一個頂點切到對邊），切出來的兩塊能不能都和原來相似？", "說明為什麼只有直角三角形做得到。再從這三個相似三角形推出畢氏定理。"], "show": "直角三角形的說明、其他三角形的嘗試與失敗原因，以及用相似推出畢氏定理。"}, {"k": "反過來", "t": "兩個三角形面積比是 4：9，而且有一個角相等，它們一定相似嗎？", "c": "這一章說：相似時面積比是相似比的平方。反過來，知道面積比，能不能推出相似？", "s": ["試著畫兩個三角形，都有一個 60° 的角，面積比 4：9，但形狀不一樣。", "再加什麼條件，就一定相似？（例如夾這個角的兩邊成比例。）", "整理：面積比、周長比、一個角、兩個角……哪些組合能推出相似？"], "show": "反例的圖與計算、補上條件後的證明，以及整理表。"}, {"k": "證明", "t": "用影子量高度時，如果光源是路燈而不是太陽，相似三角形還能用嗎？要怎麼改？", "c": "這一章用影子量旗桿，前提是太陽光是平行光。路燈是一個點，光線是從同一點射出來的。", "s": ["畫圖：一根桿子在路燈下，影子多長？和太陽光下的畫法差在哪裡？", "如果知道路燈高度和桿子到燈的距離，怎麼用相似算出影子長？反過來，只量影子長，能不能推出桿子的高度？需要再量什麼？", "太陽也是一個「點」光源，為什麼可以當成平行光？用相似說明距離很遠時角度的差有多小。"], "show": "兩種光源的作圖、點光源時的計算方法，以及「太陽可以當平行光」的說明。"}, {"k": "應用", "t": "伸直手臂、閉一隻眼，用大拇指就能估出遠方物體的距離。為什麼可以？", "c": "「拇指跳躍法」：伸直手臂，先閉左眼、再閉右眼，拇指看起來會在背景上「跳」一段。用相似三角形就能估出距離。", "s": ["量自己的兩眼距離和眼睛到拇指的距離，算出比值（通常約 1：10）。", "對著一個已知寬度的遠方物體（例如另一棟教室、旗桿間距），試著估出距離，再用地圖或捲尺檢查。", "畫出相似三角形，說明為什麼「跳的寬度 × 比值 ≈ 距離」。"], "show": "自己的比值、實測與檢查的紀錄，以及相似三角形的說明。"}, {"k": "連結", "t": "手機相機的「2 倍變焦」、鏡頭的「焦距」是什麼意思？用相似三角形解釋。", "c": "鏡頭的焦距越長，拍到的範圍越窄、東西看起來越大。這和這一章的針孔、影像、相似比是同一件事。", "s": ["畫出簡化的光路：物體、鏡頭、感光元件。物體高、物距、影像高、焦距之間有什麼比例關係？", "焦距加倍時，同一個物體在照片上的大小變成幾倍？拍到的範圍寬度變成幾倍？", "用手機分別以 1 倍、2 倍、3 倍拍同一個場景，量照片中某物體的大小，驗證這個推論。"], "show": "光路圖與比例式、焦距加倍的推論，以及實拍驗證。"}, {"k": "創作", "t": "做一個「縮放儀」（用四根木條做成的放大器），用它把一張圖放大 2 倍，並說明為什麼畫出來的圖會相似。", "c": "縮放儀是用一個平行四邊形連桿做成的：一端固定、筆尖描原圖，另一端的筆就畫出放大的圖。", "s": ["查縮放儀的構造，用硬紙條和圖釘做一個（注意哪幾個點要共線）。", "用它描一張簡單的圖，量量看放大的倍數對不對。", "用相似三角形和平行四邊形說明：為什麼固定點、描圖筆、畫圖筆永遠在一條直線上，而且距離比固定。"], "show": "作品照片、放大的成果與量測，以及原理的說明。"}]}, {"id": "g9a-2", "sem": "九上", "code": "九上2", "name": "圓", "title": "怎麼看都一樣", "qs": [{"k": "推廣", "t": "圓是「到一個點距離固定」的點。那「到兩個點距離的和固定」的點，會畫出什麼？", "c": "用一條繩子和一個圖釘可以畫圓。如果用兩個圖釘、一條繩子呢？", "s": ["在紙板上釘兩個圖釘，套一條繩圈，用筆拉緊繩子畫一圈，畫出來是什麼形狀？", "改變兩個圖釘的距離，形狀怎麼變？兩個圖釘重合時呢？", "查一查：橢圓有什麼性質和圓很像？（例如從一個焦點發出的光，反射後會到哪裡？）"], "show": "作圖照片、改變距離的觀察，以及橢圓與圓的比較。"}, {"k": "反過來", "t": "三點一定能畫一個圓。四個點什麼時候在同一個圓上？給四個點的坐標，怎麼判斷？", "c": "這一章用外心找過三點的圓。第四點會不會剛好在圓上，有幾種判斷方法。", "s": ["給 (0, 0)、(4, 0)、(0, 3)、(4, 3)，以及 (0, 0)、(4, 0)、(0, 3)、(3, 4)，各判斷是否共圓。", "方法一：先求三點的外心和半徑，再檢查第四點。方法二：看四邊形的對角是否互補。方法三：用相交弦或割線的乘積。", "比較三種方法：哪一種最好算？哪一種最容易推廣？"], "show": "兩組的判斷過程、三種方法的比較。"}, {"k": "證明", "t": "把圓切成很多扇形、交錯排成近似的長方形，就能得到圓面積 π*r*^{2}。這算是證明嗎？還差什麼？", "c": "這個「披薩重排」的說明很有名：切得越細，排出來越像一個長 π*r*、寬 *r* 的長方形。", "s": ["用紙剪一個圓，切成 8、16 塊扇形重排，拍照。長方形的長和寬大約是多少？", "說明「越來越像長方形」這件事：扇形的弧和弦差多少？切成 *n* 塊時，邊緣「波浪」的高度怎麼變？", "這個說明和真正的證明差在哪裡？查一查阿基米德怎麼用「夾擠」把它變成嚴格的證明。"], "show": "剪拼的照片、「越來越像」的量化說明，以及和嚴格證明的比較。"}, {"k": "應用", "t": "400 公尺跑道的彎道半徑是多少？為什麼外道的起跑線要往前移？要移多少？", "c": "200 公尺比賽要跑一個彎道。外道的彎道比較長，起跑線必須往前，大家才跑一樣遠。", "s": ["量（或查）學校操場跑道的直道長度和彎道內側半徑，驗證一圈約 400 公尺。", "每一道寬 1.22 公尺。跑一個半圓彎道時，相鄰兩道差多少？跑一整圈呢？", "到操場量一量實際的起跑線間隔，和算出來的比較。"], "show": "跑道的量測與驗算、起跑線間隔的計算，以及實地量測的比較。"}, {"k": "連結", "t": "羅馬式的拱門是半圓，哥德式的尖拱是兩段圓弧。怎麼用圓規畫出來？為什麼後來要改成尖拱？", "c": "這一章的圓、弧、切線，在建築裡處處可見。金門古厝、教堂、橋梁都有拱。", "s": ["用圓規畫一個半圓拱，再畫一個「兩段圓弧在頂端相交」的尖拱，寫出畫法（圓心放在哪裡）。", "同樣寬度時，兩種拱的高度各是多少？（尖拱可以選等邊的畫法：圓心在對側的拱腳。）", "查資料：尖拱在受力上有什麼好處？金門或台灣有沒有可以拍照的拱形建築？"], "show": "兩種拱的作圖與尺寸計算、受力的說明，以及實地照片。"}, {"k": "創作", "t": "把圓周 *n* 等分，每隔 *k* 個點連一條線，會畫出各種星形。什麼時候能一筆畫完？", "c": "圓周 5 等分、每隔 2 點連，就是五角星，一筆畫完。換成 6 等分、每隔 2 點，卻變成兩個三角形。", "s": ["畫出 *n* ＝ 5～12、不同 *k* 的星形（至少 12 個），記錄每一個要幾筆才畫完。", "找規律：幾筆和 *n*、*k* 有什麼關係？（提示：七上的最大公因數。）", "挑一個最喜歡的星形，設計成圖案作品，並說明它的頂角是幾度。"], "show": "星形圖表與筆數紀錄、規律，以及圖案作品。"}]}, {"id": "g9a-3", "sem": "九上", "code": "九上3", "name": "幾何與證明", "title": "不是剛好", "qs": [{"k": "推廣", "t": "三角形的「心」不只四、五個。查「三角形中心百科」，挑一個本章還沒討論過的三角形中心深入研究。", "c": "數學家整理了一份「三角形中心百科」，收錄了數萬個不同的三角形中心。每一個都有自己的定義和性質。", "s": ["查一查這份百科，挑一個定義看得懂的心（例如費馬點、拿破崙點、內心的「對偶」）。", "用 GeoGebra 或作圖畫出它，拖動三角形，它什麼時候在三角形外面？和外心、內心、重心有什麼關係？", "能不能用這一章的理由證明它的一個性質？如果不能，卡在哪裡？"], "show": "所選的心的定義與作圖、觀察到的性質，以及證明的嘗試。"}, {"k": "反過來", "t": "如果三角形的外心和內心是同一點，它一定是正三角形嗎？任意兩個心重合呢？", "c": "正三角形的四個心都在同一點。反過來：只要兩個心重合，三角形就一定是正三角形嗎？", "s": ["外心 ＝ 內心：用「外心到三頂點等距、內心到三邊等距」證明三角形是正三角形。", "重心 ＝ 垂心、重心 ＝ 外心、內心 ＝ 重心，各試著證明或找反例。", "整理成一張表：哪兩個心重合 ⇒ 正三角形？有沒有例外？"], "show": "每一組的證明（或反例），以及整理表。"}, {"k": "證明", "t": "內切圓半徑 *r* 和三個旁切圓半徑 *r*_{a}、*r*_{b}、*r*_{c} 之間有一個漂亮的關係：1/*r* ＝ 1/*r*_{a} ＋ 1/*r*_{b} ＋ 1/*r*_{c}。為什麼？", "c": "這一章用面積算過內切圓半徑：*r* ＝ 面積 ÷ 半周長。旁切圓半徑也能用面積算。", "s": ["用 13–14–15 的三角形驗證：面積 84，*r* 是多少？三個旁切圓半徑各是多少？代進去檢查。", "用「旁心連三頂點把三角形切成三塊、有加有減」的方法，說明 *r*_{a} ＝ 面積 ÷ (*s* − *a*)（*s* 是半周長）。", "把三個倒數加起來，證明等式。"], "show": "數值驗證、旁切圓半徑的面積推導，以及最後的證明。"}, {"k": "應用", "t": "三座基地台要覆蓋一塊三角形區域，每座的訊號範圍是一個圓。圓要多大才夠？基地台放哪裡？", "c": "用一個圓蓋住整個三角形，最小的圓是哪一個？外接圓嗎？", "s": ["先想只用一座基地台：要蓋住三角形，最小的圓圓心在哪裡？分銳角、直角、鈍角三種情況畫畫看。", "鈍角三角形時，外接圓還是最小的嗎？為什麼不是？", "如果有三座基地台、三個一樣大的圓，要蓋住整個三角形，要怎麼放？提出方案並估算半徑。"], "show": "三種三角形的作圖與最小圓的說明、三座基地台的方案。"}, {"k": "連結", "t": "1976 年，四色定理是靠電腦證明的。電腦跑出來的證明，算不算證明？", "c": "四色定理說：任何地圖只用四種顏色，就能讓相鄰的區域顏色都不同。它的證明需要電腦檢查將近兩千種情況。", "s": ["試著用四種顏色塗台灣的縣市地圖（或世界地圖的一部分），再試試用三種顏色會不會失敗。", "查四色定理證明的故事：為什麼當時很多數學家不接受？", "說說自己的看法：一個證明要滿足什麼條件，才能讓人相信？電腦證明和這一章的證明差在哪裡？"], "show": "塗色作品、證明故事的整理，以及自己對「什麼才算證明」的立場。"}, {"k": "創作", "t": "用 GeoGebra 做一個三心互動圖，拖動頂點觀察，寫出三個自己發現的猜想，並證明其中一個。", "c": "這一章的三心各有位置規律。拖動三角形的頂點，看看還能發現哪些位置規律。", "s": ["在 GeoGebra 畫三角形和外心、內心、重心、垂心，讓它們跟著頂點移動。", "拖動頂點，記錄三個注意到的現象（例如「什麼時候外心在某一邊上」「哪三個點一直共線」）。", "挑一個猜想，用這一章的理由證明；另外兩個說明為什麼相信、還差什麼。"], "show": "互動圖的截圖或連結、三個猜想，以及一個證明。"}]}, {"id": "g9b-1", "sem": "九下", "code": "九下1", "name": "二次函數", "title": "同一條，搬了家", "qs": [{"k": "推廣", "t": "*x* ＋ *y* ＝ 10 時，*xy* 最大是多少？換成 *x* ＋ 2*y* ＝ 10、或要 *x*^{2} ＋ *y*^{2} 最小呢？", "c": "兩個變數的最大最小值，只要用條件把其中一個換掉，就變成這一章的二次函數。", "s": ["用 *y* ＝ 10 − *x* 代進 *xy*，配方求最大值。", "*x* ＋ 2*y* ＝ 10 時 *xy* 的最大值是多少？*x* ＋ *y* ＝ 10 時 *x*^{2} ＋ *y*^{2} 的最小值呢？", "把三題畫在坐標平面上（直線和曲線），說明最大或最小值出現在哪裡。"], "show": "三題的代換與配方、坐標圖，以及「最值在哪裡」的說明。"}, {"k": "反過來", "t": "給三個點，一定能找到唯一一條通過它們的拋物線嗎？給四個點呢？", "c": "這一章是給式子畫拋物線。反過來，給幾個點，找出式子。", "s": ["找出通過 (0, 1)、(1, 2)、(2, 5) 的拋物線 *y* ＝ *ax*^{2} ＋ *bx* ＋ *c*。", "三個點在什麼情況下找不到拋物線？（提示：三點共線，或兩點的 *x* 一樣。）", "加上第四個點 (3, 10)，還在同一條拋物線上嗎？換成 (3, 9) 呢？一般怎麼判斷？"], "show": "解聯立的過程、找不到的情況，以及第四點的判斷方法。"}, {"k": "證明", "t": "拋物線上的每一點，到「焦點」和到「準線」的距離都一樣。用 *y* ＝ *x*^{2}/4 證明。", "c": "*y* ＝ *x*^{2}/4 的焦點是 (0, 1)，準線是 *y* ＝ −1。這個性質是拋物線的另一個定義。", "s": ["取拋物線上的幾個點，例如 (2, 1)、(4, 4)，算它們到 (0, 1) 的距離和到 *y* ＝ −1 的距離。", "取一般的點 (*t*, *t*^{2}/4)，用距離公式證明兩個距離相等。", "反過來：如果一個點到 (0, 1) 和到 *y* ＝ −1 等距，它一定在拋物線上嗎？試著推出它的方程式。"], "show": "數值檢查、一般證明，以及反方向的推導。"}, {"k": "應用", "t": "水管噴水，什麼角度噴得最遠？用實驗和二次函數一起找答案。", "c": "水柱的形狀接近拋物線。改變水管的角度，水落地的距離也跟著改變。", "s": ["在空地用水管（或水槍）以固定水壓，從 15°、30°、45°、60°、75° 各噴一次，量落地距離。", "把「角度 → 距離」畫成圖，最遠的角度大約是多少？30° 和 60° 的距離有什麼關係？", "拍下其中一次的水柱照片，在照片上描點，找一條 *y* ＝ *a*(*x* − *h*)^{2} ＋ *k* 貼近它。"], "show": "量測表與圖、最遠角度的結論，以及照片描點與二次函數。"}, {"k": "連結", "t": "吊橋的主纜是拋物線嗎？那一條自然下垂的繩子呢？", "c": "伽利略曾經以為一條掛著的鍊子是拋物線，後來數學家發現它其實是另一種曲線（懸鏈線）。可是吊橋的主纜，又真的很接近拋物線。", "s": ["拿一條項鍊或細鍊子兩端掛起來拍照，在照片上描點，試著找一條拋物線貼近它，貼得完全嗎？", "查一查：為什麼「只承受自己重量」的鍊子是懸鏈線，而「承受均勻橋面重量」的主纜是拋物線？", "找一座真實吊橋的照片（例如碧潭吊橋），描點驗證主纜接近拋物線。"], "show": "兩張照片的描點與擬合、兩種曲線差別的說明。"}, {"k": "創作", "t": "設計一個投射遊戲關卡：給定起點和目標，只有某一範圍的拋物線能越過障礙命中。", "c": "很多手機遊戲讓角色或小鳥沿著拋物線飛。設計關卡時，要算出「哪些拋物線能過關」。", "s": ["在坐標平面上設定起點 (0, 0)、目標 (10, 0)，中間放一堵牆（例如 *x* ＝ 4、高 3）。", "形如 *y* ＝ *a**x*(*x* − 10) 的拋物線都會命中目標。*a* 要在什麼範圍，才能越過牆？", "再加一個天花板（例如 *y* ≤ 8），可行範圍剩多少？設計三個難度不同的關卡，用 Desmos 畫出來給同學挑戰。"], "show": "關卡設計、*a* 的範圍計算，以及三個關卡的圖與同學試玩紀錄。"}]}, {"id": "g9b-2", "sem": "九下", "code": "九下2", "name": "統計與機率", "title": "算出來之前，先問", "qs": [{"k": "推廣", "t": "一張統一發票平均值多少錢？算出它的期望值。", "c": "每兩個月開獎一次，從特別獎到六獎，每一種中獎的機率和獎金都不同。期望值就是「長期下來每張平均拿回多少」。", "s": ["查財政部最新的統一發票獎項與中獎規則，整理成表（獎金、要對中幾位、有幾組號碼）。", "算出每一種獎的機率，再算期望值。哪一種獎貢獻最多？", "如果一個月有 30 張發票，一年下來平均能中多少錢？和實際經驗比一比。"], "show": "獎項與機率表、期望值的計算，以及「哪一種獎貢獻最多」的說明。"}, {"k": "反過來", "t": "池塘裡有多少條魚？不可能全部撈起來數，「捉放法」怎麼估計？", "c": "先撈一批魚做記號放回去，過幾天再撈一批，看看裡面有幾條有記號。用比例就能估出總數。", "s": ["用一大罐豆子模擬：先取出 50 顆做記號放回、搖勻，再取出 50 顆數有幾顆有記號，估計總數。", "重複做 5 次，估計值差多少？最後倒出來數真正的數量比較。", "這個方法假設了哪些事？（例如記號不會掉、魚會混勻。）哪一個假設在真實池塘最可能不成立？"], "show": "模擬的數據與估計、和真實數量的比較，以及假設的檢討。"}, {"k": "證明", "t": "每局輸贏機率各半，帶 10 元、每局賭 1 元，先贏到 20 元或先輸光為止。贏到 20 元的機率是多少？", "c": "這叫「賭徒破產問題」。看起來很複雜，其實可以用一個簡單的想法算出來。", "s": ["先用小數字試：帶 1 元、目標 2 元，機率是多少？帶 1 元、目標 3 元呢？（列出所有情況。）", "設 *p*_{k} 是手上有 *k* 元時最後贏的機率。為什麼 *p*_{k} 是 *p*_{k−1} 和 *p*_{k+1} 的平均？", "由此推出 *p*_{k} 是一個等差數列，求出帶 10 元、目標 20 元的機率。再用擲硬幣模擬 20 次驗證。"], "show": "小數字的計算、遞迴關係與推導、模擬的結果。"}, {"k": "應用", "t": "籃球的「手感」真的存在嗎？連進兩球之後，第三球比較容易進嗎？", "c": "很多人相信「手感發燙」。1985 年的研究說它是錯覺，2018 年又有人發現那份研究的統計方法有問題。", "s": ["自己或請同學投 50 次罰球，記錄每一球進或不進。", "算出整體命中率，以及「連進兩球之後」的命中率，兩者差多少？", "查一查這個爭議：2018 年的研究指出原本的分析有什麼偏誤？自己的資料夠不夠下結論？"], "show": "50 次的紀錄、兩種命中率的比較，以及對爭議的整理與自己的結論。"}, {"k": "連結", "t": "孟德爾的豌豆實驗為什麼會出現 3：1？用機率解釋遺傳。", "c": "孟德爾發現：兩株「高莖」豌豆雜交的下一代，高莖和矮莖大約是 3：1。這是生物課的內容，也是一個機率問題。", "s": ["用棋盤方格（龐尼特方格）列出 Tt × Tt 的所有組合，算出各種基因型的機率。", "用兩枚硬幣模擬（正面＝T、反面＝t），擲 100 次，看比例接不接近 3：1。", "查孟德爾的原始數據（例如 787 株高莖、277 株矮莖），算出比例。數據「太漂亮」是否引起過懷疑？"], "show": "龐尼特方格、模擬結果、原始數據的比較，以及「數據太漂亮」爭議的整理。"}, {"k": "創作", "t": "只有一枚「不公正」的硬幣（正面機率不知道），能不能用它做出公平的抽籤？", "c": "數學家馮紐曼想出一個辦法：每次擲兩次，只看「正反」和「反正」兩種結果。", "s": ["說明：為什麼「正反」和「反正」的機率一定一樣？（設正面機率是 *p*。）", "做一枚不公正的硬幣（例如一面貼黏土），用這個方法抽籤 30 次，看結果接不接近一半一半。", "這個方法平均要擲幾次才會得到一次結果？*p* 越偏，要擲越多次嗎？設計一個改良版。"], "show": "原理的證明、實驗紀錄，以及平均次數的計算與改良設計。"}]}, {"id": "g9b-3", "sem": "九下", "code": "九下3", "name": "生活中的立體圖形", "title": "多出來的那個方向", "qs": [{"k": "推廣", "t": "把正方體的八個角切掉，會變成什麼立體？切得越深，頂點、稜、面怎麼變？", "c": "這一章數過角柱、角錐的頂點、稜、面。把正方體的角切掉，會長出新的面。", "s": ["用黏土或保麗龍做正方體，八個角各切掉一小塊（切到稜長的 1/4 處），數出新的 *V*、*E*、*F*。", "切到稜的中點，又變成什麼？數出 *V*、*E*、*F*。", "每一次都算 *V* − *E* ＋ *F*，結果一樣嗎？為什麼切一個角不會改變它？"], "show": "兩種截角立體的照片、*V*、*E*、*F* 表，以及「切角不改變 *V* − *E* ＋ *F*」的說明。"}, {"k": "反過來", "t": "正方體有 11 種展開圖。正四面體有幾種？正八面體呢？", "c": "這一章判斷過哪些圖形摺得成正方體。反過來，把所有能摺成某個立體的展開圖都找出來。", "s": ["先確認正方體的 11 種展開圖，說明怎麼確定沒有漏、沒有重複（轉動翻面算同一種）。", "找出正四面體所有的展開圖，一共幾種？", "正八面體有 8 個面，展開圖有幾種？試著找出幾種，並查答案。"], "show": "正方體 11 種的整理方法、正四面體的完整答案，以及正八面體的探索。"}, {"k": "證明", "t": "為什麼錐體體積是柱體的 1/3？用三個一模一樣的四角錐拼成一個正方體來說明。", "c": "這一章用「一層一層夾出來」說明 1/3。還有一個可以拿在手上的證明：剛好三個一樣的錐體拼成一個正方體。", "s": ["用厚紙板做三個一樣的四角錐：底面是邊長 5 公分的正方形，頂點在底面一個角的正上方 5 公分。", "把三個拼成一個正方體，拍照。說明為什麼每一個的體積是正方體的 1/3。", "這個方法只證明了「這一種」四角錐。怎麼推到所有錐體？（提示：祖暅原理。）"], "show": "三個錐體的作品與拼合照片、說明，以及推廣到所有錐體的想法。"}, {"k": "應用", "t": "一個紙箱裝飲料罐，怎麼排最省空間？圓罐排成正方形還是交錯排？", "c": "圓罐放進方箱子一定有空隙。不同的排法，空隙比例不一樣。", "s": ["俯視時，把圓排成正方形格子，圓占了平面多少比例？", "交錯排（像蜂巢），圓占了多少比例？", "量一個真實的紙箱和罐子，兩種排法各能放幾罐？為什麼真實的箱子常常不用交錯排？"], "show": "兩種排法的比例計算、真實紙箱的計算，以及實際考量。"}, {"k": "連結", "t": "足球為什麼一定是 12 塊五邊形？化學裡的 C_{60} 分子也長這樣——用歐拉公式說明。", "c": "傳統足球由 12 塊五邊形和 20 塊六邊形縫成，每個頂點接三塊。只用五邊形和六邊形時，五邊形的數量竟然被固定了。", "s": ["數一顆足球（或圖片）的頂點、稜、面，驗證 *V* − *E* ＋ *F* ＝ 2。", "設五邊形 *a* 塊、六邊形 *b* 塊，用「每個頂點接三塊」「每條稜屬於兩塊」把 *V*、*E*、*F* 寫成 *a*、*b* 的式子，代進歐拉公式。", "查 C_{60}（富勒烯）的結構和發現故事，它和足球有什麼關係？"], "show": "足球的 *V*、*E*、*F*、五邊形一定是 12 塊的推導，以及 C_{60} 的介紹。"}, {"k": "創作", "t": "設計一個圓錐形量杯，在杯身標出每 50 毫升的刻度。為什麼刻度不是等距的？", "c": "圓柱形的杯子，刻度是等距的；圓錐形的杯子，越往上刻度越密。", "s": ["設計一個尖端朝下的圓錐杯（自訂杯口半徑和深度），算出總容量。", "裝 50、100、150、……毫升時，水深各是多少？（用相似立體：體積比是深度比的立方。）", "用紙做出量杯，標上刻度，倒水驗證，並說明刻度為什麼越往上越密。"], "show": "量杯設計與容量計算、刻度表，以及實作驗證。"}]}];</script>
<script src="firebase-config.js"></script>
<script type="module">
import { auth, db, login, logout, ROLES, staffRole, rosterOf, canSelfJoin, authBar, joinForm } from "./island-cloud.js";
import { CH, chapById, SEMS, DIR_NOTE, RUBRIC, RUBRIC_DESC, LEVEL, STARS, esc, rich, plain, fmtTime, chapLabel } from "./report-lib.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { doc, getDoc, getDocs, setDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
const bar = authBar($("main"));
let user = null, me = null, staff = "", chap = "", cls = "", tab = "gal";
let subs = {}, ext = {}, roster = [], grades = {}, peers = {}, myPeer = null, unsubs = [];
let stage = null;            // 報告模式 { list, i, img, showCm }
const imgCache = {};

/* ---------- 登入 ---------- */
function paintBar() {
  if (!user) {
    bar.innerHTML = '<span>登入之後才看得到同學的海報。</span><button class="p">用 Google 登入</button>';
    bar.querySelector("button").onclick = () => login().catch(() => {});
  } else if (staff) {
    bar.innerHTML = '<span>' + ROLES[staff] + '帳號 <b>' + esc(user.email) + '</b></span><button>登出</button>';
    bar.querySelector("button").onclick = () => logout();
  } else if (!me) {
    bar.innerHTML = '<span class="warn">這個帳號不在名單上</span><span>' + esc(user.email) + '</span><button>換帳號</button>';
    bar.querySelector("button").onclick = () => logout();
  } else {
    bar.innerHTML = '<span><b>' + esc(me.name) + '</b>（' + esc(me.cls) + ' 班 ' + esc(me.seat) + ' 號）</span><button>登出</button>';
    bar.querySelector("button").onclick = () => logout();
  }
  $("tlink").innerHTML = staff ? '<a href="teacher.html" style="text-decoration:none">老師頁面 →</a>' : "";
}
onAuthStateChanged(auth, async u => {
  user = u; me = null; staff = ""; roster = [];
  if (!u) { paintBar(); stop(); $("app").innerHTML = ""; return; }
  bar.innerHTML = "<span>確認名單中…</span>";
  let r = await rosterOf(u);
  staff = r ? "" : await staffRole(u);
  if (user !== u) return;
  if (!r && !staff && canSelfJoin(u)) {
    r = await new Promise(res => joinForm(bar, u, res, () => { res(null); logout(); }));
    if (!r || user !== u) return;
  }
  me = r; paintBar();
  if (!me && !staff) { $("app").innerHTML = ""; return; }
  if (staff) {
    const rs = await getDocs(collection(db, "roster"));
    rs.forEach(d => roster.push({ email: d.id, ...d.data() }));
    roster.sort((a, b) => String(a.cls).localeCompare(String(b.cls)) || (+a.seat || 0) - (+b.seat || 0));
  } else cls = me.cls;
  drawCtl(); openChap();
});

/* ---------- 選章、選班 ---------- */
function classes() {
  const s = new Set(roster.map(r => r.cls).filter(Boolean));
  Object.values(subs).forEach(x => x.cls && s.add(x.cls));
  if (me && me.cls) s.add(me.cls);
  return [...s].sort();
}
function drawCtl() {
  $("chap").innerHTML = SEMS.map(s => '<optgroup label="' + s + '">' + CH.filter(c => c.sem === s).map(c => '<option value="' + c.id + '">' + esc(c.code + " " + c.name + "《" + c.title + "》") + "</option>").join("") + "</optgroup>").join("");
  if (!chapById(chap)) chap = chapById(location.hash.slice(1)) ? location.hash.slice(1) : (localStorage.getItem("rpt:chap") || CH[0].id);
  if (!chapById(chap)) chap = CH[0].id;
  $("chap").value = chap;
  drawCls();
}
function drawCls() {
  const cs = classes();
  if (staff && !cls && cs.length === 1) cls = cs[0];
  $("cls").innerHTML = '<option value="">全部</option>' + cs.map(c => '<option' + (c === cls ? " selected" : "") + ">" + esc(c) + "</option>").join("");
  $("cls").value = cls;
}
$("chap").onchange = () => { chap = $("chap").value; try { localStorage.setItem("rpt:chap", chap); } catch (e) {} history.replaceState(null, "", "#" + chap); openChap(); };
$("cls").onchange = () => { cls = $("cls").value; draw(); };
window.addEventListener("hashchange", () => { if (chapById(location.hash.slice(1)) && location.hash.slice(1) !== chap) { chap = location.hash.slice(1); $("chap").value = chap; openChap(); } });

/* 老師正在評分（有展開的那一位）時，資料更新不要重畫，免得打到一半的評語不見 */
const quiet = () => staff && tab === "gr" && !!document.querySelector("#pane details[open]");
function stop() { unsubs.forEach(f => f()); unsubs = []; }
function openChap() {
  stop(); subs = {}; ext = {}; grades = {}; peers = {}; myPeer = null;
  $("app").innerHTML = '<p class="muted">載入中…</p>';
  const id = chap;
  unsubs.push(onSnapshot(doc(db, "ext", id), d => {
    const before = ext.now;
    ext = d.exists() ? d.data() : {};
    if (me && ext.now !== before) { pc = { t: ext.now, v: "", n: 0 }; loadMyPeer(); }
    if (stage) updateLive();
    draw();
  }, () => {}));
  unsubs.push(onSnapshot(collection(db, "ext", id, "subs"), s => {
    subs = {}; s.forEach(d => subs[d.id] = d.data());
    drawCls(); if (!quiet()) draw();
  }, e => { $("app").innerHTML = '<p class="warn">讀不到資料（' + esc(e.code || e.message) + "）</p>"; }));
  if (staff) {
    unsubs.push(onSnapshot(collection(db, "ext", id, "grades"), s => { grades = {}; s.forEach(d => grades[d.id] = d.data()); if (!quiet()) draw(); }, () => {}));
    unsubs.push(onSnapshot(collection(db, "ext", id, "peer"), s => {
      peers = {}; s.forEach(d => { const x = d.data(); (peers[x.target] = peers[x.target] || []).push(x); });
      if (stage) updateLive();
      if (tab !== "ord" && !quiet()) draw();
    }, () => {}));
  }
}
async function loadMyPeer() {
  myPeer = null;
  if (!ext.now || !me) return;
  try { const d = await getDoc(doc(db, "ext", chap, "peer", ext.now + "_" + user.uid)); myPeer = d.exists() ? d.data() : null; } catch (e) {}
  draw();
}

/* ---------- 名單整理 ---------- */
const inCls = x => !cls || x.cls === cls;
const done = () => Object.entries(subs).filter(([u, x]) => x.done && inCls(x));
function ordered(list) {
  const ord = (ext.order && cls && ext.order[cls]) || [];
  const pos = u => { const i = ord.indexOf(u); return i < 0 ? 1e6 : i; };
  return list.slice().sort((a, b) => pos(a[0]) - pos(b[0]) || String(a[1].cls).localeCompare(String(b[1].cls)) || (+a[1].seat || 0) - (+b[1].seat || 0));
}
const peerStat = uid => {
  const l = peers[uid] || [];
  const n = l.length, avg = n ? l.reduce((s, x) => s + x.stars, 0) / n : 0;
  return { n, avg, l };
};
const total = g => g && g.s ? RUBRIC.reduce((s, r, i) => s + (+g.s["r" + i] || 0), 0) : 0;
const scored = g => g && g.s && RUBRIC.some((r, i) => g.s["r" + i]);
const qOf = x => { const c = chapById(chap); return c && c.qs[x.q]; };

/* ---------- 畫面 ---------- */
function draw() {
  if (!user || (!me && !staff)) return;
  const d = done();
  $("sum").textContent = "已交 " + d.length + " 份" + (staff ? "／選題 " + Object.values(subs).filter(inCls).length + " 人" : "") + (ext.lock ? "　（已截止收件）" : "");
  let h = "";
  if (me) h += liveCard();
  if (staff) {
    const tabs = [["gal", "展示"], ["st", "繳交狀況"], ["ord", "報告順序"], ["gr", "評分與互評"]];
    h += '<div class="tabs">' + tabs.map(t => '<button data-t="' + t[0] + '"' + (t[0] === tab ? ' class="on"' : "") + ">" + t[1] + "</button>").join("") +
      (staff !== "viewer" ? '<button class="go" id="go">▶ 報告模式</button>' : "") + "</div>";
  }
  h += '<div id="pane"></div>';
  $("app").innerHTML = h;
  $("app").querySelectorAll(".tabs button[data-t]").forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
  if ($("go")) $("go").onclick = openStage;
  wireLive();
  const t = staff ? tab : "gal";
  if (t === "gal") drawGallery(); else if (t === "st") drawStatus(); else if (t === "ord") drawOrder(); else drawGrades();
}

function drawGallery() {
  const list = ordered(done());
  const hasOrd = cls && ext.order && ext.order[cls] && ext.order[cls].length;
  if (!list.length) { $("pane").innerHTML = '<p class="muted">這一章' + (cls ? " " + esc(cls) + " 班" : "") + "還沒有人交。</p>"; return; }
  $("pane").innerHTML = '<div class="gal">' + list.map(([u, x], i) => {
    const q = qOf(x);
    return '<div class="card" data-u="' + u + '">' + (hasOrd ? '<span class="ordno">' + (i + 1) + "</span>" : "") +
      (x.thumb ? '<img class="cover" src="' + x.thumb + '" alt="" loading="lazy">' : '<div class="nocover">' + (x.link ? "海報在連結裡" : "沒有照片") + "</div>") +
      '<div class="row" style="justify-content:space-between"><span class="who">' + esc(x.name) + '</span><span class="muted">' + esc(x.cls) + "－" + esc(x.seat) + "</span></div>" +
      '<div><span class="pill b">' + esc(x.k) + '</span> <span class="tt">' + (q ? rich(q.t) : esc(x.title)) + "</span></div>" +
      '<div class="cc">' + esc(x.concl) + "</div>" + (u === ext.now ? '<span class="pill no">台上</span>' : "") + "</div>";
  }).join("") + "</div>";
  $("pane").querySelectorAll(".card").forEach(c => c.onclick = () => showOne(c.dataset.u));
}

/* 放大看一份 */
async function imagesOf(u) {
  const x = subs[u]; if (!x || !x.n) return [];
  const key = chap + "/" + u + "/" + x.updated;
  if (imgCache[key]) return imgCache[key];
  const out = [];
  for (let i = 0; i < x.n; i++) { try { const d = await getDoc(doc(db, "ext", chap, "subs", u, "img", String(i))); if (d.exists()) out.push(d.data().data); } catch (e) {} }
  return imgCache[key] = out;
}
function viewerHtml(imgs, k) {
  if (!imgs.length) return '<p class="muted">沒有照片。</p>';
  return '<div class="viewer"><img src="' + imgs[k] + '" alt="海報">' + (imgs.length > 1 ? '<div class="strip">' + imgs.map((s, i) => '<button data-k="' + i + '"' + (i === k ? ' class="on"' : "") + ">第 " + (i + 1) + " 張</button>").join("") + "</div>" : "") + "</div>";
}
async function showOne(u) {
  const x = subs[u], q = qOf(x);
  $("ovl").innerHTML = '<div class="ov"><div class="box"><button class="x ghost">✕ 關閉</button><h2 style="margin:0">' + esc(x.name) + ' <span class="muted">' + esc(x.cls) + "－" + esc(x.seat) + "</span></h2>" +
    '<p style="margin:6px 0"><span class="pill b">' + esc(x.k) + "</span>　" + (q ? rich(q.t) : esc(x.title)) + "</p>" +
    '<p style="font-size:19px;font-weight:700;border-left:4px solid var(--red);padding-left:10px">' + esc(x.concl) + "</p>" +
    (x.link ? '<p><a href="' + esc(x.link) + '" target="_blank" rel="noopener">打開海報連結 →</a></p>' : "") +
    '<div id="vw"><p class="muted">照片載入中…</p></div>' + (staff ? '<div id="gbox"></div>' : "") + "</div></div>";
  const close = () => { $("ovl").innerHTML = ""; document.removeEventListener("keydown", esck); };
  const esck = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esck);
  $("ovl").querySelector(".x").onclick = close;
  $("ovl").querySelector(".ov").onclick = e => { if (e.target.classList.contains("ov")) close(); };
  if (staff) gradeForm($("gbox"), u);
  const imgs = await imagesOf(u);
  const paint = k => { const v = $("vw"); if (!v) return; v.innerHTML = viewerHtml(imgs, k); v.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => paint(+b.dataset.k)); };
  paint(0);
}

/* ---------- 學生：台上那一位 ---------- */
function liveCard() {
  if (!ext.now || (ext.nowCls && me.cls !== ext.nowCls)) return "";
  const x = subs[ext.now];
  if (!x) return "";
  if (ext.now === user.uid) return '<div class="banner"><b>輪到你上台了！</b><span>同學正在給你星星和建議。</span></div>';
  const q = qOf(x);
  if (pc.t !== ext.now) pc = { t: ext.now, v: "", n: 0 };
  const st = pc.n || (myPeer ? myPeer.stars : 0);
  return '<div class="sketch2" style="border-color:var(--red);border-width:3px"><div class="row"><b style="color:var(--red);font-size:18px">現在台上：' + esc(x.name) + "</b>" +
    '<span class="pill b">' + esc(x.k) + "</span></div>" + '<p style="margin:4px 0" class="muted">' + (q ? rich(q.t) : esc(x.title)) + "</p>" +
    '<div class="field"><label>給幾顆星？</label><div class="stars" id="stars">' + [1, 2, 3].map(n => '<button data-n="' + n + '"' + (n === st ? ' class="on"' : "") + ">" + "★".repeat(n) + " " + STARS[n] + "</button>").join("") + "</div></div>" +
    '<div class="field"><label for="pc">一句話 <span class="muted">（最喜歡的地方，或最想問的問題；80 字以內）</span></label><input type="text" id="pc" maxlength="80" value="' + esc(pc.v || (myPeer ? myPeer.comment : "")) + '"></div>' +
    '<div class="row"><button class="p" id="psend">' + (myPeer ? "更新" : "送出") + '</button><span class="muted" id="pmsg">' + (myPeer ? "✓ 已送出，報告結束前都可以改" : "") + "</span></div></div>";
}
let pickStar = 0, pc = { t: "", v: "", n: 0 };   // 台下正在寫的星星與一句話（重畫畫面時保留）
function wireLive() {
  const s = $("stars"); if (!s) return;
  pickStar = pc.n || (myPeer ? myPeer.stars : 0);
  $("pc").oninput = e => { pc.v = e.target.value; };
  s.querySelectorAll("button").forEach(b => b.onclick = () => { pickStar = pc.n = +b.dataset.n; s.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); });
  $("psend").onclick = async () => {
    if (!pickStar) { $("pmsg").textContent = "先選星星"; return; }
    const target = ext.now;
    const d = { target, rater: user.uid, name: me.name ?? "", stars: pickStar, comment: $("pc").value.trim().slice(0, 80), updated: new Date().toISOString() };
    $("psend").disabled = true;
    try { await setDoc(doc(db, "ext", chap, "peer", target + "_" + user.uid), d); myPeer = d; pc = { t: target, v: "", n: 0 }; $("pmsg").textContent = "✓ 已送出，報告結束前都可以改"; $("psend").textContent = "更新"; }
    catch (e) { $("pmsg").textContent = e.code === "permission-denied" ? "這一位已經報告完了，不能再送" : "沒有送成功：" + (e.code || e.message); }
    $("psend").disabled = false;
  };
}

/* ---------- 老師：繳交狀況 ---------- */
function drawStatus() {
  const c = chapById(chap);
  const ros = roster.filter(inCls);
  const byEmailName = {};
  const subList = Object.entries(subs).filter(([u, x]) => inCls(x));
  // 名單上的人：用 班級＋座號 對到繳交
  const key = x => x.cls + "-" + x.seat;
  const subByKey = {}; subList.forEach(([u, x]) => subByKey[key(x)] = [u, x]);
  const rows = ros.map(r => ({ r, s: subByKey[key(r)] }));
  subList.forEach(([u, x]) => { if (!ros.some(r => key(r) === key(x))) rows.push({ r: { name: x.name, cls: x.cls, seat: x.seat }, s: [u, x] }); });
  const cnt = [0, 0, 0, 0, 0, 0]; subList.forEach(([u, x]) => cnt[x.q]++);
  const mx = Math.max(1, ...cnt);
  const nNo = rows.filter(r => !r.s).length;
  let h = '<div class="row" style="margin-bottom:10px">' +
    (staff !== "viewer" ? '<button id="lock">' + (ext.lock ? "重新開放收件" : "截止收件") + "</button>" : "") +
    '<button id="csv">匯出 CSV</button><span class="muted">還沒選題 ' + nNo + " 人</span></div>" +
    '<div class="qbar">' + c.qs.map((x, i) => '<span><span class="pill b">' + esc(x.k) + '</span></span><span title="' + esc(plain(x.t)) + '"><i style="width:' + (cnt[i] / mx * 100) + '%;min-width:' + (cnt[i] ? 4 : 0) + 'px"></i></span><span>' + cnt[i] + " 人</span>").join("") + "</div>" +
    '<div class="scroll"><table class="tbl"><thead><tr><th>班級</th><th>座號</th><th>姓名</th><th>狀態</th><th>題目</th><th>一句話結論</th><th>交件</th><th>原圖</th><th>老師</th><th>同學★</th></tr></thead><tbody>' +
    rows.map(({ r, s }) => {
      if (!s) return "<tr><td>" + esc(r.cls) + "</td><td>" + esc(r.seat) + "</td><td>" + esc(r.name) + '</td><td><span class="pill">未選</span></td><td colspan="6"></td></tr>';
      const [u, x] = s, g = grades[u], p = peerStat(u);
      return "<tr><td>" + esc(x.cls) + "</td><td>" + esc(x.seat) + "</td><td>" + esc(x.name) + "</td><td>" + (x.done ? '<span class="pill ok">已交</span>' : '<span class="pill no">已選未交</span>') + "</td>" +
        '<td><span class="pill b">' + esc(x.k) + '</span> <span style="font-size:13px">' + esc(x.title) + "</span></td><td>" + esc(x.concl) + (x.link ? ' <a href="' + esc(x.link) + '" target="_blank" rel="noopener">連結</a>' : "") + "</td>" +
        '<td class="muted">' + esc(fmtTime(x.doneAt)) + "</td><td>" + (x.drive || []).map((id, i) => '<a href="https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view" target="_blank" rel="noopener">' + (i + 1) + "</a>").join(" ") + "</td>" +
        "<td>" + (scored(g) ? total(g) + "／15" + (g.show ? "" : ' <span class="muted">未公開</span>') : "") + "</td><td>" + (p.n ? p.avg.toFixed(1) + "（" + p.n + "）" : "") + "</td></tr>";
    }).join("") + "</tbody></table></div>";
  $("pane").innerHTML = h;
  if ($("lock")) $("lock").onclick = async () => {
    if (!ext.lock && !confirm("截止之後，學生就不能再改選題、改海報。確定？")) return;
    await setDoc(doc(db, "ext", chap), { lock: !ext.lock, updated: new Date().toISOString() }, { merge: true }).catch(e => alert(e.code || e.message));
  };
  $("csv").onclick = () => exportCsv(rows);
}
function exportCsv(rows) {
  const c = chapById(chap);
  const head = ["章", "班級", "座號", "姓名", "狀態", "方向", "題目", "一句話結論", "連結", "交件時間", ...RUBRIC, "老師總分", "老師評語", "評語公開", "同學評分人數", "同學平均星數", "同學的話"];
  const lines = [head];
  rows.forEach(({ r, s }) => {
    if (!s) { lines.push([c.code, r.cls, r.seat, r.name, "未選"]); return; }
    const [u, x] = s, g = grades[u] || {}, p = peerStat(u);
    lines.push([c.code, x.cls, x.seat, x.name, x.done ? "已交" : "已選未交", x.k, x.title, x.concl, x.link, x.doneAt,
      ...RUBRIC.map((t, i) => g.s && g.s["r" + i] ? g.s["r" + i] : ""), scored(g) ? total(g) : "", g.comment || "", g.show ? "是" : "",
      p.n || "", p.n ? p.avg.toFixed(2) : "", p.l.map(y => y.name + "：" + "★".repeat(y.stars) + (y.comment ? " " + y.comment : "")).join("／")]);
  });
  const csv = "﻿" + lines.map(l => l.map(v => '"' + String(v ?? "").replace(/"/g, '""') + '"').join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "章後延伸報告_" + c.code + (cls ? "_" + cls : "") + ".csv"; a.click();
}

/* ---------- 老師：報告順序 ---------- */
let ordDraft = null;
function drawOrder() {
  if (!cls) { $("pane").innerHTML = '<p class="muted">先在上面選一個班級，再排這個班的報告順序。</p>'; return; }
  const list = ordered(done());
  if (!ordDraft || ordDraft.chap !== chap || ordDraft.cls !== cls) ordDraft = { chap, cls, ids: list.map(x => x[0]), dirty: false };
  ordDraft.ids = ordDraft.ids.filter(u => subs[u] && subs[u].done && subs[u].cls === cls);
  list.forEach(([u]) => { if (!ordDraft.ids.includes(u)) ordDraft.ids.push(u); });
  const ro = staff === "viewer";
  $("pane").innerHTML = '<div class="row" style="margin-bottom:10px">' + (ro ? "" : '<button id="rnd">🎲 隨機排</button><button id="bys">依座號</button><button class="p" id="sv"' + (ordDraft.dirty ? "" : " disabled") + ">存這個順序</button>") +
    '<span class="muted">' + (ro ? "" : "拖拉或按 ↑↓ 調整；") + "只列已交的 " + ordDraft.ids.length + " 人。" + (ordDraft.dirty ? '<span class="warn">　還沒存</span>' : "") + "</span></div>" +
    '<ol class="ord" id="ol">' + ordDraft.ids.map((u, i) => { const x = subs[u]; return '<li draggable="' + !ro + '" data-u="' + u + '"><span class="n">' + (i + 1) + "</span><b>" + esc(x.name) + '</b><span class="muted">' + esc(x.seat) + ' 號</span><span class="t"><span class="pill b">' + esc(x.k) + "</span> " + esc(x.title) + "</span>" + (ro ? "" : '<button data-m="-1">↑</button><button data-m="1">↓</button>') + "</li>"; }).join("") + "</ol>";
  if (ro) return;
  const set = ids => { ordDraft.ids = ids; ordDraft.dirty = true; drawOrder(); };
  $("rnd").onclick = () => { const a = ordDraft.ids.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } set(a); };
  $("bys").onclick = () => set(ordDraft.ids.slice().sort((a, b) => (+subs[a].seat || 0) - (+subs[b].seat || 0)));
  $("sv").onclick = async () => {
    const order = { ...(ext.order || {}), [cls]: ordDraft.ids };
    try { await setDoc(doc(db, "ext", chap), { order, updated: new Date().toISOString() }, { merge: true }); ordDraft.dirty = false; drawOrder(); }
    catch (e) { alert("沒有存成功：" + (e.code || e.message)); }
  };
  let dragU = null;
  $("ol").querySelectorAll("li").forEach(li => {
    li.querySelectorAll("button[data-m]").forEach(b => b.onclick = () => {
      const a = ordDraft.ids.slice(), i = a.indexOf(li.dataset.u), j = i + +b.dataset.m;
      if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; set(a);
    });
    li.ondragstart = e => { dragU = li.dataset.u; li.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragU); };
    li.ondragend = () => li.classList.remove("drag");
    li.ondragover = e => { e.preventDefault(); li.classList.add("over"); };
    li.ondragleave = () => li.classList.remove("over");
    li.ondrop = e => {
      e.preventDefault(); li.classList.remove("over");
      if (!dragU || dragU === li.dataset.u) return;
      const a = ordDraft.ids.filter(u => u !== dragU);
      a.splice(a.indexOf(li.dataset.u) + (ordDraft.ids.indexOf(dragU) < ordDraft.ids.indexOf(li.dataset.u) ? 1 : 0), 0, dragU);
      set(a);
    };
  });
}

/* ---------- 老師：評分 ---------- */
function gradeForm(box, u, compact) {
  if (!box) return;
  const ro = staff === "viewer";
  const g = grades[u] || { s: {}, comment: "", show: false };
  const s = { ...(g.s || {}) };
  box.innerHTML = '<div class="sketch" style="margin-top:12px"><b>老師評分</b>　<span class="muted">批改看五件事，每項 1～3</span>' +
    '<div class="rub" style="margin:8px 0">' + RUBRIC.map((r, i) => '<span title="做到：' + esc(RUBRIC_DESC[i][0]) + '\n很好：' + esc(RUBRIC_DESC[i][1]) + '" style="cursor:help;border-bottom:1px dotted var(--edge)">' + esc(r) + '</span><span class="lv" data-i="' + i + '">' + [1, 2, 3].map(n => '<button data-n="' + n + '"' + (s["r" + i] === n ? ' class="on"' : "") + (ro ? " disabled" : "") + (n > 1 ? ' title="' + esc(RUBRIC_DESC[i][n - 2]) + '"' : "") + ">" + n + " " + LEVEL[n] + "</button>").join("") + "</span>").join("") + "</div>" +
    '<div class="row"><span>總分 <b class="tt">' + RUBRIC.reduce((a, r, i) => a + (s["r" + i] || 0), 0) + "</b>／15</span></div>" +
    '<div class="field"><textarea class="cmt" placeholder="給學生的評語" maxlength="1000"' + (ro ? " disabled" : "") + ">" + esc(g.comment || "") + "</textarea></div>" +
    (ro ? "" : '<div class="row"><label><input type="checkbox" class="shw"' + (g.show ? " checked" : "") + "> 學生看得到（報告島上他自己的那一章）</label><button class=\"p sv\">存評分</button><span class=\"muted m\"></span></div>") + "</div>";
  if (ro) return;
  box.querySelectorAll(".lv").forEach(lv => lv.querySelectorAll("button").forEach(b => b.onclick = () => {
    const i = lv.dataset.i, n = +b.dataset.n;
    s["r" + i] = s["r" + i] === n ? 0 : n;
    if (!s["r" + i]) delete s["r" + i];
    lv.querySelectorAll("button").forEach(x => x.classList.toggle("on", s["r" + i] === +x.dataset.n));
    box.querySelector(".tt").textContent = RUBRIC.reduce((a, r, k) => a + (s["r" + k] || 0), 0);
  }));
  box.querySelector(".sv").onclick = async () => {
    const d = { s, comment: box.querySelector(".cmt").value.trim(), show: box.querySelector(".shw").checked, by: user.email, updated: new Date().toISOString() };
    try { await setDoc(doc(db, "ext", chap, "grades", u), d); grades[u] = d; box.querySelector(".m").textContent = "✓ 存好了"; }
    catch (e) { box.querySelector(".m").textContent = "沒有存成功：" + (e.code || e.message); }
  };
}
function drawGrades() {
  const list = ordered(done());
  if (!list.length) { $("pane").innerHTML = '<p class="muted">還沒有人交。</p>'; return; }
  const ro = staff === "viewer";
  $("pane").innerHTML = (ro ? "" : '<div class="row" style="margin-bottom:10px"><button id="pub">已評分的全部公開給學生</button><span class="muted">點一位同學展開評分；同學的話會列在下面（只有老師看得到是誰寫的）。</span></div>') +
    list.map(([u, x]) => {
      const g = grades[u], p = peerStat(u);
      return '<details class="sketch2" data-u="' + u + '"><summary style="cursor:pointer"><b>' + esc(x.name) + '</b> <span class="muted">' + esc(x.cls) + "－" + esc(x.seat) + '</span>　<span class="pill b">' + esc(x.k) + "</span>　" +
        (scored(g) ? '<span class="pill ok">' + total(g) + "／15" + (g.show ? "・已公開" : "") + "</span>" : '<span class="pill">未評分</span>') +
        "　" + (p.n ? '<span class="pill">★ ' + p.avg.toFixed(1) + "（" + p.n + " 人）</span>" : "") + '</summary><p style="margin:8px 0 0"><b>結論：</b>' + esc(x.concl) + "</p>" +
        '<div class="g"></div>' + (p.n ? '<div><b>同學的話</b><ul class="cm">' + p.l.map(y => "<li>" + "★".repeat(y.stars) + "　" + esc(y.comment || "（沒寫）") + ' <span class="muted">— ' + esc(y.name) + "</span></li>").join("") + "</ul></div>" : "") + "</details>";
    }).join("");
  $("pane").querySelectorAll("details").forEach(d => d.ontoggle = () => { if (d.open && !d.querySelector(".g").innerHTML) gradeForm(d.querySelector(".g"), d.dataset.u); });
  if ($("pub")) $("pub").onclick = async () => {
    const todo = list.filter(([u]) => scored(grades[u]) && !grades[u].show);
    if (!todo.length) { alert("沒有要公開的。"); return; }
    if (!confirm("把 " + todo.length + " 位已評分的公開給學生？")) return;
    for (const [u] of todo) await setDoc(doc(db, "ext", chap, "grades", u), { ...grades[u], show: true, updated: new Date().toISOString() }).catch(() => {});
  };
}

/* ---------- 報告模式（投影用） ---------- */
async function openStage() {
  if (!cls) { alert("先在上面選一個班級。"); return; }
  const list = ordered(done()).map(x => x[0]);
  if (!list.length) { alert("這個班還沒有人交。"); return; }
  let i = Math.max(0, list.indexOf(ext.now));
  stage = { list, i, img: 0, showCm: false, imgs: [] };
  document.body.insertAdjacentHTML("beforeend", '<div id="stage"></div>');
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  await go(i);
}
async function setNow(u) {
  await setDoc(doc(db, "ext", chap), { now: u || "", nowCls: u ? cls : "", updated: new Date().toISOString() }, { merge: true }).catch(e => alert("沒有切換成功：" + (e.code || e.message)));
}
async function go(i) {
  stage.i = Math.max(0, Math.min(stage.list.length - 1, i)); stage.img = 0; stage.imgs = [];
  const u = stage.list[stage.i];
  drawStage();
  await setNow(u);
  stage.imgs = await imagesOf(u);
  if (stage && stage.list[stage.i] === u) drawStage();
}
function drawStage() {
  const el = $("stage"); if (!el || !stage) return;
  const u = stage.list[stage.i], x = subs[u] || {}, q = qOf(x), p = peerStat(u);
  const live = ext.now === u;
  el.innerHTML = '<div class="pv">' + (stage.imgs.length ? '<img src="' + stage.imgs[stage.img] + '" alt="海報" id="simg">' + (stage.imgs.length > 1 ? '<div class="viewer"><div class="strip">' + stage.imgs.map((s, k) => '<button data-k="' + k + '"' + (k === stage.img ? ' class="on"' : "") + ">第 " + (k + 1) + " 張</button>").join("") + "</div></div>" : "")
      : (x.n ? '<p class="muted">海報載入中…</p>' : '<p class="muted" style="font-size:20px">沒有上傳照片' + (x.link ? "，海報在連結裡" : "") + "</p>")) + "</div>" +
    '<div class="side"><div class="muted">' + esc(chapLabel(chapById(chap))) + "</div><h2>" + esc(x.name || "") + ' <span class="muted" style="font-size:18px">' + esc(x.cls) + "－" + esc(x.seat) + "</span></h2>" +
    '<div class="q"><span class="pill b">' + esc(x.k || "") + "</span>　" + (q ? rich(q.t) : esc(x.title)) + "</div>" +
    '<div class="cc">' + esc(x.concl || "") + "</div>" + (x.link ? '<p><a href="' + esc(x.link) + '" target="_blank" rel="noopener">打開海報連結 →</a></p>' : "") +
    '<div class="peerbox" id="pb"></div>' +
    '<details id="gd"><summary style="cursor:pointer;font-weight:700">老師評分（點開）</summary><div id="sg"></div></details></div>' +
    '<div class="nav"><button id="pv"' + (stage.i ? "" : " disabled") + '>← 上一位</button><span class="mid">第 ' + (stage.i + 1) + "／" + stage.list.length + ' 位</span><button class="p" id="nx"' + (stage.i < stage.list.length - 1 ? "" : " disabled") + '>下一位 →</button>' +
    '<button class="ghost" id="tg"></button><span style="flex:1"></span><button id="end">結束報告</button></div>';
  $("pv").onclick = () => go(stage.i - 1);
  $("nx").onclick = () => go(stage.i + 1);
  $("tg").onclick = () => setNow(ext.now === u ? "" : u);
  updateLive();
  $("end").onclick = closeStage;
  el.querySelectorAll(".strip button").forEach(b => b.onclick = () => { stage.img = +b.dataset.k; drawStage(); });
  const im = $("simg"); if (im) im.onclick = () => im.classList.toggle("big");
  $("gd").ontoggle = () => { if ($("gd").open) gradeForm($("sg"), u); };
}
/* 只更新同學評分那一塊，不動老師正在打的評分 */
function updateLive() {
  const pb = $("pb"); if (!pb || !stage) return;
  const u = stage.list[stage.i], p = peerStat(u), live = ext.now === u;
  const dist = [3, 2, 1].map(n => { const c = p.l.filter(y => y.stars === n).length; return "<span>" + "★".repeat(n) + '</span><span><i style="width:' + (p.n ? c / p.n * 100 : 0) + '%;min-width:' + (c ? 4 : 0) + 'px"></i></span><span>' + c + "</span>"; }).join("");
  pb.innerHTML = '<div class="row"><b>同學給的星星</b>' + (live ? '<span class="pill ok">評分中</span>' : '<span class="pill">評分暫停</span>') + '</div><div class="row"><span class="big">' + (p.n ? "★ " + p.avg.toFixed(1) : "—") + '</span><span class="muted">' + p.n + ' 人</span></div><div class="dist">' + dist + "</div>" +
    '<div class="row" style="margin-top:6px"><button class="ghost" id="cmt">' + (stage.showCm ? "收起同學的話" : "顯示同學的話") + "</button></div>" +
    (stage.showCm ? '<ul class="cm">' + p.l.filter(y => y.comment).map(y => "<li>" + "★".repeat(y.stars) + "　" + esc(y.comment) + "</li>").join("") + "</ul>" : "");
  $("cmt").onclick = () => { stage.showCm = !stage.showCm; updateLive(); };
  $("tg").textContent = live ? "暫停評分" : "開放評分";
}
async function closeStage() {
  if (!confirm("結束報告？同學那邊會停止評分。")) return;
  await setNow("");
  stage = null; $("stage")?.remove();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  draw();
}
document.addEventListener("keydown", e => {
  if (!stage || ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") go(stage.i + 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") go(stage.i - 1);
});

paintBar();
</script>
</body>
