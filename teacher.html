<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>老師頁面｜數學探索島</title>
<style>
:root{
  color-scheme:light dark;
  --paper:#F5F2E8; --card:#FFFDF8; --edge:#DFD6C4; --edge-soft:#EBE3D4;
  --ink:#23282D; --ink-2:#5C554A; --ink-3:#847B6C; --indigo:#2E5A88; --indigo-soft:#E7EEF6;
  --orange:#C1652F; --orange-soft:#FBEEE1; --green:#4A7C59; --green-soft:#E7F0E9; --crimson:#B23A3A;
  --serif:"Noto Serif TC",'Songti TC',serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#161A1E; --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
  --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A; --indigo:#82ADDC; --indigo-soft:#1E2C3B;
  --orange:#E28B52; --orange-soft:#3A2718; --green:#82B893; --green-soft:#1D2C22; --crimson:#D66B6B;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
header{padding:34px 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px}
h1{font-family:var(--serif);font-size:32px;margin:0}
.who{margin-left:auto;font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:center}
button,select,textarea,input{font:inherit;color:var(--ink)}
button{padding:6px 14px;border:1px solid var(--edge);border-radius:5px;background:var(--card);cursor:pointer;font-weight:600}
button.p{background:var(--indigo);border-color:var(--indigo);color:var(--card)}
button:disabled{opacity:.4;cursor:default}
select{padding:6px 10px;border:1px solid var(--edge);border-radius:5px;background:var(--card)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--edge);margin:6px 0 18px}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--ink-3)}
.tabs button.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:6px;padding:16px 18px;margin:0 0 16px}
.muted{color:var(--ink-3);font-size:13.5px}
textarea{width:100%;min-height:150px;padding:10px;border:1px solid var(--edge);border-radius:5px;background:var(--paper);font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--edge-soft);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--ink-3);letter-spacing:.06em;position:sticky;top:0;background:var(--card)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--edge);vertical-align:-2px}
.dot.half{border-color:var(--indigo);background:linear-gradient(90deg,var(--indigo) 50%,transparent 50%)}
.dot.ok{border-color:var(--green);background:var(--green)}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--edge);color:var(--ink-3);white-space:nowrap}
.tag.ok{border-color:var(--green);color:var(--green)}
.tag.no{border-color:var(--orange);color:var(--orange)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin:6px 0 4px}
.bars i{display:block;height:14px;border-radius:3px;background:var(--indigo)}
.pred{color:var(--indigo)} .obs{color:var(--ink)}
.empty{color:var(--ink-3)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.scroll{overflow-x:auto}
.gate{padding:60px 0;text-align:center}
.sum th.u{writing-mode:vertical-rl;letter-spacing:0;font-size:12px;padding:6px 2px;text-align:left;white-space:nowrap;min-width:26px}
.sum td.c{padding:3px 2px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums;min-width:26px}
.sum td.c span{display:block;border-radius:3px;padding:3px 0;color:var(--ink-2)}
.sum td.c .z{color:var(--edge)}
.sum td.c .s{background:var(--green);color:var(--card);font-weight:700}
.sum tfoot td{font-size:11.5px;color:var(--ink-3);text-align:center;border-top:2px solid var(--edge)}
.sum td.nm,.sum th.nm{position:sticky;left:0;background:var(--card);white-space:nowrap}
.time{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.legend i{display:inline-block;width:22px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>老師頁面</h1><span class="muted">數學探索島</span><span class="who" id="who"></span></header>

": "lab4"}, {"sel": "#end", "after": "ALL"}], "quiz": [{"q": "「不管 x 是多少，y 都是 3」，這是不是函數？", "opts": ["是函數", "不是，因為不同的 x 給出同一個 y", "不是，因為式子裡沒有 x", "要看 x 的範圍才知道"], "ans": 0, "why": ["", "這就是「多對一」。門檻只管同一個 x 會不會給出兩個 y，不同的 x 給同一個 y 完全沒問題。回去看第 2 站。", "停車費連式子都寫不出來，照樣是函數。有沒有 x 出現在式子裡，不是門檻。", "每一個 x 都只給 3，沒有任何一個 x 會改口，不管範圍怎麼取都一樣。"], "exp": "每一個 x 都只吐出 3，沒有一個 x 會給兩個答案，所以是函數，而且是多對一的函數（第 1 站的 k(x) ＝ 5）。"}, {"q": "圓 x² ＋ y² ＝ 25 不是函數的圖形，關鍵原因是什麼？", "opts": ["有一個 x 對到兩個 y，例如 x ＝ 3 對到 4 和 −4", "有兩個 x 對到同一個 y，例如 y ＝ 4 對到 3 和 −3", "它是彎的，不是直線", "它是封閉的，頭尾接在一起"], "ans": 0, "why": ["", "這是「多對一」，不是壞法。拋物線 y ＝ x² − 4 也有這個現象，它卻是函數。", "拋物線也是彎的，它是函數。", "封閉不是重點：只要有同一個 x 對到兩個 y 就不行。把圓拆成上下兩半，各自都是函數。"], "exp": "鉛直線 x ＝ 3 碰到圓兩次，同一個輸入給出兩個輸出，f(3) 這個名字就指不到東西了。只留上半圓就救回來。"}, {"q": "f(x) ＝ x² − 4。如果 f(x) ＝ 5，x 有幾個可能？", "opts": ["0 個", "1 個", "2 個", "無限多個"], "ans": 2, "why": ["x² ＝ 9 有解，試試 x ＝ 3。", "x ＝ 3 可以，再想想 x ＝ −3。", "", "x² ＝ 9 只有兩個數平方等於 9。"], "exp": "x² ＝ 9，x ＝ 3 或 −3。這是「往旁邊找」：給輸出找 x，定義沒有保證只有一個（第 4 站）。如果是 f(x) ＝ −5，就一個都找不到。"}]}, {"slug": "g8b-ch3-triangle", "chap": "八下3", "title": "不能再動了", "topic": "三角形的性質", "plain": "這座島上，看不能當憑據：條件夠了，圖形就不能再動，不用量也知道。", "stations": {"lab1": {"mode": "predict", "q": "只告訴別人一個三角形的三個角（AAA），他畫得出一模一樣的嗎？告訴他兩個邊和一個不夾在中間的角（SSA）呢？", "obs": "哪幾組條件讓淡色的三角形全部疊成同一個？"}, "lab2": {"mode": "predict", "q": "∠A ＝ 40°、AB ＝ 7、BC ＝ 5，照這三個條件畫得出幾個不一樣的三角形？", "obs": "把 BC 慢慢拉短，從幾個變成幾個？∠A 是直角時呢？"}, "lab3": {"mode": "observe", "obs": "角平分線和過線外一點作垂線，其實都在作什麼？每一步的理由是什麼？"}, "lab4": {"mode": "predict", "q": "沿著五邊形走一圈回到原地、面向原來的方向，車頭一共轉了幾度？換成八邊形呢？", "obs": "內角和一直在變，那個總轉量呢？"}, "lab5": {"mode": "predict", "q": "兩邊固定是 6 和 5，夾角從 60° 打開到 120°，對邊會變長還是變短？", "opts": ["變長", "變短", "不變"], "multi": false, "obs": "夾角剛好 90° 時，對邊是多長？"}, "lab6": {"mode": "predict", "q": "到 A、B 兩點距離一樣遠的點，全部連起來是什麼形狀？", "opts": ["一個圓", "一條直線", "只有一個點"], "multi": false, "obs": "換成「到兩邊一樣遠」，點又排成什麼樣子？"}, "lab7": {"mode": "predict", "q": "兩個一模一樣的正方形，一個的頂點釘在另一個的中心，旋轉的時候重疊面積會變嗎？正三角形呢？", "obs": "四種圖形裡，哪兩種會變、哪兩種不會？"}}, "gates": [{"sel": "#p2", "after": "lab2"}, {"sel": "#p3", "after": "lab5"}, {"sel": "#end", "after": "ALL"}], "quiz": [{"q": "正十邊形的外角和是幾度？", "opts": ["360°", "1440°", "180°", "36°"], "ans": 0, "why": ["", "1440° 是內角和。", "180° 是三角形的內角和。", "36° 是一個外角。"], "exp": "沿著邊走一圈回到原地，車頭剛好轉了一圈，不管幾邊形，外角和都是 360°。"}, {"q": "下面哪一組條件，不能保證兩個三角形全等？", "opts": ["SSA", "SAS", "ASA", "SSS"], "ans": 0, "why": ["", "SAS 會把三角形釘死。", "ASA 會把三角形釘死。", "SSS 會把三角形釘死。"], "exp": "SSA 的弧可能和底線交兩次，畫得出兩個不同的三角形（第 2 站）。只有角所對的邊比較長、或那個角是直角（RHS）時才安全。"}, {"q": "正六邊形的每一個內角是幾度？", "opts": ["60°", "108°", "120°", "135°"], "ans": 2, "why": ["60° 是外角。", "108° 是正五邊形的內角。", "", "135° 是正八邊形的內角。"], "exp": "每個外角是 360° ÷ 6 ＝ 60°，內角是 180° − 60° ＝ 120°。"}]}, {"slug": "g8b-ch4-parallel", "chap": "八下4", "title": "那條線本來不在圖上", "topic": "平行與四邊形", "plain": "這座島上的難題，常常要先補一條本來不在圖上的線。", "stations": {"lab1": {"mode": "predict", "q": "四根棒子用釘子接成一個四邊形框，推得動嗎？要加什麼，它才推不動？", "obs": "推的時候，哪些長度在變、哪些沒變？"}, "lab2": {"mode": "predict", "q": "乙線只比甲線歪 0.5°，兩條線會相交嗎？", "opts": ["會，只是交在很遠的地方", "不會"], "multi": false, "obs": "兩條線一相交，就和截線圍出一個三角形。兩個同位角的差，和交點那個角有什麼關係？"}, "lab3": {"mode": "predict", "q": "兩條平行線之間一條鋸齒線，把角一個隔一個分成兩組，兩組的和會怎樣？", "opts": ["一樣", "不一樣", "要看鋸齒的形狀"], "multi": false, "obs": "勾「補上平行線」，每個角被切成哪兩段？"}, "lab4": {"mode": "predict", "q": "底 BC 不動，頂點 A 沿著和 BC 平行的線滑，周長和面積各會怎樣？", "obs": "面積只看哪兩樣東西？平行線保證了哪一樣不變？"}, "lab5": {"mode": "predict", "q": "兩條對角線互相平分、而且等長，但沒有垂直，這是什麼四邊形？", "opts": ["平行四邊形", "矩形", "菱形", "正方形"], "multi": false, "obs": "對角線只垂直、不互相平分的時候，會是誰？"}, "lab6": {"mode": "predict", "q": "隨便一個四邊形，把四邊的中點連起來，中間那個四邊形會是什麼？", "opts": ["不一定", "永遠是平行四邊形", "永遠是矩形"], "multi": false, "obs": "它的面積是原來的幾分之幾？原來的對角線怎樣，它才會變成矩形或菱形？"}, "lab7": {"mode": "predict", "q": "兩面鏡子夾 72°，中間放一個東西，看得到幾個像？", "obs": "照兩次鏡子等於做了什麼動作？兩面鏡子平行時呢？"}}, "gates": [{"sel": "#p2", "after": "lab4"}, {"sel": "#p3", "after": "lab5"}, {"sel": "#end", "after": "ALL"}], "quiz": [{"q": "平行四邊形的兩條對角線，一定有什麼性質？", "opts": ["互相平分", "一樣長", "互相垂直", "平分內角"], "ans": 0, "why": ["", "一樣長的是矩形。", "互相垂直的是菱形。", "平分內角的是菱形。"], "exp": "連一條對角線、證兩個三角形全等，就得到對角線互相平分。反過來，對角線互相平分的四邊形一定是平行四邊形。"}, {"q": "對角線互相垂直平分的四邊形，一定是什麼？", "opts": ["矩形", "菱形", "箏形", "等腰梯形"], "ans": 1, "why": ["矩形的對角線是等長，不一定垂直。", "", "箏形的對角線垂直，但不互相平分。", "等腰梯形的對角線等長，不互相平分。"], "exp": "互相平分是平行四邊形的門票，再加上垂直，四個邊就一樣長，是菱形。"}, {"q": "隨便一個四邊形，四邊中點連成的四邊形，面積是原來的多少？", "opts": ["四分之一", "一半", "三分之二", "一樣大"], "ans": 1, "why": ["四個角各切掉一個小三角形，它們加起來剛好是原來的一半。", "", "每個角切掉的三角形，是一個大三角形的四分之一。", "四個角都被切掉了一塊。"], "exp": "每一個角切掉的小三角形，是對應大三角形的四分之一；四個加起來剛好是原四邊形的一半，所以中間剩一半。"}]}, {"slug": "g9a-ch1-similar", "chap": "九上1", "title": "兩個角就夠了", "topic": "相似形", "plain": "這座島上只管形狀、不管大小：兩個角一樣，三角形就長得一樣。", "stations": {"lab1": {"mode": "predict", "why": "調 ∠A、∠B，把第二個三角形放大；再試試只讓一個角一樣。", "q": "兩個三角形，至少要哪些地方一樣，三組對應邊的比才一定相等？", "opts": ["兩個角一樣", "一個角一樣", "三個角都要一樣", "一定要量三條邊"], "multi": false, "obs": "把「偷偷加」拉大，比怎麼了？為什麼不必管第三個角？"}, "lab2": {"mode": "predict", "why": "拉相似比 k，看周長、面積、體積各放大幾倍。", "q": "邊長放大 3 倍，面積會放大幾倍？體積呢？", "obs": "k 要是多少，面積才會剛好變成兩倍？"}, "lab3": {"mode": "predict", "why": "拖曳 D，看 △BDE 和 △CDE 的面積，以及兩組線段的比。", "q": "DE 和 BC 平行的時候，AD : DB 和 AE : EC 會怎樣？不平行的時候呢？", "obs": "平行的時候，哪兩塊面積一樣大？這為什麼會讓比相等？"}, "lab4": {"mode": "predict", "why": "直角三角形斜邊上畫一條高，把它切成兩個小三角形。拉 p、q 看看。", "q": "斜邊被高分成 p ＝ 3.6、q ＝ 6.4，這條高有多長？", "obs": "怎麼拉都成立的等式有哪幾個？其中兩個加起來會變成什麼？"}, "lab5": {"mode": "predict", "why": "同一時刻量人的影子和樹的影子，用來估計樹高。量影長時會有讀數誤差。", "q": "人高 1.6 公尺、影長 2 公尺，同一時刻樹影長 10 公尺。樹有多高？", "obs": "量十次，估計值怎麼跳？誤差是從哪裡來的？"}, "lab6": {"mode": "predict", "q": "人以每秒 1 公尺的速度離開燈桿，影子的頂端每秒跑多遠？", "opts": ["0.5 公尺", "1 公尺", "1.5 公尺", "越跑越快"], "multi": false, "obs": "影子長和人到燈桿的距離是什麼關係？影子頂端呢？"}, "lab7": {"mode": "predict", "why": "長 1、寬 x 的長方形，切掉最大的正方形，看剩下的那個長方形。", "q": "寬 x 大約是多少時，剩下的長方形會和原來的相似？先猜一個數。", "obs": "這個數你在哪裡見過？"}}, "gates": [{"sel": "#p1", "after": "lab2"}, {"sel": "#p2", "after": "lab4"}, {"sel": "#end", "after": "ALL"}], "quiz": [{"q": "兩個相似三角形的面積比是 9 : 16，它們的相似比（對應邊的比）是多少？", "opts": ["9 : 16", "3 : 4", "81 : 256", "4.5 : 8"], "ans": 1, "why": ["面積比是相似比的平方，不是相似比本身。", "", "81 : 256 是把 9 : 16 又平方了一次，方向反了。 , "一個，離 A 30", "兩個，離 A 30 和 60", "一個，離 A 90"], "ans": 0, "why": ["", "AB 中間那一個對了，B 的外側還有一個。", "離 A 60 的點，到 B 是 15，PA 是 PB 的四倍。", "B 外側那一個對了，AB 之間還有一個。"], "exp": "AB 之間：離 A 30、離 B 15；B 外側：離 A 90、離 B 45。兩個都是兩倍。"}, {"q": "這個圓的圓心和半徑是？（A、B 相距 45）", "opts": ["圓心在 B 外側、離 A 60，半徑 30", "圓心在 B，半徑 15", "圓心在 AB 中點，半徑 22.5", "圓心在 A，半徑 30"], "ans": 0, "why": ["", "圓會經過離 A 30 和 90 的兩點，B 不在這兩點正中間。", "AB 中點到兩個交點不一樣遠。", "圓也經過離 A 90 的點，A 到它是 90。"], "exp": "圓經過直線 AB 上離 A 30 和 90 的兩點，這兩點是直徑兩端，所以圓心離 A 60、半徑 30。"}, {"q": "把「兩倍」改成「剛好一倍」，也就是到 A、B 一樣遠，點會排成什麼？", "opts": ["AB 的中垂線", "一個很小的圓", "只有 AB 的中點", "沒有這樣的點"], "ans": 0, "why": ["", "倍數越接近 1，圓越大，不是越小。", "不只中點，中垂線上每一點都是。", "AB 的中點就是一個。"], "exp": "倍數越接近 1，圓越大；剛好一倍時，圓「大到變成一條直線」，就是 AB 的中垂線。"}]}, {"slug": "gp-u3-2", "chap": "拾光三-2", "title": "從頂點到底邊的那一條", "topic": "中線長", "plain": "這座島上，三角形的頂點到處跑；三段長度的平方，配好倍數加起來就不會變。", "stations": {"lab1": {"mode": "predict", "why": "拖動橘色的 A，在右邊調三個數，找出 A 跑到哪裡「加起來」都不變的那一組；再按「隨機 1000 個 A」。", "q": "M 是 BC 的中點。AB²、AC²、AM² 各乘一個整數再加起來，你猜乘哪一組數，A 跑到哪裡結果都不會變？先寫下一組。", "obs": "找到哪一組數？那個不變的數和 BC 有什麼關係？∠A ＝ 90° 時，AM 是多少？"}, "lab2": {"mode": "predict", "why": "按「畫出高」，從 A 畫到底邊的高。", "q": "電腦把 A 放到一千個位置，每次都算出同一個數。這樣算不算已經知道它對每一個三角形都成立？", "opts": ["算", "不算"], "multi": false, "obs": "把 AB²、AC²、AM² 都寫成「高² ＋ 底下那一段²」。加加減減之後，高為什麼不見了？"}}, "gates": [{"hide": "#lab2", "after": "lab1"}], "quiz": [{"q": "BC ＝ 10，∠A ＝ 90° 時，中線 AM 是多少？", "opts": ["5", "10", "√50", "要看 A 在哪裡"], "ans": 0, "why": ["", "10 是整條斜邊，AM 只到中點。", "√50 是 AB、AC 一樣長時的腰長。", "∠A ＝ 90° 時，A 在以 BC 為直徑的圓上，AM 固定。"], "exp": "AB² ＋ AC² ＝ 2AM² ＋ 2BM²，又 ∠A ＝ 90° 時 AB² ＋ AC² ＝ BC² ＝ 100，BM ＝ 5，得 AM ＝ 5，正好是斜邊的一半。"}, {"q": "平行四邊形兩鄰邊長 7、9，一條對角線長 8。另一條對角線多長？", "opts": ["14", "12", "√130", "10"], "ans": 0, "why": ["", "代進去驗算：8² ＋ 12² 不等於 2(7² ＋ 9²)。", "√130 只用了兩邊的平方和，忘了乘 2。", "代進去驗算：8² ＋ 10² 不等於 2(7² ＋ 9²)。"], "exp": "對角線互相平分，用中線的關係可得：兩條對角線的平方和 ＝ 2(7² ＋ 9²) ＝ 260。260 − 8² ＝ 196，另一條是 14。"}, {"q": "長方形 ABCD 內有一點 P，PA ＝ 3、PB ＝ 4、PC ＝ 5。PD 是多少？", "opts": ["3√2", "√34", "2√2", "6"], "ans": 0, A 拉成鈍角，哪一組的交點跑到三角形外面？哪一組最讓你意外？"}, "lab2": {"mode": "predict", "why": "按「顯示三個比」，再按「乘起來」，四組都試試。", "q": "螢幕換了一千個三角形，四組線每一次都交在一點。這樣算不算已經說明「一定交在一點」？", "opts": ["算", "不算"], "multi": false, "obs": "四組線的三個比，乘起來各是多少？為什麼只要乘起來是 1，三條線就一定交在一點？（想想：先讓兩條線交在一點，再看第三條。）"}}, "gates": [{"hide": "#lab2", "after": "lab1"}], "quiz": [{"q": "BD : DC ＝ 2 : 3，CE : EA ＝ 3 : 4。F 要放在 AB 上哪裡，AD、BE、CF 才會交在一點？", "opts": ["AF : FB ＝ 2 : 1", "AF : FB ＝ 1 : 2", "AF : FB ＝ 1 : 1", "AF : FB ＝ 3 : 4"], "ans": 0, "why": ["", "倒過來了，代進去乘乘看。", "代進去：1 × 2/3 × 3/4 不是 1。", "代進去：3/4 × 2/3 × 3/4 不是 1。"], "exp": "三個比乘起來要是 1：AF/FB × 2/3 × 3/4 ＝ 1，AF/FB ＝ 2，所以 AF : FB ＝ 2 : 1。"}, {"q": "把 ∠A 拉成鈍角，哪一組的交點跑到三角形外面？", "opts": ["三條高", "三條中線", "三條角平分線", "連到切點的三條線"], "ans": 0, "why": ["", "中線的交點一定在三角形裡面。", "角平分線的交點是內切圓的圓心，一定在裡面。", "切點都在邊上，三條線的交點在裡面。"], "exp": "鈍角三角形的三條高（延長之後）交在三角形外面；其他三組的交點都還在裡面。"}, {"q": "用今天的方法，三條中線為什麼交在一點？", "opts": ["三個比都是 1，乘起來是 1", "三條中線一樣長", "中線把三角形分成一樣大的兩塊", "三條中線互相垂直"], "ans": 0, "why": ["", "中線通常不一樣長。", "這是真的，但它說明的是面積，不是交在一點。", "中線通常不垂直。"], "exp": "中點把邊分成一樣長的兩段，三個比都是 1，乘起來是 1，所以三條中線交在一點。"}]}, {"slug": "gp-u4-2", "chap": "拾光四-2", "title": "一條線穿過去", "topic": "三點共線", "plain": "這座島上，一條直線穿過三角形；三個比一直在變，乘起來卻不變。", "stations": {"lab1": {"mode": "predict", "why": "拖兩個灰點轉一轉、移一移直線，看三個比和「三個乘起來」；再按「隨機 1000 條直線」。也可以切到「上一節：三條線交於 O」比一比。", "q": "一條直線穿過三角形，碰到三邊（或延長線）於 D、E、F。三個比一直在變，乘起來會怎樣？", "opts": ["跟著一直變", "一直是同一個數", "直線越斜越大", "直線移到三角形外面就變成 0"], "multi": false, "obs": "乘起來是多少？和上一節三條線交在一點時一樣嗎？D、E、F 之中落在邊上（不在延長線上）的有幾個？"}, "lab2": {"mode": "predict", "why": "按「從頂點作垂線」，再按「有號的比」。", "q": "螢幕上的直線轉了上千次，乘起來每一次都一樣。這樣算不算已經說明了？", "opts": ["算", "不算"], "multi": false, "obs": "從三個頂點往直線作垂線，三個比可以換成哪幾段的比？乘起來為什麼約成 1？只看乘積分不出「交在一點」和「在一條線上」，有號的比怎麼分出來？"}}, "gates": [{"hide": "#lab2", "after": "lab1"}], "quiz": [{"q": "直線穿過 AB 的中點 F、BC 上的點 D（BD : DC ＝ 2 : 1），再碰到 CA 的延長線於 E。CE : EA 是多少？E 在哪一側？", "opts": ["1 : 2，E 在 C 那一側", "2 : 1，E 在 A 那一側", "1 : 1", "1 : 2，E 在 A 那一側"], "ans": 0, "why": ["", "比倒過來了：1 × 2 × 2 不是 1。", "1 × 2 × 1 不是 1。", "CE 比 EA 短，E 應該離 C 比較近。"], "exp": "AF/FB × BD/DC × CE/EA ＝ 1：1 × 2 × CE/EA ＝ 1，CE/EA ＝ 1/2。CE 比 EA 短，E 在 C 的外側。"}, {"q": "一條直線碰三角形的三邊（或延長線），D、E、F 之中落在邊上的，可能有幾個？", "opts": ["0 個或 2 個", "1 個或 3 個", "一定是 3 個", "0、1、2、3 個都可能"], "ans": 0, "why": ["", "1 個或 3 個是上一節「三條線交在一點」的情形。", "一條直線不可能同時穿過三條邊。", "只有兩種可能，轉轉看。"], "exp": "一條直線若穿進三角形，一定從另一邊穿出去，碰到兩條邊；不然就三個點都在延長線上。所以是 0 個或 2 個。"}, {"q": "改用有號的比（點在延長線上，那個比算負的）。三條線交在一點時，乘起來是 1；三點在一條直線上時是多少？", "opts": ["−1", "1", "0", "2"], "ans": 0, "why": ["", "只看大小是 1，加上正負號就分得開了。", "不會是 0，三個比都不是 0。", "算算看，三個比的大小乘起來是 1。"], "exp": "一條直線碰三邊時，落在延長線上的點有 1 個或 3 個，負的比是奇數個，乘起來是 −1；三條線交在一點時，延長線上的點有 0 個或 2 個，乘起來是 1。正負號就是分出兩種情形的方法。"}]}, {"slug": "gp-u4-3", "chap": "拾光四-3", "title": "三組對邊，交在一條線上", "topic": "兩個三角形從一點看過去", "plain": "這座島上，兩個三角形從同一點看過去；三組對邊的交點，排在一條線上。", "stations": {"lab1": {"mode": "predict", "why": "拖橘色的 O、藍色的 A、B、C，灰色的 A′、B′、C′ 沿著射線拖；看「R 離直線 PQ」，再按「隨機 1000 組」。也試試「讓 A′B′ ∥ AB」「O 在中間」。", "q": "AA′、BB′、CC′ 交在 O。把對應的邊延長：BC 和 B′C′ 交於 P，CA 和 C′A′ 交於 Q，AB 和 A′B′ 交於 R。P、Q、R 會怎樣？", "opts": ["在一條直線上", "圍成一個和 △ABC 一樣形狀的三角形", "看情況，沒有規律", "三點重合"], "multi": false, "obs": "P、Q、R 每一次都在一條線上嗎？按「讓 A′B′ ∥ AB」之後，R 跑到哪裡？P、Q 的連線呢？"}, "lab2": {"mode": "predict", "why": "按「描出一個三角形」，看描出來的是哪一個三角形，再想上一節那一招可以用在誰身上。", "q": "這一次圖上沒有任何長度。螢幕拖了上千次，三點每次都在一條直線上。這樣算不算已經說明了？", "opts": ["算", "不算"], "multi": false, "obs": "你描出（或找到）哪幾個三角形？每一個被哪一條直線穿過？那一招用了幾次，才把 P、Q、R 接起來？"}}, "gates": [{"hide": "#lab2", "after": "lab1"}], "quiz": [{"q": "把 A′B′ 拖到和 AB 平行，R 跑到哪裡？", "opts": ["跑到很遠，兩條線平行沒有交點；這時 PQ 和 AB 平行", "R 和 P 重合", "R 跑到 O", "PQ 和 AB 垂直"], "ans": 0, "why": ["", "按「讓 A′B′ ∥ AB」看 R。", "R 不會跑到 O。", "按「讓 A′B′ ∥ AB」看 PQ 的方向。"], "exp": "AB 和 A′B′ 平行就沒有交點，R「跑到很遠」；這時 P、Q 的連線也和它們平行，三點在一條線上的說法還是對的。"}, {"q": "把 O 放在兩個三角形中間，P、Q、R 還在一條直線上嗎？", "opts": ["還在", "不在了", "只有 O 在正中間時才在", "要看兩個三角形的大小"], "ans": 0, "why": ["", "按「O 在中間」看看。", "按「O 在中間」後再拖動 O 看看。", "大小不影響，拖拖看。"], "exp": "O 在中間時仍然在一條直線上，說明的步驟一樣可以用。"}, {"q": "這一節的說明，用了上一節「一條線穿過去」那一招幾次？", "opts": ["三次", "一次", "兩次", "沒有用到"], "ans": 0, "why": <script src="firebase-config.js"></script>
<script type="module">
import { auth, db, login, logout, emailOf, TEACHER, ROLES, staffRole } from "./island-cloud.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { collection, getDocs, getDoc, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const U = window.ISLAND_UNITS;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = $("app");
let myRole = "", staffList = [];
let roster = [], uidOf = {}, tab = "sum", cls = "", unitSlug = U[0] && U[0].slug, station = "", live = {}, unsubs = [];

onAuthStateChanged(auth, async u => {
  if (!u) {
    $("who").innerHTML = "";
    app.innerHTML = '<div class="gate"><p>用老師的學校帳號登入。</p><button class="p" id="li">用 Google 登入</button></div>';
    $("li").onclick = () => login().catch(e => alertBox(e.code || e.message));
    return;
  }
  myRole = await staffRole(u);
  $("who").innerHTML = esc(u.email) + (myRole ? ' <span class="tag ok">' + ROLES[myRole] + '</span>' : "") + ' <button id="lo">登出</button>';
  $("lo").onclick = () => logout();
  if (!myRole) { app.innerHTML = '<p class="gate">這個頁面只有老師帳號能用。要開通請找管理者加入。</p>'; return; }
  await loadAll();
  draw();
});
function alertBox(m) { app.insertAdjacentHTML("afterbegin", '<div class="card" style="border-color:var(--orange)">' + esc(m) + "</div>"); }

async function loadAll() {
  const rs = await getDocs(collection(db, "roster"));
  roster = []; rs.forEach(d => roster.push({ email: d.id, ...d.data() }));
  roster.sort((a, b) => String(a.cls || "").localeCompare(String(b.cls || "")) || (+a.seat || 0) - (+b.seat || 0));
  const rec = await getDocs(collection(db, "records"));
  uidOf = {}; rec.forEach(d => { const e = (d.data().email || "").toLowerCase(); if (e) uidOf[e] = d.id; });
}

function draw() {
  const tabs = [["sum", "跨章總表"], ["rec", "單章紀錄"]];
  if (myRole !== "viewer") tabs.push(["ros", "學生名單"]);
  if (myRole === "admin") tabs.push(["staff", "老師帳號"]);
  if (!tabs.some(t => t[0] === tab)) tab = "sum";
  app.innerHTML = '<div class="tabs">' + tabs.map(t => '<button data-t="' + t[0] + '">' + t[1] + "</button>").join("") + '</div><div id="pane"></div>';
  app.querySelector(".tabs").insertAdjacentHTML("beforeend", '<a href="report-show.html" style="margin-left:auto;align-self:center;font-size:13.5px;color:var(--indigo)">章後延伸報告（報告島）</a>' +
    (myRole === "admin" ? '<a href="upload.html" style="margin-left:14px;align-self:center;font-size:13.5px;color:var(--indigo)">教材上傳</a>' : ""));
  app.querySelectorAll(".tabs button").forEach(b => { b.classList.toggle("on", b.dataset.t === tab); b.onclick = () => { tab = b.dataset.t; draw(); }; });
  if (tab === "ros") drawRoster(); else if (tab === "staff") drawStaff(); else if (tab === "sum") drawSummary(); else drawRecords();
}

/* ---------- 老師帳號（只有管理者） ---------- */
async function loadStaff() {
  staffList = [];

function bindCls(redraw) { const e = $("cs"); if (e) e.onchange = ev => { cls = ev.target.value; redraw(); }; }
const pad = n => String(n).padStart(2, "0");
function fmt(iso, full) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const md = (d.getMonth() + 1) + "/" + d.getDate(), hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (full) return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + hm;
  return (d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + "/" : "") + md + " " + hm;
}
function ago(iso) {
  if (!iso) return "";
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 1) return "剛剛"; if (m < 60) return Math.floor(m) + " 分鐘前";
  if (m < 1440) return Math.floor(m / 60) + " 小時前"; if (m < 1440 * 14) return Math.floor(m / 1440) + " 天前";
  return fmt(iso);
}
function downloadCSV(name, rows) {
  const q = v => { const t = String(v ?? ""); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const today = () => { const d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); };

function lastOf(m) { let t = ""; Object.values(m || {}).forEach(x => { if ((x.updated || "") > t) t = x.updated; }); return t; }

/* ---------- 名單 ---------- */
function parseLines(txt) {
  const out = [], bad = [];
  txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(l => {
    const f = l.split(/[,\t，]+|\s{2,}|\s(?=\S+@)/).map(x => x.trim()).filter(Boolean);
    const email = (f.find(x => x.includes("@")) || "").toLowerCase();
    const rest = f.filter(x => !x.includes("@"));
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || rest.length < 1) { bad.push(l); return; }
    let cls = "", seat = "", name = "";
    if (rest.length >= 3) [cls, seat, name] = rest; else if (rest.length === 2) [seat, name] = rest; else name = rest[0];
    out.push({ email, cls, seat: seat === "" ? "" : (isNaN(+seat) ? seat : +seat), name });
  });
  return { out, bad };
}

function predText(c, s) {
  const parts = [];
  if (c.opts && s.opts && s.opts.length) parts.push(s.opts.map(i => c.opts[i]).join("、"));
  else if (c.opts && c.multi && s.locked) parts.push("一個都沒選");

      const cnt = q.opts.map(() => 0); let n = 0;
      people.forEach(({ S }) => { const t = S && S.quiz && S.quiz[i] && S.quiz[i].tried; if (t && t.length) { cnt[t[0]]++; n++; } });
      h += '<div class="card"><b>第 ' + (i + 1) + " 題　</b>" + esc(q.q) + '<p class="muted">第一次選了什麼（' + n + " 人作答）</p>" + bars(q.opts.map((o, j) => [o + (j === q.ans ? "　✓" : ""), cnt[j]]), n) + "</div>";
    });
    b.innerHTML = h; return;
  }
  const c = C.stations[station];
  let h = '<div class="card"><b>' + esc(c.mode === "predict" ? c.q : "（這站直接操作，沒有預測）") + "</b>";
  if (c.opts) {
    const cnt = c.opts.map(() => 0); let n = 0;
    people.forEach(({ S }) => { const s = S && S.st && S.st[station]; if (s && s.locked) { n++; (s.opts || []).forEach(j => cnt[j]++); } });
    h += '<p class="muted">預測選項（' + n + " 人送出" + (c.multi ? "，可複選" : "") + "）</p>" + bars(c.opts.map((o, j) => [o, cnt[j]]), n);
  }
  h += '<p class="muted" style="margin-top:12px">觀察題：' + esc(c.obs) + "</p></div>";
  h += '<div class="card scroll"><table><thead><tr><th>班級</th><th>座號</th><th>姓名</th><th>預測</th><th>看到的</th><th>最後存檔</th></tr></thead><tbody>';
  people.forEach(({ r, S, in: inn }) => {
    const s = S && S.st && S.st[station];
    const pr = c.mode !== "predict" ? '<span class="empty">—</span>' : s && s.locked ? '<span class="pred">' + esc(predText(c, s)) + "</span>" : '<span class="empty">' + (inn ? "還沒寫" : "還沒登入過") + "</span>";
    const ob = s && s.done ? '<span class="obs">' + esc(s.obs) + "</span>" : '<span class="empty">還沒寫</span>';
    h += "<tr><td>" + esc(r.cls) + "</td><td>" + esc(r.seat) + "</td><td>" + esc(r.name) + "</td><td>" + pr + "</td><td>" + ob + '</td><td class="time" title="' + esc(fmt(S && S.updated, 1)) + '">' + esc(ago(S && S.updated)) + "</td></tr>";
  });
  b.innerHTML = h + "</tbody></table></div>";
}
function exportUnit() {
  const C = cfg(), ids = Object.keys(C.stations), i0 = U.indexOf(C);
  const head = ["班級", "座號", "姓名", "帳號", "完成站數", "判斷題答對", "一次就對", "蓋章時間", "最後存檔"];
  ids.forEach((id, i) => { const c = C.stations[id]; if (c.mode === "predict") head.push("第" + (i + 1) + "站 預測"); head.push("第" + (i + 1) + "站 看到的"); });
  C.quiz.forEach((q, i) => head.push("判斷題" + (i + 1) + " 第一次選"));
  const rows = [head];
  shown().forEach(r => {
    const S = live[r.email];
    if (!uidOf[r.email] || !S) { rows.push([r.cls, r.seat, r.name, r.email, uidOf[r.email] ? "還沒開始" : "還沒登入過"]); return; }
    const st = S.st || {}, qz = S.quiz || {};
    const row = [r.cls, r.seat, r.name, r.email,
      ids.filter(id => st[id] && st[id].done).length + "／" + ids.length,
      C.quiz.filter((_, i) => qz[i] && qz[i].ok).length + "／" + C.quiz.length,
      C.quiz.filter((q, i) => qz[i] && qz[i].tried && qz[i].tried[0] === q.ans).length,
      fmt(S.stampAt, 1), fmt(S.updated, 1)];
    ids.forEach(id => { const c = C.stations[id], s = st[id];
      if (c.mode === "predict") row.push(s && s.locked ? predText(c, s) : "");
      row.push(s && s.done ? (s.obs || "") : ""); });
    C.quiz.forEach((q, i) => { const t = qz[i] && qz[i].tried; row.push(t && t.length ? q.opts[t[0]] + (t[0] === q.ans ? "（對）" : "") : ""); });
    rows.push(row);
  });
  downloadCSV("探索島_" + UL[i0] + "_" + C.title + (cls ? "_" + cls : "") + "_" + today() + ".csv", rows);
  $("rmsg").textContent = "✓ 已下載 " + (rows.length - 1) + " 人";
}
function bars(rows, n) {
  const m = Math.max(1, ...rows.map(r => r[1]));
  return '<div class="bars">' + rows.map(([t, v]) => "<span>" + esc(t) + '</span><span><i style="width:' + (v / m * 100) + '%"></i></span><span>' + v + "</span>").join("") + "</div>";
}
</script>
