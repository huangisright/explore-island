<script>
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), strip = $("strip");
  const H = 78, SIDE = 2 * H / Math.sqrt(3);
  const COLORS = ["--s1", "--s2", "--s3", "--s4", "--s5"];

  function regular(n, apothem, startDeg){
    const R = apothem / Math.cos(Math.PI / n), v = [];
    for (let k = 0; k < n; k++){ const a = (startDeg + 360 * k / n) * Math.PI / 180; v.push([R * Math.cos(a), R * Math.sin(a)]); }
    return v;
  }
  // 頂點一律逆時針，內側在每條邊的左邊
  const SHAPES = {
    tri:  { v: [[0,0],[SIDE,0],[SIDE/2,H]], names: ["B","C","A"], sides: ["到 BC","到 CA","到 AB"],
            start: bary(20,25,33) },
    sq:   { v: [[0,0],[60,0],[60,60],[0,60]], names: [], sides: ["到下邊","到右邊","到上邊","到左邊"] },
    rect: { v: [[0,0],[84,0],[84,48],[0,48]], names: [], sides: ["到下邊","到右邊","到上邊","到左邊"] },
    pent: { v: regular(5, 38, 234), names: [], sides: ["到邊 1","到邊 2","到邊 3","到邊 4","到邊 5"] },
    scal: { v: [[0,0],[100,0],[26,62]], names: ["B","C","A"], sides: ["到 BC","到 CA","到 AB"] },
  };
  function bary(a, b, c){ // 到 BC、CA、AB 的距離 → 正三角形中的位置
    const A = [SIDE/2, H], B = [0,0], C = [SIDE,0];
    return [(a*A[0] + b*B[0] + c*C[0]) / H, (a*A[1] + b*B[1] + c*C[1]) / H];
  }

  let shapeKey = "tri", P = SHAPES.tri.start.slice(), signed = false, cut = false, running = false;
  let view = null;

  function sdist(p, a, b){ // 有向距離：在邊的內側為正
    const ex = b[0]-a[0], ey = b[1]-a[1], L = Math.hypot(ex, ey);
    return (ex*(p[1]-a[1]) - ey*(p[0]-a[0])) / L;
  }
  function footOf(p, a, b){
    const ex = b[0]-a[0], ey = b[1]-a[1], t = ((p[0]-a[0])*ex + (p[1]-a[1])*ey) / (ex*ex + ey*ey);
    return [a[0] + t*ex, a[1] + t*ey];
  }
  function dists(p){
    const v = SHAPES[shapeKey].v;
    return v.map((a, i) => { const d = sdist(p, a, v[(i+1) % v.length]); return signed ? d : Math.abs(d); });
  }
  function inside(p){ const v = SHAPES[shapeKey].v; return v.every((a, i) => sdist(p, a, v[(i+1) % v.length]) > 0); }
  function centroid(v){ let x = 0, y = 0; v.forEach(q => { x += q[0]; y += q[1]; }); return [x / v.length, y / v.length]; }

  function computeView(){
    const v = SHAPES[shapeKey].v;
    const xs = v.map(q => q[0]), ys = v.map(q => q[1]);
    const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
    const w = maxx - minx, h = maxy - miny;
    const k = Math.min(300 / w, 280 / h);
    const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
    view = { k, tx: 220 - cx * k, ty: 200 + cy * k };
  }
  const X = (p) => [view.tx + p[0] * view.k, view.ty - p[1] * view.k];
  const M = (sx, sy) => [(sx - view.tx) / view.k, (view.ty - sy) / view.k];

  function el(tag, attrs, parent){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const colorVar = (i) => `var(${COLORS[i % COLORS.length]})`;

  function extendLine(a, b){ // 邊所在直線延長到畫面外
    const ex = b[0]-a[0], ey = b[1]-a[1], L = Math.hypot(ex, ey), ux = ex / L, uy = ey / L, big = 400 / view.k;
    return [[a[0] - ux*big, a[1] - uy*big], [b[0] + ux*big, b[1] + uy*big]];
  }

  function draw(){
    const S = SHAPES[shapeKey], v = S.v, n = v.length;
    stage.innerHTML = "";
    const out = !inside(P);
    if (out) v.forEach((a, i) => { const [p, q] = extendLine(a, v[(i+1) % n]); const A = X(p), B = X(q);
      el("line", { x1: A[0], y1: A[1], x2: B[0], y2: B[1], class: "ext" }, stage); });
    el("polygon", { points: v.map(q => X(q).join(",")).join(" "), class: "shape" }, stage);
    if (cut) v.forEach((a, i) => {
      const b = v[(i+1) % n];
      el("polygon", { points: [P, a, b].map(q => X(q).join(",")).join(" "), fill: colorVar(i), "fill-opacity": .16,
        stroke: colorVar(i), "stroke-width": 1.4, "stroke-opacity": .8 }, stage);
    });
    v.forEach((a, i) => {
      const b = v[(i+1) % n], f = footOf(P, a, b), A = X(P), F = X(f);
      el("line", { x1: A[0], y1: A[1], x2: F[0], y2: F[1], class: "foot", stroke: colorVar(i) }, stage);
    });
    const c = centroid(v);
    S.names.forEach((name, i) => {
      const q = v[i], dx = q[0] - c[0], dy = q[1] - c[1], L = Math.hypot(dx, dy);
      const T = X([q[0] + dx / L * 12 / view.k * 1.6, q[1] + dy / L * 12 / view.k * 1.6]);
      const t = el("text", { x: T[0], y: T[1] + 7, "text-anchor": "middle", class: "vlab" }, stage); t.textContent = name;
    });
    const Pp = X(P);
    el("circle", { cx: Pp[0], cy: Pp[1], r: 8, class: "pdot" }, stage);
    const t = el("text", { x: Pp[0] + 12, y: Pp[1] - 12, class: "plab" }, stage); t.textContent = "P";
    readout();
  }

  function fmt(x){ return (Math.round(x * 10) / 10).toFixed(1).replace("-", "−"); }

  function buildRows(){
    const S = SHAPES[shapeKey];
    $("rows").innerHTML = S.sides.map((name, i) =>
      `<div class="row"><span class="sw" style="background:${colorVar(i)}"></span><span>${name}</span><span class="val" id="d${i}">0.0</span></div>`).join("");
  }

  function scaleMax(){
    const v = SHAPES[shapeKey].v, keep = signed;
    signed = false; const m = Math.max(...v.map(q => dists(q).reduce((a, b) => a + b, 0))); signed = keep;
    return Math.ceil(m * 1.3 / 20) * 20;
  }

  function readout(){
    const d = dists(P), s = d.reduce((a, b) => a + b, 0);
    d.forEach((x, i) => { const e = $("d" + i); if (e){ e.textContent = fmt(x); e.classList.toggle("neg", x < -0.05); } });
    $("sum").textContent = fmt(s);
    drawStrip(d);
  }

  function drawStrip(d){
    strip.innerHTML = "";
    const max = scaleMax(), L = 12, R = 388, k = (R - L) / max, y = 12, h = 20;
    el("rect", { x: L, y: y, width: R - L, height: h, fill: "none", stroke: "var(--edge)", "stroke-width": 1 }, strip);
    let x = L;
    d.forEach((val, i) => {
      if (val >= 0){
        const w = Math.min(val * k, R - x);
        if (w > 0) el("rect", { x: x, y: y, width: w, height: h, fill: colorVar(i) }, strip);
        x += val * k;
      }
    });
    d.forEach((val, i) => { // 負的那一段從尾端往回扣
      if (val < 0){
        const w = -val * k, x0 = Math.max(L, x - w);
        el("rect", { x: x0, y: y + 3, width: x - x0, height: h - 6, fill: "var(--paper)", stroke: "var(--crimson)", "stroke-width": 1.5, "stroke-dasharray": "4 3" }, strip);
        x -= w;
      }
    });
    const end = Math.max(L, Math.min(R, x));
    el("line", { x1: end, y1: y - 6, x2: end, y2: y + h + 6, stroke: "var(--orange)", "stroke-width": 2.5 }, strip);
    const step = max <= 120 ? 20 : 40;
    for (let t = 0; t <= max; t += step){
      const tx = L + t * k;
      el("line", { x1: tx, y1: y + h, x2: tx, y2: y + h + 4, stroke: "var(--ink-3)", "stroke-width": 1 }, strip);
      const tt = el("text", { x: tx, y: y + h + 17, "text-anchor": "middle", class: "tick" }, strip); tt.textContent = t;
    }
  }

  function clearStat(){ const s = $("stat"); s.textContent = ""; s.className = "stat"; }

  // ---- 拖動 ----
  function toModel(ev){
    const r = stage.getBoundingClientRect();
    const sx = (ev.clientX - r.left) / r.width * 440, sy = (ev.clientY - r.top) / r.height * 400;
    return M(Math.max(4, Math.min(436, sx)), Math.max(4, Math.min(396, sy)));
  }
  let dragging = false;
  stage.addEventListener("pointerdown", (ev) => { if (running) return; dragging = true; stage.setPointerCapture(ev.pointerId); P = toModel(ev); clearStat(); draw(); });
  stage.addEventListener("pointermove", (ev) => { if (!dragging) return; P = toModel(ev); draw(); });
  const stop = () => { dragging = false; };
  stage.addEventListener("pointerup", stop); stage.addEventListener("pointercancel", stop);
  stage.addEventListener("keydown", (ev) => {
    const step = (ev.shiftKey ? 5 : 1);
    const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] }[ev.key];
    if (!mv || running) return;
    ev.preventDefault(); P = [P[0] + mv[0], P[1] + mv[1]]; clearStat(); draw();
  });

  // ---- 隨機跑 ----
  function randInside(){
    const v = SHAPES[shapeKey].v, xs = v.map(q => q[0]), ys = v.map(q => q[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    for (let t = 0; t < 500; t++){ const p = [x0 + Math.random() * (x1 - x0), y0 + Math.random() * (y1 - y0)]; if (inside(p)) return p; }
    return centroid(v);
  }
  $("run").addEventListener("click", () => {
    if (running) return;
    running = true; $("run").disabled = true;
    const N = 1000; let done = 0, lo = Infinity, hi = -Infinity;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const per = reduce ? N : 12;
    const s = $("stat"); s.className = "stat";
    function tick(){
      for (let i = 0; i < per && done < N; i++, done++){
        P = randInside(); const sum = dists(P).reduce((a, b) => a + b, 0);
        lo = Math.min(lo, sum); hi = Math.max(hi, sum);
      }
      draw();
      s.innerHTML = `檢查了 <b>${done}</b> 個點：加起來最小 <b>${fmt(lo)}</b>，最大 <b>${fmt(hi)}</b>`;
      if (done < N) requestAnimationFrame(tick);
      else {
        running = false; $("run").disabled = false;
        if (hi - lo < 0.05){ s.classList.add("same"); s.innerHTML = `檢查了 <b>${N}</b> 個點，加起來每一次都是 <b>${fmt(lo)}</b>`; }
      }
    }
    requestAnimationFrame(tick);
  });

  $("home").addEventListener("click", () => {
    if (running) return;
    const S = SHAPES[shapeKey]; P = (S.start || centroid(S.v)).slice(); clearStat(); draw();
  });
  $("signed").addEventListener("change", (e) => { signed = e.target.checked; clearStat(); draw(); });
  $("cut").addEventListener("click", (e) => { cut = !cut; e.currentTarget.setAttribute("aria-pressed", String(cut));
    e.currentTarget.textContent = cut ? "拿掉連線" : "把 P 連到每個頂點"; draw(); });
  $("shapes").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-shape]"); if (!b || running) return;
    shapeKey = b.dataset.shape;
    document.querySelectorAll("#shapes button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    const S = SHAPES[shapeKey]; P = (S.start || centroid(S.v)).slice();
    computeView(); buildRows(); clearStat(); draw();
  });

  computeView(); buildRows(); draw();
})();
</script>

  padding:18px 22px;margin:16px 0}

<script>window.ISLAND={"slug": "gp-u1-1", "chap": "拾光一-1", "title": "一個不會變的數", "topic": "點到三邊的距離", "plain": "這座島上，有一個點在三角形裡亂跑；它到三條邊的距離一直在變，加起來卻不變。", "stations": {"lab1": {"mode": "predict", "why": "拖動點 P，或點一下把它移過去，看右邊三段距離和「加起來」。再按「隨機跑 1000 個點」。", "q": "點 P 在正三角形裡到處跑，三段距離加起來會怎樣？", "opts": ["P 越靠近中心，加起來越大", "P 越靠近中心，加起來越小", "一直在變，沒有規律", "不管 P 在哪裡都一樣"], "multi": false, "obs": "加起來是多少？把 P 推到頂點 A 上，三段各是多少？這和「加起來」有什麼關係？"}, "lab2": {"mode": "predict", "why": "按「把 P 連到每個頂點」，三角形被切成三塊。", "q": "電腦跑了一千個點，加起來都一樣。這樣算不算已經說明了「點放哪裡都一樣」？", "opts": ["算", "不算"], "multi": false, "obs": "切成三塊之後，每一塊的大小和 P 到那條邊的距離有什麼關係？用它說明為什麼加起來不會變。"}}, "gates": [{"hide": "#lab2", "after": "lab1"}], "quiz": [{"q": "把 P 推到頂點 A 上，三段距離各是多少？", "opts": ["到 BC 的那一段是三角形的高，另外兩段是 0", "三段都是 0", "三段一樣長", "到 BC 是 0，另外兩段各是高的一半"], "ans": 0, "why": ["", "P 在 A 上，到 AB、AC 確實是 0，但 A 不在 BC 上，到 BC 還有一段。回第 1 站把 P 拖到 A 看看。", "三段一樣長的點在正中間，不在頂點上。", "A 本身就在 AB、AC 兩條邊上，到這兩條邊的距離是 0。"], "exp": "P 在 A 上時，到 AB、AC 都是 0，只剩到 BC 的那一段，正好是三角形的高。所以「加起來」就等於高。"}, {"q": "換一個大一點的正三角形，P 在裡面亂跑。下面哪一句對？", "opts": ["大三角形的「加起來」也是 78", "在大三角形裡也不會變，只是那個數比較大", "大三角形裡會變，小三角形裡才不會變", "要看 P 在哪裡"], "ans": 1, "why": ["", "78 是這個三角形的高。三角形放大，高也跟著變大。", "「不會變」的理由和三角形大小無關，大三角形照樣成立。", "同一個三角形裡，P 放哪裡都一樣，這正是第 1 站看到的。"], "exp": "加起來等於三角形的高。同一個三角形裡它不會變；三角形越大，高越大，這個數也越大。"}, {"q": "為什麼「把 P 連到三個頂點」說得出加起來不會變？", "opts": ["三塊加起來就是整個三角形；每一塊的大小是「邊長 × P 到那條邊的距離 ÷ 2」，而三條邊一樣長", "三塊一定一樣大", "三條連線一樣長", "連線之後，三段距離就變成一樣長"], "ans": 0, "why": ["", "P 不在正中間時，三塊大小不一樣。回第 2 站把 P 拖到角落再看一次。", "P 到三個頂點的距離通常不一樣長。", "三段距離還是各自在變，變的是三塊的大小。"], "exp": "三塊的大小加起來永遠是整個三角形。每一塊的大小 ＝ 邊長 × 距離 ÷ 2，三個邊長一樣，所以三段距離加起來 ＝ 整個三角形的大小 × 2 ÷ 邊長，是一個固定的數。"}]};</script>
<script>
/* ===== 探索島：預測／紀錄／判斷題／單元章 =====
   沒登入：紀錄只存在這台裝置的瀏覽器（localStorage）。
   登入且在名單上：island-cloud.js 透過 window.ISLAND_API 接手，另存一份到雲端。 */
(function () {
  const C = window.ISLAND;
  let KEY = "isl:" + C.slug;
  let NAMEKEY = "isl:name";
  let nameLocked = false;
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } },
  };
  let S;
  try { S = JSON.parse(store.get(KEY)) || {}; } catch (e) { S = {}; }
  S.st = S.st || {}; S.quiz = S.quiz || {};
  const save = () => {
    S.updated = new Date().toISOString();
    S.n = ids.length; S.nd = ids.filter(id => S.st[id] && S.st[id].done).length;
    S.q = C.quiz.length; S.qd = C.quiz.filter((_, i) => S.quiz[i] && S.quiz[i].ok).length;
    store.set(KEY, JSON.stringify(S));
    if (API.onSave) API.onSave(S);
  };
  const API = window.ISLAND_API = window.ISLAND_API || {};

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const ids = Object.keys(C.stations);
  const MIN_OBS = 1;   // 寫一個字（例如一個數字）就算

  const st = id => (S.st[id] = S.st[id] || { opts: [], pred: "", locked: false, obs: "", done: false });
  const predText = (cfg, s) => {
    const parts = [];
    if (cfg.opts && s.opts.length) parts.push(s.opts.map(i => cfg.opts[i]).join("、"));
    else if (cfg.opts && cfg.multi) parts.push("一個都沒選");
    if (s.pred.trim()) parts.push(s.pred.trim());
    return parts.join("；");
  };
  const stationDone = id => !!st(id).done;
  const quizDone = i => !!(S.quiz[i] && S.quiz[i].ok);
  const allStations = () => ids.every(stationDone);
  const allQuiz = () => C.quiz.every((_, i) => quizDone(i));

  /* ---------- 每一站 ---------- */
  ids.forEach(id => {
    const cfg = C.stations[id];
    const lab = document.getElementById(id);
    if (!lab) return;
    let s = st(id);
    const head = lab.querySelector(".lab-head");
    const body = lab.querySelector(".lab-body");
    const foot = lab.querySelector(".lab-foot");
    const no = lab.querySelector(".lab-no").textContent.trim();
    if (cfg.why) lab.querySelector(".lab-why").innerHTML = esc(cfg.why);
    const tag = el("span", "isl-done-tag", "");
    head.appendChild(tag);

    /* 預測 */
    let pbox = null, wait = null;
    if (cfg.mode === "predict") {
      pbox = el("div", "isl-box");
      head.after(pbox);
      wait = el("div", "isl-wait", "先寫下你的預測，這一站才會打開。");
      body.before(wait);
    }
    const renderPred = () => {
      if (!pbox) return;
      if (s.locked) {
        pbox.innerHTML = '<div class="isl-k">我的預測</div><p class="isl-mine">' + esc(cfg.q) + "<br><b>" + esc(predText(cfg, s)) + "</b></p>";
        return;
      }
      const type = cfg.multi ? "checkbox" : "radio";
      let h = '<div class="isl-k">先預測，再動手</div><p class="isl-q">' + esc(cfg.q) + "</p>";
      if (cfg.opts) {
        h += '<div class="isl-opts">' + cfg.opts.map((o, i) =>
          '<label><input type="' + type + '" name="o-' + id + '" value="' + i + '"' + (s.opts.includes(i) ? " checked" : "") + "> " + esc(o) + "</label>").join("") + "</div>";
      }
      h += '<textarea class="isl-ta" placeholder="' + (cfg.opts ? "為什麼這樣猜？（寫一句就好）" : "寫下你的答案和理由") + '">' + esc(s.pred) + "</textarea>";
      const rule = !cfg.opts ? "寫下你的答案就能送出，一個數字也可以。"
        : cfg.multi ? "勾選你覺得對的（可以都不勾），再寫一句為什麼，就能送出。"
        : "選一個答案，再寫一句為什麼，就能送出。";
      h += '<p class="isl-rule">' + rule + '</p>';
      h += '<div class="isl-row"><button class="isl-btn primary">預測寫好了，開始操作</button><span class="isl-hint"></span></div>';
      pbox.innerHTML = h;
      const ta = pbox.querySelector("textarea"), btn = pbox.querySelector("button"), hint = pbox.querySelector(".isl-hint");
      const ok = () => {
        s.opts = [...pbox.querySelectorAll("input:checked")].map(x => +x.value);
        s.pred = ta.value;
        const needOpt = cfg.opts && !cfg.multi && s.opts.length === 0;
        const needText = s.pred.trim().length === 0;
        btn.disabled = needOpt || needText;
        hint.classList.toggle("warn", btn.disabled);
        hint.textContent = needOpt && needText ? "還差：選一個答案、寫一句為什麼。"
          : needOpt ? "還差：選一個答案。"
          : needText ? (cfg.opts ? "還差：寫一句為什麼。" : "還差：寫下你的答案。")
          : "送出後就不能改。猜錯沒關係，等一下對照才有東西看。";
      };
      pbox.addEventListener("input", () => { ok(); save(); });
      pbox.addEventListener("change", () => { ok(); save(); });
      ok();
      btn.addEventListener("click", () => {
        ok();
        if (btn.disabled) return;
        s.locked = true; s.lockedAt = new Date().toISOString(); s.pt = predText(cfg, s); save();
        renderAll(); body.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    };

    /* 觀察紀錄 */
    const obox = el("div", "isl-box isl-obs");
    body.after(obox);
    const renderObs = () => {
      let h = '<div class="isl-k">我看到的</div><p class="isl-q">' + esc(cfg.obs) + "</p>";
      h += '<textarea class="isl-ta" placeholder="把你看到的寫下來">' + esc(s.obs) + "</textarea>";
      h += '<div class="isl-row"><button class="isl-btn' + (s.done ? "" : " primary") + '">' + (s.done ? "更新紀錄" : "記下來，看對照") + '</button><span class="isl-hint">' + (s.done ? "" : "寫下你看到的（一句話就好），就能記錄。") + '</span></div>';
      obox.innerHTML = h;
      const ta = obox.querySelector("textarea"), btn = obox.querySelector("button"), hint = obox.querySelector(".isl-hint");
      const chk = () => { btn.disabled = ta.value.trim().length < MIN_OBS; };
      ta.addEventListener("input", () => {
        s.obs = ta.value; save(); chk();
        hint.textContent = s.done ? "已自動儲存" : btn.disabled ? "寫下你看到的（一句話就好），就能記錄。" : "";
      });
      chk();
      btn.addEventListener("click", () => {
        s.obs = ta.value; if (s.obs.trim().length < MIN_OBS) return;
        const first = !s.done;
        s.done = true; s.doneAt = s.doneAt || new Date().toISOString(); save();
        renderAll();
        if (first && foot) foot.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    };

    lab._islRender = () => {
      s = st(id);
      if (s.locked && s.pt == null) s.pt = predText(cfg, s);   // 紀錄本要顯示預測的文字（那一頁沒有選項內容）
      const open = cfg.mode !== "predict" || s.locked;
      renderPred();
      if (wait) wait.hidden = open;
      body.hidden = !open;
      obox.hidden = !open;
      if (open) renderObs();
      if (foot) { foot.hidden = !s.done; foot.classList.add("isl-reveal"); }
      tag.textContent = s.done ? "✓ 已記錄" : "";
    };
  });

  /* ---------- 會先講出答案的段落 ---------- */
  const gates = (C.gates || []).map(g => {
    const label = g.after === "ALL" ? "全部 " + ids.length + " 站都記錄完，這一段才會打開。" :
      "第 " + document.querySelector("#" + g.after + " .lab-no").textContent.trim() + " 站記錄完，這一段才會打開。";
    const note = el("div", "isl-gate", label);
    if (g.hide) {                       // 直接藏起指定的元素（段落裡同時有探索站時用）
      const kids = [...document.querySelectorAll(g.hide)];
      if (!kids.length) return null;
      kids[0].before(note);
      return { g, kids, note };
    }
    const sec = document.querySelector(g.sel);
    if (!sec) return null;
    const kids = [...sec.children].filter(k => !k.classList.contains("pillar-tag"));
    sec.appendChild(note);
    return { g, kids, note };
  }).filter(Boolean);

  /* ---------- 進度列 ---------- */
  const prog = el("div", "isl-prog");
  document.querySelector("header").after(prog);

  /* ---------- 判斷題 ---------- */
  const quiz = el("section", "", "");
  quiz.id = "isl-quiz";
  const endSec = document.getElementById("end");
  (endSec || document.querySelector(".wrap").lastElementChild).before(quiz);
  const renderQuiz = () => {
    let h = '<div class="pillar-tag" style="color:var(--orange)"><span class="dot" style="background:var(--orange)"></span>過關前的 ' + C.quiz.length + ' 題</div>' +
      "<h2>選一個，答錯可以再選</h2>";
    quiz.innerHTML = h;
    C.quiz.forEach((q, i) => {
      const r = S.quiz[i] = S.quiz[i] || { tried: [], ok: false };
      const card = el("div", "isl-qcard");
      card.innerHTML = '<div class="isl-qn">第 ' + (i + 1) + " 題</div><p class=\"isl-qt\">" + esc(q.q) + "</p>";
      q.opts.forEach((o, j) => {
        const b = el("button", "isl-choice", esc(o));
        if (r.tried.includes(j)) b.classList.add(j === q.ans ? "yes" : "no");
        if (r.ok || r.tried.includes(j)) b.disabled = true;
        b.addEventListener("click", () => {
          r.tried.push(j);
          if (j === q.ans) { r.ok = true; r.okAt = new Date().toISOString(); }
          save(); renderAll();
        });
        card.appendChild(b);
      });
      const last = r.tried[r.tried.length - 1];
      if (r.ok) card.appendChild(el("div", "isl-fb good", "<b>對。</b>" + esc(q.exp)));
      else if (last != null) card.appendChild(el("div", "isl-fb bad", "<b>再想想。</b>" + esc(q.why[last])));
      quiz.appendChild(card);
    });
  };

  /* ---------- 紀錄與章 ---------- */
  const rec = el("section", "", "");
  rec.id = "isl-record";
  document.querySelector(".wrap").appendChild(rec);
  const stamp = (on, date) => {
    const d = date ? date.slice(0, 10).replace(/-/g, ".") : "";
    return '<svg class="isl-stamp' + (on ? "" : " off") + '" viewBox="0 0 150 150" role="img" aria-label="單元章">' +
      '<g transform="rotate(-8 75 75)" style="fill:none;stroke:var(--crimson)">' +
      '<circle cx="75" cy="75" r="66" stroke-width="4"/><circle cx="75" cy="75" r="57" stroke-width="1.5"/>' +
      '<text x="75" y="52" text-anchor="middle" style="fill:var(--crimson);stroke:none;font:700 13px var(--sans);letter-spacing:2px">' + esc(C.chap) + "　探索完成</text>" +
      '<text x="75" y="84" text-anchor="middle" style="fill:var(--crimson);stroke:none;font:700 21px var(--serif)">' + esc(C.title) + "</text>" +
      '<line x1="34" y1="96" x2="116" y2="96" stroke-width="1.2"/>' +
      '<text x="75" y="114" text-anchor="middle" style="fill:var(--crimson);stroke:none;font:600 12px var(--sans)">' + (d || "　") + "</text></g></svg>";
  };
  let clearArmed = false;
  const renderRecord = () => {
    const done = allStations() && allQuiz();
    const firstOK = C.quiz.filter((q, i) => S.quiz[i] && S.quiz[i].tried[0] === q.ans).length;
    let h = '<div class="pillar-tag" style="color:var(--green)"><span class="dot" style="background:var(--green)"></span>我的探索紀錄</div>';
    h += '<div class="isl-sheet"><div class="isl-sheet-head"><div><h3>' + esc(C.chap) + "　" + esc(C.title) + '</h3><div class="isl-sub">' + esc(C.topic) + '</div></div>' +
      '<label class="isl-name">姓名 <input type="text" maxlength="20" value="' + esc(store.get(NAMEKEY) || "") + '"' + (nameLocked ? " readonly" : "") + '></label></div>';
    h += '<table class="isl-tbl"><thead><tr><th>站</th><th>我的預測</th><th>我看到的</th></tr></thead><tbody>';
    ids.forEach(id => {
      const cfg = C.stations[id], s = st(id);
      const lab = document.getElementById(id);
      const name = lab ? lab.querySelector(".lab-no").textContent.trim() + "　" + lab.querySelector(".lab-title").textContent.trim() : id;
      const p = cfg.mode === "predict" ? (s.locked ? esc(predText(cfg, s)) : '<span class="empty">還沒寫</span>') : '<span class="empty">（這站直接操作）</span>';
      const o = s.done ? esc(s.obs.trim()) : '<span class="empty">還沒寫</span>';
      h += '<tr><td class="n">' + esc(name) + '</td><td data-h="預測">' + p + '</td><td data-h="看到">' + o + "</td></tr>";
    });
    h += "</tbody></table>";
    h += '<div class="isl-stamp-wrap">' + stamp(done, S.stampAt) + "<div>" +
      (done ? "<b>這一章探索完成。</b><br>判斷題第一次就答對 " + firstOK + " ／ " + C.quiz.length + " 題。"
            : "全部 " + ids.length + " 站都記錄完、" + C.quiz.length + " 題判斷題都答對，就會蓋上這個章。<br>目前：" +
              ids.filter(stationDone).length + " ／ " + ids.length + " 站，" +
              C.quiz.filter((_, i) => quizDone(i)).length + " ／ " + C.quiz.length + " 題。") +
      "</div></div></div>";
    h += '<div class="isl-tools"><button class="isl-btn primary" data-a="print">列印這份紀錄</button>' +
      '<a class="isl-btn ghost" style="text-decoration:none" href="passport.html">看我的探索紀錄本</a>' +
      '<button class="isl-clear" data-a="clear">' + (clearArmed ? "確定要清掉？再按一次" : "清除這一章的紀錄") + "</button></div>";
    h += '<p class="isl-hint" style="margin-top:10px">' + (window.ISLAND_GATE ? "" : "沒登入時，紀錄只存在這台電腦的瀏覽器裡；") + '登入名單上的帳號，紀錄會存到雲端。在共用電腦上用完記得登出。</p>';
    rec.innerHTML = h;
    rec.querySelector(".isl-name input").addEventListener("input", e => store.set(NAMEKEY, e.target.value));
    rec.querySelector('[data-a="print"]').addEventListener("click", () => {
      document.body.classList.add("isl-print"); window.print();
      setTimeout(() => document.body.classList.remove("isl-print"), 500);
    });
    rec.querySelector('[data-a="clear"]').addEventListener("click", () => {
      if (!clearArmed) { clearArmed = true; renderRecord(); setTimeout(() => { clearArmed = false; renderRecord(); }, 4000); return; }
      if (API.onClear) { API.onClear(); return; }
      store.del(KEY); location.reload();
    });
  };

  function renderAll() {
    if (allStations() && allQuiz() && !S.stampAt) { S.stampAt = new Date().toISOString(); save(); }
    ids.forEach(id => { const lab = document.getElementById(id); lab && lab._islRender && lab._islRender(); });
    gates.forEach(({ g, kids, note }) => {
      const open = g.after === "ALL" ? allStations() : stationDone(g.after);
      kids.forEach(k => { if (k !== note) k.hidden = !open; });
      note.hidden = open;
    });
    const nq = C.quiz.filter((_, i) => quizDone(i)).length;
    prog.innerHTML = '<span class="t">探索紀錄</span><span class="isl-dots">' + ids.map(id => {
      const s = st(id), cfg = C.stations[id];
      const n = document.querySelector("#" + id + " .lab-no").textContent.trim();
      const cls = s.done ? "ok" : (cfg.mode === "predict" && s.locked) ? "half" : "";
      return '<a class="' + cls + '" href="#' + id + '" title="第 ' + n + ' 站">' + n + "</a>";
    }).join("") + '</span><a class="q' + (nq === C.quiz.length ? " ok" : "") + '" href="#isl-quiz" style="text-decoration:none">判斷題 ' + nq + " ／ " + C.quiz.length + "</a>" +
      '<a class="q' + (S.stampAt ? " ok" : "") + '" href="#isl-record" style="text-decoration:none">' + (S.stampAt ? "✓ 已蓋章" : "我的紀錄 →") + "</a>";
    renderQuiz();
    renderRecord();
  }
  /* 給雲端模組用：換一個人的紀錄、換姓名、整頁重畫 */
  API.config = C;
  API.store = store;
  API.state = () => S;
  API.adopt = (newKey, newS, opts) => {
    KEY = newKey;
    S = newS || {};
    S.st = S.st || {}; S.quiz = S.quiz || {};
    if (opts && opts.nameKey) NAMEKEY = opts.nameKey;
    if (opts && "name" in opts) { store.set(NAMEKEY, opts.name || ""); }
    nameLocked = !!(opts && opts.nameLocked);
    clearArmed = false;
    store.set(KEY, JSON.stringify(S));
    renderAll();
  };
  API.progressBox = prog;
  API.recordBox = rec;
  renderAll();
  if (API.onReady) API.onReady();
})();
