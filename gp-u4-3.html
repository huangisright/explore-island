    <p class="lede"><i>AA</i>′、<i>BB</i>′、<i>CC</i>′ 交在 <i>O</i>。把對應的邊延長，交出 <i>P</i>、<i>Q</i>、<i>R</i>。</p>

        <div class="row"><span class="sw" style="background:var(--orange)"></span><span><i>R</i>＝<i>AB</i> 與 <i>A</i>′<i>B</i>′ 的交點</span><span class="val" id="vR" style="font-size:18px"></span></div>

  const lerp = (p, q, t) => [p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t];
  const cross = (o, p, q) => (p[0]-o[0])*(q[1]-o[1]) - (p[1]-o[1])*(q[0]-o[0]);
  function inter(P1, P2, P3, P4){ const d = (P1[0]-P2[0])*(P3[1]-P4[1]) - (P1[1]-P2[1])*(P3[0]-P4[0]);
    const scale = dist(P1, P2) * dist(P3, P4); if (Math.abs(d) < 1e-6 * scale) return null;
    const t = ((P1[0]-P3[0])*(P3[1]-P4[1]) - (P1[1]-P3[1])*(P3[0]-P4[0])) / d; const r = [P1[0]+t*(P2[0]-P1[0]), P1[1]+t*(P2[1]-P1[1])];
    return Math.hypot(...r) > 1e5 ? null : r; }
  function sr(P, Xp, Q){ const v = [Q[0]-P[0], Q[1]-P[1]], t = ((Xp[0]-P[0])*v[0] + (Xp[1]-P[1])*v[1]) / (v[0]*v[0] + v[1]*v[1]); return t / (1 - t); }
  function geo(st){
    const { O, A, B, C } = st, [A2, B2, C2] = [A, B, C].map((p, i) => lerp(O, p, st.l[i]));
    return { O, A, B, C, A2, B2, C2, P: inter(B, C, B2, C2), Q: inter(C, A, C2, A2), R: inter(A, B, A2, B2) };
  }
  function devi(g){ const ps = [g.P, g.Q, g.R].filter(Boolean); if (ps.length < 3) return null;
    // 最遠兩點連線，第三點到它的距離
    const pr = [[0,1,2],[1,2,0],[0,2,1]].map(([i,j,k]) => [dist(ps[i], ps[j]), i, j, k]).sort((a, b) => b[0] - a[0])[0];
    return Math.abs(cross(ps[pr[1]], ps[pr[2]], ps[pr[3]])) / pr[0]; }
  const fmtD = (g) => g === null ? "—" : (g < 1e-6 ? "＜ 0.000001" : g.toFixed(6));
  function seg(p, q, cls){ const a = X(p), b = X(q); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }); }
  function draw(){
    svg.innerHTML = "";
    const g = geo(s);
    // 射線（從 O 到較遠的那一點，再多一點）
    [[g.A, g.A2], [g.B, g.B2], [g.C, g.C2]].forEach(([p, q]) => { const far = dist(g.O, p) > dist(g.O, q) ? p : q, near = far === p ? q : p;
      const sameSide = (p[0]-g.O[0])*(q[0]-g.O[0]) + (p[1]-g.O[1])*(q[1]-g.O[1]) > 0;
      const u = [far[0]-g.O[0], far[1]-g.O[1]], L = Math.hypot(...u), e1 = [far[0] + u[0]/L*6, far[1] + u[1]/L*6];
      if (sameSide) seg(g.O, e1, "ray"); else { const v = [near[0]-g.O[0], near[1]-g.O[1]], M = Math.hypot(...v); seg([near[0] + v[0]/M*6, near[1] + v[1]/M*6], e1, "ray"); } });
    // 對邊延長
    [[g.B, g.C, g.P], [g.B2, g.C2, g.P], [g.C, g.A, g.Q], [g.C2, g.A2, g.Q], [g.A, g.B, g.R], [g.A2, g.B2, g.R]].forEach(([u, v, x]) => { if (!x) return; if (sr(u, x, v) < 0) seg(dist(x, u) < dist(x, v) ? u : v, x, "extl"); });
    const ps = [g.P, g.Q, g.R].filter(Boolean);
    if (ps.length >= 2){ const pr = ps.length === 3 ? [[0,1],[1,2],[0,2]].map(([i,j]) => [dist(ps[i], ps[j]), i, j]).sort((a, b) => b[0] - a[0])[0] : [0, 0, 1];
      const a = ps[pr[1]], b = ps[pr[2]], u = [b[0]-a[0], b[1]-a[1]], L = Math.hypot(...u); seg([a[0] - u[0]/L*8, a[1] - u[1]/L*8], [b[0] + u[0]/L*8, b[1] + u[1]/L*8], "axis"); }
    else if (ps.length === 1 && g.R === null){ /* 平行：畫過 P 平行 AB 的線 */ const a = ps[0], u = [g.B[0]-g.A[0], g.B[1]-g.A[1]], L = Math.hypot(...u); seg([a[0] - u[0]/L*200, a[1] - u[1]/L*200], [a[0] + u[0]/L*200, a[1] + u[1]/L*200], "axis"); }
    if (hl){ const T = [[g.O, g.B, g.C, g.B2, g.C2], [g.O, g.C, g.A, g.C2, g.A2], [g.O, g.A, g.B, g.A2, g.B2]][hl - 1];
      el("polygon", { points: [T[0], T[1], T[2]].map(p => X(p).join(",")).join(" "), class: "hl" });
      const x = [g.P, g.Q, g.R][hl - 1]; if (x){ const ends = [T[3], T[4], x].sort((p, q) => p[0] - q[0] || p[1] - q[1]); seg(ends[0], ends[2], "hl2"); } }
    el("polygon", { points: [g.A, g.B, g.C].map(p => X(p).join(",")).join(" "), class: "t1" });
    el("polygon", { points: [g.A2, g.B2, g.C2].map(p => X(p).join(",")).join(" "), class: "t2" });
    [["P", g.P], ["Q", g.Q], ["R", g.R]].forEach(([t, x]) => { if (!x) return; const q = X(x); el("circle", { cx: q[0], cy: q[1], r: 5, class: "pq" }); txt(q[0], q[1] - 16, t, "labp"); });
    const G1 = [(g.A[0]+g.B[0]+g.C[0])/3, (g.A[1]+g.B[1]+g.C[1])/3], G2 = [(g.A2[0]+g.B2[0]+g.C2[0])/3, (g.A2[1]+g.B2[1]+g.C2[1])/3];
    const labAt = (p, G, t, cls) => { const v = [p[0]-G[0], p[1]-G[1]], L = Math.hypot(...v) || 1, q = X([p[0] + v[0]/L*5.5, p[1] + v[1]/L*5.5]); txt(q[0], q[1], t, cls); };
    labAt(g.A, G1, "A", "lab1"); labAt(g.B, G1, "B", "lab1"); labAt(g.C, G1, "C", "lab1");
    labAt(g.A2, G2, "A′", "gp-lab"); labAt(g.B2, G2, "B′", "gp-lab"); labAt(g.C2, G2, "C′", "gp-lab");
    const handle = (p, id, cls) => { const q = X(p); el("circle", { cx: q[0], cy: q[1], r: 18, class: "hit", "data-h": id }); el("circle", { cx: q[0], cy: q[1], r: 7, class: cls, "data-h": id }); };
    handle(g.A2, "A2", "drag2"); handle(g.B2, "B2", "drag2"); handle(g.C2, "C2", "drag2");
    handle(g.A, "A", "drag1"); handle(g.B, "B", "drag1"); handle(g.C, "C", "drag1"); handle(g.O, "O", "drag");
    const qo = X(g.O); txt(qo[0] - 14, qo[1] + 14, "O", "gp-lab");
    const fp = (x) => x ? "有" : "平行，沒有交點";
    $("vP").textContent = fp(g.P); $("vQ").textContent = fp(g.Q); $("vR").textContent = fp(g.R);
    const dv = devi(g);
    if (dv === null && !g.R && g.P && g.Q){ const u = [g.Q[0]-g.P[0], g.Q[1]-g.P[1]], v = [g.B[0]-g.A[0], g.B[1]-g.A[1]];
      const ang = Math.abs(Math.atan2(u[0]*v[1] - u[1]*v[0], u[0]*v[0] + u[1]*v[1])) * 180 / Math.PI;
      $("vD").textContent = (Math.min(ang, 180 - ang) < 1e-6 ? "PQ ∥ AB" : Math.min(ang, 180 - ang).toFixed(3) + "°"); }
    else $("vD").textContent = fmtD(dv);
    if (hl){ const names = ["△OBC 與直線 B′C′（經過 P）", "△OCA 與直線 C′A′（經過 Q）", "△OAB 與直線 A′B′（經過 R）"];
      const T = [[g.B, g.P, g.C, g.C2, g.O, g.B2], [g.C, g.Q, g.A, g.A2, g.O, g.C2], [g.A, g.R, g.B, g.B2, g.O, g.A2]][hl - 1];
      let pr = null; if (T[1]){ pr = sr(T[0], T[1], T[2]) * sr(T[2], T[3], T[4]) * sr(T[4], T[5], T[0]); }
      $("note").innerHTML = names[hl - 1] + (pr === null ? "" : `：繞一圈三個有號的比相乘 ＝ ${pr.toFixed(3).replace("-", "−")}`); $("note").hidden = false; }
    else $("note").hidden = true;
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev));
    if (drag.endsWith("2")){ const i = "ABC".indexOf(drag[0]), V = s[drag[0]], u = [V[0]-s.O[0], V[1]-s.O[1]];
      let t = ((w[0]-s.O[0])*u[0] + (w[1]-s.O[1])*u[1]) / (u[0]*u[0] + u[1]*u[1]); if (Math.abs(t) < 0.15 || Math.abs(t - 1) < 0.08) return; s.l[i] = t; }
    else { const t = JSON.parse(JSON.stringify(s)); t[drag] = w; if (Math.abs(cross(t.A, t.B, t.C)) < 30 || dist(t.O, t.A) < 3 || dist(t.O, t.B) < 3 || dist(t.O, t.C) < 3) return; s[drag] = w; }
    clearStat(); draw(); });
  const end = () => { drag = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  $("home").addEventListener("click", () => { if (running) return; s = JSON.parse(JSON.stringify(HOME)); clearStat(); draw(); });
  $("mid").addEventListener("click", () => { if (running) return; s = JSON.parse(JSON.stringify(MID)); clearStat(); draw(); });
  $("par").addEventListener("click", () => { if (running) return;
    // 讓 A'B' ∥ AB：B' 的倍數改成和 A' 一樣
    s.l[1] = s.l[0]; clearStat(); draw(); });
  $("hl").addEventListener("click", () => { hl = (hl + 1) % 4; $("hl").setAttribute("aria-pressed", String(hl > 0)); $("hl").textContent = hl ? `描出一個三角形（${hl}/3）` : "描出一個三角形"; draw(); });
  $("run").addEventListener("click", () => {
    if (running) return; clearStat(); running = true; $("run").disabled = true;
    const keep = JSON.parse(JSON.stringify(s)), N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 20;
    let done = 0, worst = 0;
    const rnd = () => [-20 + Math.random()*80, -10 + Math.random()*50];
    function tick(){
      for (let i = 0; i < step && done < N; i++){
        const t = { O: rnd(), A: rnd(), B: rnd(), C: rnd(), l: [0, 0, 0].map(() => (Math.random() < .5 ? -1 : 1) * (0.4 + Math.random()*2.6)) };
        if (Math.abs(cross(t.A, t.B, t.C)) < 150) continue; const g = geo(t), dv = devi(g); if (dv === null) continue;
        const scale = Math.max(dist(g.P, g.Q), dist(g.Q, g.R), dist(g.R, g.P)); done++; worst = Math.max(worst, dv / Math.max(1, scale) * 100); s = t;
      }
      draw(); $("stat").innerHTML = `試了 <b>${done}</b> 組`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false; s = keep; draw();
        $("stat").innerHTML = `${done} 組，第三點離另外兩點連線最遠 <b>${worst < 1e-6 ? "＜ 0.000001" : worst.toExponential(1)}</b>（以三點最遠距離為 100 換算）`;
        $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key]; if (!mv) return;
    ev.preventDefault(); s.O = [s.O[0] + mv[0], s.O[1] + mv[1]]; draw(); });
  draw();
})();
</script>

<style id="island">
/* ===== 探索島：預測／紀錄／判斷題／單元章 ===== */
.isl-box{margin:0;padding:16px 22px;border-bottom:1px solid var(--edge-soft);background:var(--indigo-soft)}

.isl-box .isl-q{font-size:15.5px;color:var(--ink);margin:0 0 10px;max-width:none}
.isl-obs{background:var(--orange-soft);border-top:1px solid var(--edge-soft);border-bottom:0}
.isl-obs .isl-k{color:var(--orange)}
.isl-opts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.isl-opts label{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;
  padding:5px 12px;border:1px solid var(--edge);border-radius:999px;background:var(--card);cursor:pointer}
.isl-opts label:has(input:checked){border-color:var(--indigo);color:var(--indigo);font-weight:600}
.isl-opts input{accent-color:var(--indigo);margin:0}
.isl-ta{width:100%;min-height:62px;resize:vertical;font:inherit;font-size:15px;line-height:1.6;
  padding:9px 12px;border:1px solid var(--edge);border-radius:5px;background:var(--card);color:var(--ink)}
.isl-ta:focus{outline:2px solid var(--indigo);outline-offset:1px}
.isl-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.isl-btn{font:inherit;font-size:14.5px;font-weight:600;padding:7px 16px;border-radius:5px;cursor:pointer;
  border:1px solid var(--indigo);background:var(--indigo);color:var(--card)}
.isl-btn:disabled{opacity:.4;cursor:not-allowed}
.isl-btn.ghost{background:var(--card);color:var(--indigo)}
.isl-hint{font-size:13px;color:var(--ink-3)}
.isl-hint.warn{color:var(--orange);font-weight:600}
.isl-rule{font-size:13.5px;color:var(--ink-2);margin:6px 0 0;max-width:none}
.isl-mine{font-size:14.5px;color:var(--ink-2);margin:0;max-width:none}
.isl-mine b{color:var(--indigo)}
.isl-wait{padding:26px 22px;text-align:center;color:var(--ink-3);font-size:14.5px;
  background:repeating-linear-gradient(45deg,transparent 0 10px,var(--edge-soft) 10px 11px)}
.isl-done-tag{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--green);letter-spacing:.08em}
.lab-foot.isl-reveal::before{content:"對照看看";display:block;font-size:12px;letter-spacing:.14em;
  font-weight:700;color:var(--green);margin-bottom:2px}
.isl-gate{margin:20px 0;padding:14px 18px;border:1px dashed var(--edge);border-radius:5px;
  color:var(--ink-3);font-size:14px;text-align:center}

/* 進度列 */
.isl-prog{margin:0 0 6px;padding:12px 16px;border:1px solid var(--edge);border-radius:5px;background:var(--card);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:14px}
.isl-prog .t{font-weight:700;color:var(--ink-2);letter-spacing:.06em}
.isl-dots{display:flex;gap:6px;flex-wrap:wrap}
.isl-dots a{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;
  font-size:12.5px;font-weight:700;text-decoration:none;border:1.5px solid var(--edge);color:var(--ink-3);background:var(--paper)}
.isl-dots a.half{border-color:var(--indigo);color:var(--indigo)}
.isl-dots a.ok{border-color:var(--green);background:var(--green);color:var(--card)}
.isl-prog .q{color:var(--ink-3)}
.isl-prog .q.ok{color:var(--green);font-weight:700}

/* 判斷題 */
#isl-quiz{padding:44px 0 8px;scroll-margin-top:64px}
.isl-qcard{background:var(--card);border:1px solid var(--edge);border-radius:5px;box-shadow:var(--shadow);
  padding:18px 22px;margin:16px 0}
.isl-qcard .isl-qn{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--orange)}

.isl-fb{margin-top:6px;padding:10px 14px;border-radius:4px;font-size:14.5px;border:1px solid var(--edge)}

.isl-fb.good{border-color:var(--green);background:var(--green-soft)}

.isl-tbl th{font-size:12.5px;letter-spacing:.1em;color:var(--ink-3);font-weight:700}
.isl-tbl td.n{white-space:nowrap;font-weight:600;color:var(--ink-2);width:9.5em}
.isl-tbl td .empty{color:var(--ink-3)}
.isl-stamp-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:18px}
.isl-stamp{width:150px;height:150px;flex:none}
.isl-stamp.off{opacity:.18;filter:grayscale(1)}
.isl-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.isl-clear{font-size:13px;color:var(--ink-3);background:none;border:0;text-decoration:underline;cursor:pointer;font:inherit}
@media (max-width:600px){
  .isl-tbl, .isl-tbl tbody, .isl-tbl tr, .isl-tbl td{display:block;width:auto}
  .isl-tbl thead{display:none}
  .isl-tbl td{border:0;padding:3px 0}
  .isl-tbl tr{border-bottom:1px solid var(--edge-soft);padding:10px 0}
  .isl-tbl td[data-h]::before{content:attr(data-h)"　";font-size:12px;color:var(--ink-3);font-weight:700}
}

  body.isl-print .isl-tools, body.isl-print nav, body.isl-print #isl-record > .isl-hint{display:none !important}

}
/* 單元頁的手繪主題對所有 button 用了 !important，這裡要用更高的權重蓋回來 */
button.isl-choice{background:var(--paper)!important;color:var(--ink)!important;opacity:1}

button.isl-clear{border:0!important;background:none!important;color:var(--ink-3)!important;padding:0 4px}

/* 舊版單元頁（h4 探索站）轉換後的基本樣式；新版頁面本來就有，這裡用低權重不會蓋掉 */

<script>window.ISLAND={"slug": "gp-u4-3", "chap": "拾光四-3", "title": "三組對邊，交在一條線上", "topic": "兩個三角形從一點看過去", "plain": "這座島上，兩個三角形從同一點看過去；三組對邊的交點，排在一條線上。", "stations": {"lab1": {"mode": "predict", "why": "拖橘色的 O、藍色的 A、B、C，灰色的 A′、B′、C′ 沿著射線拖；看「R 離直線 PQ」，再按「隨機 1000 組」。也試試「讓 A′B′ ∥ AB」「O 在中間」。", "q": "AA′、BB′、CC′ 交在 O。把對應的邊延長：BC 和 B′C′ 交於 P，CA 和 C′A′ 交於 Q，AB 和 A′B′ 交於 R。P、Q、R 會怎樣？", "opts": ["在一條直線上", "圍成一個和 △ABC 一樣形狀的三角形", "看情況，沒有規律", "三點重合"], "multi": false, "obs": "P、Q、R 每一次都在一條線上嗎？按「讓 A′B′ ∥ AB」之後，R 跑到哪裡？P、Q 的連線呢？"}, "lab2": {"mode": "predict", "why": "按「描出一個三角形」，看描出來的是哪一個三角形，再想上一節那一招可以用在誰身上。", "q": "這一次圖上沒有任何長度。螢幕拖了上千次，三點每次都在一條直線上。這樣算不算已經說明了？", "opts": ["算", "不算"], "multi": false, "obs": "你描出（或找到）哪幾個三角形？每一個被哪一條直線穿過？那一招用了幾次，才把 P、Q、R 接起來？"}}, "gates": [{"hide": "#lab2", "after": "lab1"}], "quiz": [{"q": "把 A′B′ 拖到和 AB 平行，R 跑到哪裡？", "opts": ["跑到很遠，兩條線平行沒有交點；這時 PQ 和 AB 平行", "R 和 P 重合", "R 跑到 O", "PQ 和 AB 垂直"], "ans": 0, "why": ["", "按「讓 A′B′ ∥ AB」看 R。", "R 不會跑到 O。", "按「讓 A′B′ ∥ AB」看 PQ 的方向。"], "exp": "AB 和 A′B′ 平行就沒有交點，R「跑到很遠」；這時 P、Q 的連線也和它們平行，三點在一條線上的說法還是對的。"}, {"q": "把 O 放在兩個三角形中間，P、Q、R 還在一條直線上嗎？", "opts": ["還在", "不在了", "只有 O 在正中間時才在", "要看兩個三角形的大小"], "ans": 0, "why": ["", "按「O 在中間」看看。", "按「O 在中間」後再拖動 O 看看。", "大小不影響，拖拖看。"], "exp": "O 在中間時仍然在一條直線上，說明的步驟一樣可以用。"}, {"q": "這一節的說明，用了上一節「一條線穿過去」那一招幾次？", "opts": ["三次", "一次", "兩次", "沒有用到"], "ans": 0, "why": ["", "一次只能接起兩個點，還不夠。", "兩次還差一次。", "用得到，而且不只一次。"], "exp": "對 △OAB、△OBC、△OCA（或描出來的三角形）各用一次，三個式子乘起來，該約的都約掉，剩下的正是 P、Q、R 那條線的乘積。"}]};</script>
<script>
/* ===== 探索島：預測／紀錄／判斷題／單元章 =====
   沒登入：紀錄只存在這台裝置的瀏覽器（localStorage）。
   登入且在名單上：island-cloud.js 透過 window.ISLAND_API 接手，另存一份到雲端。 */
(function () {
  const C = window.ISLAND;
  let KEY = "isl:" + C.slug;
  let NAMEKEY = "isl:name";
  let nameLocked = false;
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } },
  };
  let S;
  try { S = JSON.parse(store.get(KEY)) || {}; } catch (e) { S = {}; }
  S.st = S.st || {}; S.quiz = S.quiz || {};
  const save = () => {
    S.updated = new Date().toISOString();
    S.n = ids.length; S.nd = ids.filter(id => S.st[id] && S.st[id].done).length;
    S.q = C.quiz.length; S.qd = C.quiz.filter((_, i) => S.quiz[i] && S.quiz[i].ok).length;
    store.set(KEY, JSON.stringify(S));
    if (API.onSave) API.onSave(S);
  };
  const API = window.ISLAND_API = window.ISLAND_API || {};

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const ids = Object.keys(C.stations);
  const MIN_OBS = 1;   // 寫一個字（例如一個數字）就算

  const st = id => (S.st[id] = S.st[id] || { opts: [], pred: "", locked: false, obs: "", done: false });
  const predText = (cfg, s) => {
    const parts = [];
    if (cfg.opts && s.opts.length) parts.push(s.opts.map(i => cfg.opts[i]).join("、"));
    else if (cfg.opts && cfg.multi) parts.push("一個都沒選");
    if (s.pred.trim()) parts.push(s.pred.trim());
    return parts.join("；");
  };
  const stationDone = id => !!st(id).done;
  const quizDone = i => !!(S.quiz[i] && S.quiz[i].ok);
  const allStations = () => ids.every(stationDone);
  const allQuiz = () => C.quiz.every((_, i) => quizDone(i));

  /* ---------- 每一站 ---------- */
  ids.forEach(id => {
    const cfg = C.stations[id];
    const lab = document.getElementById(id);
    if (!lab) return;
    let s = st(id);
    const head = lab.querySelector(".lab-head");
    const body = lab.querySelector(".lab-body");
    const foot = lab.querySelector(".lab-foot");
    const no = lab.querySelector(".lab-no").textContent.trim();
    if (cfg.why) lab.querySelector(".lab-why").innerHTML = esc(cfg.why);
    const tag = el("span", "isl-done-tag", "");
    head.appendChild(tag);

    /* 預測 */
    let pbox = null, wait = null;
    if (cfg.mode === "predict") {
      pbox = el("div", "isl-box");
      head.after(pbox);
      wait = el("div", "isl-wait", "先寫下你的預測，這一站才會打開。");
      body.before(wait);
    }
    const renderPred = () => {
      if (!pbox) return;
      if (s.locked) {
        pbox.innerHTML = '<div class="isl-k">我的預測</div><p class="isl-mine">' + esc(cfg.q) + "<br><b>" + esc(predText(cfg, s)) + "</b></p>";
        return;
      }
      const type = cfg.multi ? "checkbox" : "radio";
      let h = '<div class="isl-k">先預測，再動手</div><p class="isl-q">' + esc(cfg.q) + "</p>";
      if (cfg.opts) {
        h += '<div class="isl-opts">' + cfg.opts.map((o, i) =>
          '<label><input type="' + type + '" name="o-' + id + '" value="' + i + '"' + (s.opts.includes(i) ? " checked" : "") + "> " + esc(o) + "</label>").join("") + "</div>";
      }
      h += '<textarea class="isl-ta" placeholder="' + (cfg.opts ? "為什麼這樣猜？（寫一句就好）" : "寫下你的答案和理由") + '">' + esc(s.pred) + "</textarea>";
      const rule = !cfg.opts ? "寫下你的答案就能送出，一個數字也可以。"
        : cfg.multi ? "勾選你覺得對的（可以都不勾），再寫一句為什麼，就能送出。"
        : "選一個答案，再寫一句為什麼，就能送出。";
      h += '<p class="isl-rule">' + rule + '</p>';
      h += '<div class="isl-row"><button class="isl-btn primary">預測寫好了，開始操作</button><span class="isl-hint"></span></div>';
      pbox.innerHTML = h;
      const ta = pbox.querySelector("textarea"), btn = pbox.querySelector("button"), hint = pbox.querySelector(".isl-hint");
      const ok = () => {
        s.opts = [...pbox.querySelectorAll("input:checked")].map(x => +x.value);
        s.pred = ta.value;
        const needOpt = cfg.opts && !cfg.multi && s.opts.length === 0;
        const needText = s.pred.trim().length === 0;
        btn.disabled = needOpt || needText;
        hint.classList.toggle("warn", btn.disabled);
        hint.textContent = needOpt && needText ? "還差：選一個答案、寫一句為什麼。"
          : needOpt ? "還差：選一個答案。"
          : needText ? (cfg.opts ? "還差：寫一句為什麼。" : "還差：寫下你的答案。")
          : "送出後就不能改。猜錯沒關係，等一下對照才有東西看。";
      };
      pbox.addEventListener("input", () => { ok(); save(); });
      pbox.addEventListener("change", () => { ok(); save(); });
      ok();
      btn.addEventListener("click", () => {
        ok();
        if (btn.disabled) return;
        s.locked = true; s.lockedAt = new Date().toISOString(); s.pt = predText(cfg, s); save();
        renderAll(); body.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    };

    /* 觀察紀錄 */
    const obox = el("div", "isl-box isl-obs");
    body.after(obox);
    const renderObs = () => {
      let h = '<div class="isl-k">我看到的</div><p class="isl-q">' + esc(cfg.obs) + "</p>";
      h += '<textarea class="isl-ta" placeholder="把你看到的寫下來">' + esc(s.obs) + "</textarea>";
      h += '<div class="isl-row"><button class="isl-btn' + (s.done ? "" : " primary") + '">' + (s.done ? "更新紀錄" : "記下來，看對照") + '</button><span class="isl-hint">' + (s.done ? "" : "寫下你看到的（一句話就好），就能記錄。") + '</span></div>';
      obox.innerHTML = h;
      const ta = obox.querySelector("textarea"), btn = obox.querySelector("button"), hint = obox.querySelector(".isl-hint");
      const chk = () => { btn.disabled = ta.value.trim().length < MIN_OBS; };
      ta.addEventListener("input", () => {
        s.obs = ta.value; save(); chk();
        hint.textContent = s.done ? "已自動儲存" : btn.disabled ? "寫下你看到的（一句話就好），就能記錄。" : "";
      });
      chk();
      btn.addEventListener("click", () => {
        s.obs = ta.value; if (s.obs.trim().length < MIN_OBS) return;
        const first = !s.done;
        s.done = true; s.doneAt = s.doneAt || new Date().toISOString(); save();
        renderAll();
        if (first && foot) foot.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    };

    lab._islRender = () => {
      s = st(id);
      if (s.locked && s.pt == null) s.pt = predText(cfg, s);   // 紀錄本要顯示預測的文字（那一頁沒有選項內容）
      const open = cfg.mode !== "predict" || s.locked;
      renderPred();
      if (wait) wait.hidden = open;
      body.hidden = !open;
      obox.hidden = !open;
      if (open) renderObs();
      if (foot) { foot.hidden = !s.done; foot.classList.add("isl-reveal"); }
      tag.textContent = s.done ? "✓ 已記錄" : "";
    };
  });

  /* ---------- 會先講出答案的段落 ---------- */
  const gates = (C.gates || []).map(g => {
    const label = g.after === "ALL" ? "全部 " + ids.length + " 站都記錄完，這一段才會打開。" :
      "第 " + document.querySelector("#" + g.after + " .lab-no").textContent.trim() + " 站記錄完，這一段才會打開。";
    const note = el("div", "isl-gate", label);
    if (g.hide) {                       // 直接藏起指定的元素（段落裡同時有探索站時用）
      const kids = [...document.querySelectorAll(g.hide)];
      if (!kids.length) return null;
      kids[0].before(note);
      return { g, kids, note };
    }
    const sec = document.querySelector(g.sel);
    if (!sec) return null;
    const kids = [...sec.children].filter(k => !k.classList.contains("pillar-tag"));
    sec.appendChild(note);
    return { g, kids, note };
  }).filter(Boolean);

  /* ---------- 進度列 ---------- */
  const prog = el("div", "isl-prog");
  document.querySelector("header").after(prog);

  /* ---------- 判斷題 ---------- */
  const quiz = el("section", "", "");
  quiz.id = "isl-quiz";
  const endSec = document.getElementById("end");
  (endSec || document.querySelector(".wrap").lastElementChild).before(quiz);
  const renderQuiz = () => {
    let h = '<div class="pillar-tag" style="color:var(--orange)"><span class="dot" style="background:var(--orange)"></span>過關前的 ' + C.quiz.length + ' 題</div>' +
      "<h2>選一個，答錯可以再選</h2>";
    quiz.innerHTML = h;
    C.quiz.forEach((q, i) => {
      const r = S.quiz[i] = S.quiz[i] || { tried: [], ok: false };
      const card = el("div", "isl-qcard");
      card.innerHTML = '<div class="isl-qn">第 ' + (i + 1) + " 題</div><p class=\"isl-qt\">" + esc(q.q) + "</p>";
      q.opts.forEach((o, j) => {
        const b = el("button", "isl-choice", esc(o));
        if (r.tried.includes(j)) b.classList.add(j === q.ans ? "yes" : "no");
        if (r.ok || r.tried.includes(j)) b.disabled = true;
        b.addEventListener("click", () => {
          r.tried.push(j);
          if (j === q.ans) { r.ok = true; r.okAt = new Date().toISOString(); }
          save(); renderAll();
        });
        card.appendChild(b);
      });
      const last = r.tried[r.tried.length - 1];
      if (r.ok) card.appendChild(el("div", "isl-fb good", "<b>對。</b>" + esc(q.exp)));
      else if (last != null) card.appendChild(el("div", "isl-fb bad", "<b>再想想。</b>" + esc(q.why[last])));
      quiz.appendChild(card);
    });
  };

  /* ---------- 紀錄與章 ---------- */
  const rec = el("section", "", "");
  rec.id = "isl-record";
  document.querySelector(".wrap").appendChild(rec);
  const stamp = (on, date) => {
    const d = date ? date.slice(0, 10).replace(/-/g, ".") : "";
    return '<svg class="isl-stamp' + (on ? "" : " off") + '" viewBox="0 0 150 150" role="img" aria-label="單元章">' +
      '<g transform="rotate(-8 75 75)" style="fill:none;stroke:var(--crimson)">' +
      '<circle cx="75" cy="75" r="66" stroke-width="4"/><circle cx="75" cy="75" r="57" stroke-width="1.5"/>' +
      '<text x="75" y="52" text-anchor="middle" style="fill:var(--crimson);stroke:none;font:700 13px var(--sans);letter-spacing:2px">' + esc(C.chap) + "　探索完成</text>" +
      '<text x="75" y="84" text-anchor="middle" style="fill:var(--crimson);stroke:none;font:700 21px var(--serif)">' + esc(C.title) + "</text>" +
      '<line x1="34" y1="96" x2="116" y2="96" stroke-width="1.2"/>' +
      '<text x="75" y="114" text-anchor="middle" style="fill:var(--crimson);stroke:none;font:600 12px var(--sans)">' + (d || "　") + "</text></g></svg>";
  };
  let clearArmed = false;
  const renderRecord = () => {
    const done = allStations() && allQuiz();
    const firstOK = C.quiz.filter((q, i) => S.quiz[i] && S.quiz[i].tried[0] === q.ans).length;
    let h = '<div class="pillar-tag" style="color:var(--green)"><span class="dot" style="background:var(--green)"></span>我的探索紀錄</div>';
    h += '<div class="isl-sheet"><div class="isl-sheet-head"><div><h3>' + esc(C.chap) + "　" + esc(C.title) + '</h3><div class="isl-sub">' + esc(C.topic) + '</div></div>' +
      '<label class="isl-name">姓名 <input type="text" maxlength="20" value="' + esc(store.get(NAMEKEY) || "") + '"' + (nameLocked ? " readonly" : "") + '></label></div>';
    h += '<table class="isl-tbl"><thead><tr><th>站</th><th>我的預測</th><th>我看到的</th></tr></thead><tbody>';
    ids.forEach(id => {
      const cfg = C.stations[id], s = st(id);
      const lab = document.getElementById(id);
      const name = lab ? lab.querySelector(".lab-no").textContent.trim() + "　" + lab.querySelector(".lab-title").textContent.trim() : id;
      const p = cfg.mode === "predict" ? (s.locked ? esc(predText(cfg, s)) : '<span class="empty">還沒寫</span>') : '<span class="empty">（這站直接操作）</span>';
      const o = s.done ? esc(s.obs.trim()) : '<span class="empty">還沒寫</span>';
      h += '<tr><td class="n">' + esc(name) + '</td><td data-h="預測">' + p + '</td><td data-h="看到">' + o + "</td></tr>";
    });
    h += "</tbody></table>";
    h += '<div class="isl-stamp-wrap">' + stamp(done, S.stampAt) + "<div>" +
      (done ? "<b>這一章探索完成。</b><br>判斷題第一次就答對 " + firstOK + " ／ " + C.quiz.length + " 題。"
            : "全部 " + ids.length + " 站都記錄完、" + C.quiz.length + " 題判斷題都答對，就會蓋上這個章。<br>目前：" +
              ids.filter(stationDone).length + " ／ " + ids.length + " 站，" +
              C.quiz.filter((_, i) => quizDone(i)).length + " ／ " + C.quiz.length + " 題。") +
      "</div></div></div>";
    h += '<div class="isl-tools"><button class="isl-btn primary" data-a="print">列印這份紀錄</button>' +
      '<a class="isl-btn ghost" style="text-decoration:none" href="passport.html">看我的探索紀錄本</a>' +
      '<button class="isl-clear" data-a="clear">' + (clearArmed ? "確定要清掉？再按一次" : "清除這一章的紀錄") + "</button></div>";
    h += '<p class="isl-hint" style="margin-top:10px">' + (window.ISLAND_GATE ? "" : "沒登入時，紀錄只存在這台電腦的瀏覽器裡；") + '登入名單上的帳號，紀錄會存到雲端。在共用電腦上用完記得登出。</p>';
    rec.innerHTML = h;
    rec.querySelector(".isl-name input").addEventListener("input", e => store.set(NAMEKEY, e.target.value));
    rec.querySelector('[data-a="print"]').addEventListener("click", () => {
      document.body.classList.add("isl-print"); window.print();
      setTimeout(() => document.body.classList.remove("isl-print"), 500);
    });
    rec.querySelector('[data-a="clear"]').addEventListener("click", () => {
      if (!clearArmed) { clearArmed = true; renderRecord(); setTimeout(() => { clearArmed = false; renderRecord(); }, 4000); return; }
      if (API.onClear) { API.onClear(); return; }
      store.del(KEY); location.reload();
    });
  };

  function renderAll() {
    if (allStations() && allQuiz() && !S.stampAt) { S.stampAt = new Date().toISOString(); save(); }
    ids.forEach(id => { const lab = document.getElementById(id); lab && lab._islRender && lab._islRender(); });
    gates.forEach(({ g, kids, note }) => {
      const open = g.after === "ALL" ? allStations() : stationDone(g.after);
      kids.forEach(k => { if (k !== note) k.hidden = !open; });
      note.hidden = open;
    });
    const nq = C.quiz.filter((_, i) => quizDone(i)).length;
    prog.innerHTML = '<span class="t">探索紀錄</span><span class="isl-dots">' + ids.map(id => {
      const s = st(id), cfg = C.stations[id];
      const n = document.querySelector("#" + id + " .lab-no").textContent.trim();
      const cls = s.done ? "ok" : (cfg.mode === "predict" && s.locked) ? "half" : "";
      return '<a class="' + cls + '" href="#' + id + '" title="第 ' + n + ' 站">' + n + "</a>";
    }).join("") + '</span><a class="q' + (nq === C.quiz.length ? " ok" : "") + '" href="#isl-quiz" style="text-decoration:none">判斷題 ' + nq + " ／ " + C.quiz.length + "</a>" +
      '<a class="q' + (S.stampAt ? " ok" : "") + '" href="#isl-record" style="text-decoration:none">' + (S.stampAt ? "✓ 已蓋章" : "我的紀錄 →") + "</a>";
    renderQuiz();
    renderRecord();
  }
  /* 給雲端模組用：換一個人的紀錄、換姓名、整頁重畫 */
  API.config = C;
  API.store = store;
  API.state = () => S;
  API.adopt = (newKey, newS, opts) => {
    KEY = newKey;
    S = newS || {};
    S.st = S.st || {}; S.quiz = S.quiz || {};
    if (opts && opts.nameKey) NAMEKEY = opts.nameKey;
    if (opts && "name" in opts) { store.set(NAMEKEY, opts.name || ""); }
    nameLocked = !!(opts && opts.nameLocked);
    clearArmed = false;
    store.set(KEY, JSON.stringify(S));
    renderAll();
  };
  API.progressBox = prog;
  API.recordBox = rec;
  renderAll();
  if (API.onReady) API.onReady();
})();
</script>
<script src="firebase-config.js"></script>
<script type="module" src="island-cloud.js"></script>
