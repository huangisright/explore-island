<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 660" width="1980" height="660">
  <defs>
    <radialGradient id="glow" cx="62%" cy="52%" r="45%"><stop offset="0" stop-color="#20344c"/><stop offset="1" stop-color="#070f19"/></radialGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#fff6dc" stop-opacity="0"/><stop offset=".75" stop-color="#fff3d2" stop-opacity=".75"/><stop offset="1" stop-color="#ffffff" stop-opacity="1"/></linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8fb3c8" stroke-opacity=".07" stroke-width="1"/></pattern>
  </defs>
  <rect width="1980" height="660" fill="url(#glow)"/>
  <rect width="1980" height="660" fill="url(#grid)"/>
  <g fill="none" stroke="#c9a56a" stroke-opacity=".22">
    <ellipse cx="1230" cy="610" rx="620" ry="150"/>
    <ellipse cx="1230" cy="610" rx="840" ry="210"/>
    <path d="M520 560 1900 140" stroke-opacity=".12"/>
  </g>
  <!-- 光束 -->
  <path d="M300 330 L1100 318 L1100 342 Z" fill="url(#beam)" opacity=".55" filter="url(#blur)"/>
  <path d="M300 330 L1100 330" stroke="url(#beam)" stroke-width="3"/>
  <!-- 長方形：x² | 5x / 2x | 10 -->
  <g transform="translate(1100 170)">
    <rect x="-10" y="-10" width="420" height="320" rx="6" fill="#f2d79a" opacity=".12" filter="url(#soft)"/>
    <rect x="0" y="0" width="190" height="190" fill="#9bd8ae" fill-opacity=".14"/>
    <rect x="190" y="0" width="210" height="190" fill="#f2c78f" fill-opacity=".12"/>
    <rect x="0" y="190" width="190" height="110" fill="#9cc4f5" fill-opacity=".14"/>
    <rect x="190" y="190" width="210" height="110" fill="#f3a991" fill-opacity=".16"/>
    <g fill="none" stroke="#f6e7c4" stroke-width="2.2">
      <rect x="0" y="0" width="400" height="300"/>
      <path d="M190 0V300M0 190H400" stroke-dasharray="7 6" stroke="#ead7aa"/>
    </g>
    <g fill="#f4eee1" font-family="Times New Roman,serif" font-style="italic" font-size="34" text-anchor="middle" opacity=".88">
      <text x="95" y="108">x²</text><text x="295" y="108">5x</text><text x="95" y="256">2x</text><text x="295" y="256" font-style="normal">10</text>
    </g>
    <g fill="#ead7aa"><circle cx="0" cy="0" r="4"/><circle cx="400" cy="0" r="4"/><circle cx="0" cy="300" r="4"/><circle cx="400" cy="300" r="4"/><circle cx="190" cy="190" r="4"/></g>
  </g>
  <!-- 光被切開：四道彩色光帶 -->
  <g opacity=".85">
    <path d="M1500 230 L1980 170 L1980 230 L1500 262 Z" fill="#9bd8ae" opacity=".35"/>
    <path d="M1500 270 L1980 250 L1980 310 L1500 300 Z" fill="#f2c78f" opacity=".32"/>
    <path d="M1500 340 L1980 340 L1980 400 L1500 372 Z" fill="#9cc4f5" opacity=".32"/>
    <path d="M1500 390 L1980 430 L1980 500 L1500 420 Z" fill="#f3a991" opacity=".32"/>
  </g>
  <!-- 星點 -->
  <g fill="#f4eee1">
    <circle cx="620" cy="120" r="1.6" opacity=".6"/><circle cx="760" cy="520" r="1.2" opacity=".5"/><circle cx="880" cy="210" r="1.8" opacity=".7"/>
    <circle cx="980" cy="590" r="1.3" opacity=".5"/><circle cx="1620" cy="90" r="1.7" opacity=".7"/><circle cx="1760" cy="560" r="1.4" opacity=".6"/>
    <circle cx="1880" cy="120" r="1.2" opacity=".5"/><circle cx="1400" cy="610" r="1.6" opacity=".6"/><circle cx="1050" cy="80" r="1.2" opacity=".5"/>
    <circle cx="540" cy="420" r="1.1" opacity=".4"/><circle cx="1690" cy="330" r="1.3" opacity=".5"/>
  </g>
</svg>
