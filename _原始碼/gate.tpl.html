<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>/*TITLE*/</title>
<style id="isl-gate-css">
:root{
  color-scheme:light dark;
  --paper:#F5F2E8; --grid:rgba(46,90,136,.075); --card:#FFFDF8; --edge:#DFD6C4;
  --ink:#23282D; --ink-2:#5C554A; --ink-3:#847B6C; --indigo:#2E5A88; --orange:#C1652F; --green:#4A7C59;
  --serif:"Noto Serif TC",'Songti TC','Times New Roman',serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#161A1E; --grid:rgba(127,169,214,.07); --card:#1F252B; --edge:#333C45;
  --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A; --indigo:#82ADDC; --orange:#E28B52; --green:#82B893;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;
  background-image:repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 26px)}
#isl-gate{max-width:560px;margin:0 auto;padding:12vh 22px 60px}
#isl-gate .site{font-size:12.5px;letter-spacing:.22em;color:var(--orange);font-weight:700}
#isl-gate h1{font-family:var(--serif);font-size:34px;line-height:1.3;margin:10px 0 4px}
#isl-gate .chap{color:var(--ink-3);font-size:14px;margin:0 0 26px}
#isl-gate-msg{border:1px solid var(--edge);border-radius:6px;background:var(--card);padding:20px 22px;color:var(--ink-2);font-size:15px}
#isl-gate-msg p{margin:0 0 14px} #isl-gate-msg p:last-child{margin:0}
#isl-gate-msg .warn{color:var(--orange);font-weight:700}
#isl-gate button{font:inherit;font-size:15px;font-weight:600;padding:7px 18px;border-radius:5px;border:1px solid var(--edge);background:var(--card);color:var(--ink);cursor:pointer}
#isl-gate button.primary{background:var(--indigo);border-color:var(--indigo);color:var(--card)}
#isl-gate .isl-auth{margin:0;padding:0;border:0;background:none}
#isl-gate .isl-auth button{margin-left:0}
#isl-gate .back{display:inline-block;margin-top:18px;font-size:14px;color:var(--indigo);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div id="isl-gate">
  <div class="site">數學探索島</div>
  <h1>/*NAME*/</h1>
  <p class="chap">/*CHAP*/</p>
  <div id="isl-gate-msg"><p>載入中…</p></div>
  <noscript><p>這一頁需要開啟 JavaScript。</p></noscript>
  <a class="back" href="index.html">← 回到地圖</a>
</div>
<script>window.ISLAND_GATE = /*GATE*/{};</script>
<script src="firebase-config.js"></script>
<script type="module" src="island-cloud.js"></script>
</body>
</html>
