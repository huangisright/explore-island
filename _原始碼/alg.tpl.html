<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代數拾光｜一線數光</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#f5f3e9;--card:#fffdf5;--ink:#163e45;--ink-2:#32726b;--ink-3:#7c8f89;--edge:#c4cfc2;--accent:#984810;--deep:#175954;
  --hand:"LXGW WenKai TC","Kaiti TC","KaiTi","STKaiti",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hand);line-height:1.65}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 70px}
.top{padding:16px 0 0;font-size:15px}.top a{color:var(--deep);text-decoration:none}
header{padding:26px 0 10px;border-bottom:1px solid #a8bfb4}
header small{color:var(--ink-2);letter-spacing:.12em}
h1{font-size:clamp(38px,6vw,58px);margin:4px 0 4px;letter-spacing:.1em}
.say{margin:0;color:var(--ink-2);font-size:clamp(16px,2.3vw,19px)}
.list{display:grid;gap:16px;margin-top:22px}
a.u{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:18px 22px;color:var(--ink);text-decoration:none}
a.u:hover{border-color:var(--deep)}
a.u:focus-visible{outline:3px solid #d68937;outline-offset:3px}
.no{width:54px;height:54px;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}
.u b{font-size:23px;display:block}
.u .tp{font-size:14px;color:var(--ink-2)}
.u p{margin:4px 0 0;color:#4c5f5b;font-size:15.5px}
.go{color:var(--accent);white-space:nowrap}
.later{margin-top:22px;color:var(--ink-3);font-size:15px}
footer{margin-top:40px;text-align:center;color:var(--ink-3);font-size:14px}
@media(max-width:600px){a.u{grid-template-columns:auto 1fr}.go{display:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="index.html">← 回到地圖</a>　·　<a href="passport.html">探索紀錄本</a></div>
<header><small>一線數光　／　另一道光</small><h1>代數拾光</h1><p class="say">同一件事，換一種寫法就看見了。每一站先猜，再動手，最後把看到的寫成式子。</p></header>
<div class="list" id="list"></div>
<p class="later">之後的單元做好了會出現在這裡。</p>
<footer>黃士祐 老師（IsRight）</footer>
</div>
<script>
const ALG = /*ALG*/[];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NUM = "一二三四五六七八九十";
document.getElementById("list").innerHTML = ALG.map((u, i) =>
  '<a class="u" href="' + u.slug + '.html"><span class="no">' + (NUM[i] || i + 1) + '</span><div><span class="tp">' + esc(u.chap.replace("代數", "單元")) + "　·　" + esc(u.topic) + "</span><b>" + esc(u.title) + "</b><p>" + esc(u.plain) + '</p></div><span class="go">走進去 →</span></a>').join("");
</script>
</body>
</html>
