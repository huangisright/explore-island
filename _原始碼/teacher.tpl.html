<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>老師頁面｜數學探索島</title>
<style>
:root{
  color-scheme:light dark;
  --paper:#F5F2E8; --card:#FFFDF8; --edge:#DFD6C4; --edge-soft:#EBE3D4;
  --ink:#23282D; --ink-2:#5C554A; --ink-3:#847B6C; --indigo:#2E5A88; --indigo-soft:#E7EEF6;
  --orange:#C1652F; --orange-soft:#FBEEE1; --green:#4A7C59; --green-soft:#E7F0E9; --crimson:#B23A3A;
  --serif:"Noto Serif TC",'Songti TC',serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#161A1E; --card:#1F252B; --edge:#333C45; --edge-soft:#2A323A;
  --ink:#E7E2D6; --ink-2:#B3AC9E; --ink-3:#8B857A; --indigo:#82ADDC; --indigo-soft:#1E2C3B;
  --orange:#E28B52; --orange-soft:#3A2718; --green:#82B893; --green-soft:#1D2C22; --crimson:#D66B6B;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.65;font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
header{padding:34px 0 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px}
h1{font-family:var(--serif);font-size:32px;margin:0}
.who{margin-left:auto;font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:center}
button,select,textarea,input{font:inherit;color:var(--ink)}
button{padding:6px 14px;border:1px solid var(--edge);border-radius:5px;background:var(--card);cursor:pointer;font-weight:600}
button.p{background:var(--indigo);border-color:var(--indigo);color:var(--card)}
button:disabled{opacity:.4;cursor:default}
select{padding:6px 10px;border:1px solid var(--edge);border-radius:5px;background:var(--card)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--edge);margin:6px 0 18px}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--ink-3)}
.tabs button.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:6px;padding:16px 18px;margin:0 0 16px}
.muted{color:var(--ink-3);font-size:13.5px}
textarea{width:100%;min-height:150px;padding:10px;border:1px solid var(--edge);border-radius:5px;background:var(--paper);font-family:ui-monospace,Menlo,monospace;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--edge-soft);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--ink-3);letter-spacing:.06em;position:sticky;top:0;background:var(--card)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--edge);vertical-align:-2px}
.dot.half{border-color:var(--indigo);background:linear-gradient(90deg,var(--indigo) 50%,transparent 50%)}
.dot.ok{border-color:var(--green);background:var(--green)}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--edge);color:var(--ink-3);white-space:nowrap}
.tag.ok{border-color:var(--green);color:var(--green)}
.tag.no{border-color:var(--orange);color:var(--orange)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin:6px 0 4px}
.bars i{display:block;height:14px;border-radius:3px;background:var(--indigo)}
.pred{color:var(--indigo)} .obs{color:var(--ink)}
.empty{color:var(--ink-3)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.scroll{overflow-x:auto}
.gate{padding:60px 0;text-align:center}
.sum th.u{writing-mode:vertical-rl;letter-spacing:0;font-size:12px;padding:6px 2px;text-align:left;white-space:nowrap;min-width:26px}
.sum td.c{padding:3px 2px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums;min-width:26px}
.sum td.c span{display:block;border-radius:3px;padding:3px 0;color:var(--ink-2)}
.sum td.c .z{color:var(--edge)}
.sum td.c .s{background:var(--green);color:var(--card);font-weight:700}
.sum tfoot td{font-size:11.5px;color:var(--ink-3);text-align:center;border-top:2px solid var(--edge)}
.sum td.nm,.sum th.nm{position:sticky;left:0;background:var(--card);white-space:nowrap}
.time{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.legend i{display:inline-block;width:22px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>老師頁面</h1><span class="muted">數學探索島</span><span class="who" id="who"></span></header>
<div id="app"><p class="gate muted">載入中…</p></div>
</div>
<script>window.ISLAND_UNITS = /*CFGS*/[];</script>
<script src="firebase-config.js"></script>
<script type="module">
import { auth, db, login, logout, emailOf, TEACHER, ROLES, staffRole } from "./island-cloud.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { collection, getDocs, getDoc, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const U = window.ISLAND_UNITS;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = $("app");
let myRole = "", staffList = [];
let roster = [], uidOf = {}, tab = "sum", cls = "", unitSlug = U[0] && U[0].slug, station = "", live = {}, unsubs = [];

onAuthStateChanged(auth, async u => {
  if (!u) {
    $("who").innerHTML = "";
    app.innerHTML = '<div class="gate"><p>用老師的學校帳號登入。</p><button class="p" id="li">用 Google 登入</button></div>';
    $("li").onclick = () => login().catch(e => alertBox(e.code || e.message));
    return;
  }
  myRole = await staffRole(u);
  $("who").innerHTML = esc(u.email) + (myRole ? ' <span class="tag ok">' + ROLES[myRole] + '</span>' : "") + ' <button id="lo">登出</button>';
  $("lo").onclick = () => logout();
  if (!myRole) { app.innerHTML = '<p class="gate">這個頁面只有老師帳號能用。要開通請找管理者加入。</p>'; return; }
  await loadAll();
  draw();
});
function alertBox(m) { app.insertAdjacentHTML("afterbegin", '<div class="card" style="border-color:var(--orange)">' + esc(m) + "</div>"); }

async function loadAll() {
  const rs = await getDocs(collection(db, "roster"));
  roster = []; rs.forEach(d => roster.push({ email: d.id, ...d.data() }));
  roster.sort((a, b) => String(a.cls || "").localeCompare(String(b.cls || "")) || (+a.seat || 0) - (+b.seat || 0));
  const rec = await getDocs(collection(db, "records"));
  uidOf = {}; rec.forEach(d => { const e = (d.data().email || "").toLowerCase(); if (e) uidOf[e] = d.id; });
}

function draw() {
  const tabs = [["sum", "跨章總表"], ["rec", "單章紀錄"]];
  if (myRole !== "viewer") tabs.push(["ros", "學生名單"]);
  if (myRole === "admin") tabs.push(["staff", "老師帳號"]);
  if (!tabs.some(t => t[0] === tab)) tab = "sum";
  app.innerHTML = '<div class="tabs">' + tabs.map(t => '<button data-t="' + t[0] + '">' + t[1] + "</button>").join("") + '</div><div id="pane"></div>';
  if (myRole === "admin") app.querySelector(".tabs").insertAdjacentHTML("beforeend", '<a href="upload.html" style="margin-left:auto;align-self:center;font-size:13.5px;color:var(--indigo)">教材上傳</a>');
  app.querySelectorAll(".tabs button").forEach(b => { b.classList.toggle("on", b.dataset.t === tab); b.onclick = () => { tab = b.dataset.t; draw(); }; });
  if (tab === "ros") drawRoster(); else if (tab === "staff") drawStaff(); else if (tab === "sum") drawSummary(); else drawRecords();
}

/* ---------- 老師帳號（只有管理者） ---------- */
async function loadStaff() {
  staffList = [];
  try { const qs = await getDocs(collection(db, "staff")); qs.forEach(d => staffList.push({ email: d.id, ...d.data() })); } catch (e) {}
  staffList.sort((a, b) => a.email.localeCompare(b.email));
}
const roleSel = (id, v) => '<select id="' + id + '">' + Object.keys(ROLES).map(k => '<option value="' + k + '"' + (k === v ? " selected" : "") + ">" + ROLES[k] + "</option>").join("") + "</select>";
async function drawStaff() {
  const p = $("pane");
  p.innerHTML = '<p class="muted">讀取中…</p>';
  await loadStaff();
  if (tab !== "staff") return;
  let h = '<div class="card"><b>加入老師帳號</b><p class="muted">管理者：全部權限，包括管理老師帳號。老師：看全班紀錄、管學生名單、設定加入碼。檢視：只能看全班紀錄。<br>對方用這個 Google 帳號登入老師頁面就能用；同一個帳號再加一次就是更新層級。</p>' +
    '<div class="row"><input id="se" placeholder="Google 帳號 email" size="28" autocomplete="off" style="font:inherit;padding:5px 8px"> <input id="sn" placeholder="稱呼（可空白）" size="10" style="font:inherit;padding:5px 8px"> ' + roleSel("sr", "teacher") + ' <button class="p" id="sadd">加入</button><span class="muted" id="smsg"></span></div></div>';
  h += '<div class="card"><b>老師帳號（' + (staffList.length + 1) + ' 個）</b><div class="scroll"><table><thead><tr><th>帳號</th><th>稱呼</th><th>層級</th><th></th></tr></thead><tbody>' +
    '<tr><td>' + esc(TEACHER) + '</td><td></td><td>管理者 <span class="muted">（主帳號，不能移除）</span></td><td></td></tr>';
  staffList.forEach((r, i) => {
    h += "<tr><td>" + esc(r.email) + "</td><td>" + esc(r.name || "") + "</td><td>" + roleSel("r" + i, r.role) + '</td><td><button data-sdel="' + i + '">移除</button></td></tr>';
  });
  h += "</tbody></table></div></div>";
  p.innerHTML = h;
  const msg = $("smsg");
  $("sadd").onclick = async () => {
    const email = $("se").value.trim().toLowerCase(), name = $("sn").value.trim().slice(0, 20), role = $("sr").value;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = "email 格式不對"; return; }
    if (email === TEACHER) { msg.textContent = "這是主帳號，本來就是管理者"; return; }
    try { await setDoc(doc(db, "staff", email), name ? { role, name } : { role }); drawStaff(); }
    catch (e) { msg.textContent = "加入失敗（" + (e.code || e.message) + "）"; }
  };
  staffList.forEach((r, i) => {
    $("r" + i).onchange = async e => {
      try { await setDoc(doc(db, "staff", r.email), r.name ? { role: e.target.value, name: r.name } : { role: e.target.value }); }
      catch (err) { alertBox("改層級失敗（" + (err.code || err.message) + "）"); }
      if (r.email === emailOf(auth.currentUser)) location.reload(); else drawStaff();
    };
  });
  p.querySelectorAll("[data-sdel]").forEach(b => {
    let armed = false;
    b.onclick = async () => {
      if (!armed) { armed = true; b.textContent = "確定？"; setTimeout(() => { armed = false; b.textContent = "移除"; }, 3000); return; }
      const r = staffList[+b.dataset.sdel];
      try { await deleteDoc(doc(db, "staff", r.email)); } catch (e) { alertBox("移除失敗（" + (e.code || e.message) + "）"); }
      if (r.email === emailOf(auth.currentUser)) location.reload(); else drawStaff();
    };
  });
}

/* ---------- 共用：班級篩選、時間、CSV ---------- */
const shown = () => roster.filter(r => !cls || String(r.cls) === cls);
function clsSelect() {
  const cs = [...new Set(roster.map(r => String(r.cls || "")))].filter(Boolean).sort();
  return '<select id="cs"><option value="">全部班級（' + roster.length + ' 人）</option>' + cs.map(c => '<option value="' + esc(c) + '"' + (c === cls ? " selected" : "") + ">" + esc(c) + " 班（" + roster.filter(r => String(r.cls) === c).length + " 人）</option>").join("") + "</select>";
}
function bindCls(redraw) { const e = $("cs"); if (e) e.onchange = ev => { cls = ev.target.value; redraw(); }; }
const pad = n => String(n).padStart(2, "0");
function fmt(iso, full) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const md = (d.getMonth() + 1) + "/" + d.getDate(), hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (full) return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + hm;
  return (d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + "/" : "") + md + " " + hm;
}
function ago(iso) {
  if (!iso) return "";
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 1) return "剛剛"; if (m < 60) return Math.floor(m) + " 分鐘前";
  if (m < 1440) return Math.floor(m / 60) + " 小時前"; if (m < 1440 * 14) return Math.floor(m / 1440) + " 天前";
  return fmt(iso);
}
function downloadCSV(name, rows) {
  const q = v => { const t = String(v ?? ""); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const blob = new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const today = () => { const d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); };
/* 同一章號有好幾份時加 a、b、c 區分 */
const UL = (() => { const seen = {}, cnt = {}; U.forEach(u => cnt[u.chap] = (cnt[u.chap] || 0) + 1);
  return U.map(u => { seen[u.chap] = (seen[u.chap] || 0) + 1; return u.chap + (cnt[u.chap] > 1 ? "abcdefg"[seen[u.chap] - 1] : ""); }); })();

/* ---------- 跨章總表 ---------- */
let allUnits = null, loadingAll = false;   // email -> { slug -> {n, nd, q, qd, updated, stampAt} }
async function loadUnits() {
  loadingAll = true; allUnits = null;
  const out = {};
  await Promise.all(roster.map(async r => {
    const uid = uidOf[r.email]; if (!uid) return;
    try {
      const qs = await getDocs(collection(db, "records", uid, "units"));
      const m = {};
      qs.forEach(d => { const x = d.data(); m[d.id] = { n: x.n || 0, nd: x.nd || 0, q: x.q || 0, qd: x.qd || 0, updated: x.updated || "", stampAt: x.stampAt || "" }; });
      out[r.email] = m;
    } catch (e) { out[r.email] = {}; }
  }));
  allUnits = out; loadingAll = false;
}
function lastOf(m) { let t = ""; Object.values(m || {}).forEach(x => { if ((x.updated || "") > t) t = x.updated; }); return t; }
function cell(x, u) {
  const n = x && x.n || Object.keys(u.stations).length, nd = x ? x.nd : 0;
  if (x && x.stampAt) return { cls: "s", txt: "✓", bg: "" };
  if (!x || (!nd && !x.qd)) return { cls: "z", txt: "·", bg: "" };
  const a = Math.round(15 + 45 * nd / n);
  return { cls: "", txt: nd + "/" + n, bg: "background:color-mix(in srgb,var(--indigo) " + a + "%,transparent);color:var(--ink)" };
}
async function drawSummary() {
  const p = $("pane");
  p.innerHTML = '<div class="row">' + clsSelect() + '<button id="rf2">重新整理</button><button id="csv1">匯出 CSV（Excel 可開）</button><span class="muted" id="smsg"></span></div><div id="sbody"><p class="muted">讀取全班 ' + roster.length + ' 人的紀錄中…</p></div>';
  bindCls(drawSummary);
  $("rf2").onclick = async () => { await loadAll(); await loadUnits(); if (tab === "sum") drawSummary(); };
  $("csv1").onclick = exportSummary;
  if (!allUnits) { if (!loadingAll) await loadUnits(); else return; }
  if (tab === "sum") drawSummaryBody();
}
function drawSummaryBody() {
  const b = $("sbody"); if (!b || !allUnits) return;
  const R = shown();
  let h = '<div class="card scroll sum"><table><thead><tr><th class="nm">班級 座號 姓名</th>' +
    U.map((u, i) => '<th class="u" title="' + esc(u.chap + "　" + u.title) + '">' + esc(UL[i]) + "</th>").join("") +
    "<th>蓋章</th><th>最後活動</th></tr></thead><tbody>";
  const stamped = U.map(() => 0), started = U.map(() => 0);
  R.forEach(r => {
    const m = allUnits[r.email];
    h += '<tr><td class="nm">' + esc(r.cls) + " " + esc(String(r.seat).padStart(2, "0")) + " " + esc(r.name) + "</td>";
    if (!uidOf[r.email]) { h += '<td colspan="' + (U.length + 2) + '" class="empty">還沒登入過</td></tr>'; return; }
    let st = 0;
    U.forEach((u, i) => {
      const x = m && m[u.slug], c = cell(x, u);
      if (x && x.stampAt) { st++; stamped[i]++; }
      if (x && (x.nd || x.qd || x.stampAt)) started[i]++;
      const tip = u.chap + "　" + u.title + (x ? "\n探索站 " + x.nd + "／" + x.n + "，判斷題 " + x.qd + "／" + x.q + (x.stampAt ? "\n蓋章 " + fmt(x.stampAt, 1) : "") + (x.updated ? "\n最後存檔 " + fmt(x.updated, 1) : "") : "\n還沒開始");
      h += '<td class="c" title="' + esc(tip) + '"><span class="' + c.cls + '" style="' + c.bg + '">' + c.txt + "</span></td>";
    });
    const lt = lastOf(m);
    h += "<td><b>" + st + "</b></td><td class=\"time\" title=\"" + esc(fmt(lt, 1)) + "\">" + esc(ago(lt)) + "</td></tr>";
  });
  const N = R.length;
  h += '</tbody><tfoot><tr><td class="nm" style="text-align:left">蓋章／有動作</td>' + U.map((_, i) => "<td>" + stamped[i] + "<br>" + started[i] + "</td>").join("") + "<td></td><td></td></tr></tfoot></table>" +
    '<p class="muted legend" style="margin-top:10px"><span><i style="border:1px solid var(--edge)"></i>還沒開始</span><span><i style="background:color-mix(in srgb,var(--indigo) 30%,transparent)"></i>做了幾站（顏色越深越多）</span><span><i style="background:var(--green)"></i>✓ 已蓋章</span><span>滑鼠停在格子上看判斷題、蓋章與存檔時間；點欄位標題的章看單章紀錄。共 ' + N + ' 人。</span></p></div>';
  b.innerHTML = h;
  b.querySelectorAll("th.u").forEach((th, i) => { th.style.cursor = "pointer"; th.onclick = () => { unitSlug = U[i].slug; station = ""; tab = "rec"; draw(); }; });
}
function exportSummary() {
  if (!allUnits) return;
  const head = ["班級", "座號", "姓名", "帳號", "蓋章章數", "最後活動"];
  U.forEach((u, i) => head.push(UL[i] + " " + u.title + "｜探索站", UL[i] + "｜判斷題", UL[i] + "｜蓋章時間"));
  const rows = [head];
  shown().forEach(r => {
    const m = allUnits[r.email] || {};
    const row = [r.cls, r.seat, r.name, r.email, Object.values(m).filter(x => x.stampAt).length, fmt(lastOf(m), 1)];
    U.forEach(u => { const x = m[u.slug]; row.push(x ? x.nd + "／" + x.n : "", x ? x.qd + "／" + x.q : "", x && x.stampAt ? fmt(x.stampAt, 1) : ""); });
    rows.push(row);
  });
  downloadCSV("探索島_跨章總表" + (cls ? "_" + cls : "") + "_" + today() + ".csv", rows);
  $("smsg").textContent = "✓ 已下載 " + (rows.length - 1) + " 人";
}

/* ---------- 名單 ---------- */
function parseLines(txt) {
  const out = [], bad = [];
  txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(l => {
    const f = l.split(/[,\t，]+|\s{2,}|\s(?=\S+@)/).map(x => x.trim()).filter(Boolean);
    const email = (f.find(x => x.includes("@")) || "").toLowerCase();
    const rest = f.filter(x => !x.includes("@"));
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || rest.length < 1) { bad.push(l); return; }
    let cls = "", seat = "", name = "";
    if (rest.length >= 3) [cls, seat, name] = rest; else if (rest.length === 2) [seat, name] = rest; else name = rest[0];
    out.push({ email, cls, seat: seat === "" ? "" : (isNaN(+seat) ? seat : +seat), name });
  });
  return { out, bad };
}
let joinCode = null;
async function loadCode() {
  try { const d = await getDoc(doc(db, "config", "join")); joinCode = d.exists() ? (d.data().code || "") : ""; } catch (e) { joinCode = ""; }
}
function drawRoster() {
  const p = $("pane");
  let h = '<div class="card"><div class="row"><b>加入碼</b><span class="muted">學生第一次登入時要輸入這組碼，才會自己加入名單。上課時口頭說或寫在黑板，不要印在學習單上。換了新碼，舊碼就不能用，已經加入的學生不受影響。</span></div>' +
    '<div class="row" style="margin-top:8px"><span>目前：<b id="jc">' + (joinCode === null ? "讀取中…" : joinCode ? esc(joinCode) : "還沒設定（學生沒辦法自己加入）") + '</b></span>' +
    '<input id="jnew" placeholder="新的加入碼" size="14" autocomplete="off" style="font:inherit;padding:5px 8px"> <button class="p" id="jset">設定</button><button id="jrand">隨機產生</button><span class="muted" id="jmsg"></span></div></div>';
  h += '<div class="card"><b>加入或更新學生</b><p class="muted">一行一個學生：班級、座號、姓名、Google 帳號，用逗號或 Tab 隔開（可以直接從試算表複製貼上）。同一個帳號再貼一次就是更新。<br>例：801, 3, 王小明, s1100003@cnc.km.edu.tw</p>' +
    '<textarea id="ta" placeholder="801, 3, 王小明, s1100003@cnc.km.edu.tw"></textarea><div class="row" style="margin-top:10px"><button class="p" id="add">加入名單</button><span class="muted" id="msg"></span></div></div>';
  h += '<div class="card"><div class="row"><b>名單（' + roster.length + ' 人）</b><span class="muted">學生第一次登入時輸入加入碼，會自己填班級、座號、姓名加入這裡（標「自己加入」）；填錯可以在上面貼一行同帳號的資料蓋過去。</span></div><div class="scroll"><table><thead><tr><th>班級</th><th>座號</th><th>姓名</th><th>帳號</th><th>登入過</th><th></th></tr></thead><tbody>';
  roster.forEach((r, i) => {
    h += "<tr><td>" + esc(r.cls) + "</td><td>" + esc(r.seat) + "</td><td>" + esc(r.name) + (r.self ? ' <span class="tag">自己加入</span>' : "") + "</td><td>" + esc(r.email) + "</td><td>" +
      (uidOf[r.email] ? '<span class="tag ok">是</span>' : '<span class="tag">還沒</span>') + '</td><td><button data-del="' + i + '">移出</button></td></tr>';
  });
  h += "</tbody></table></div></div>";
  p.innerHTML = h;
  if (joinCode === null) loadCode().then(() => { if (tab === "ros") drawRoster(); });
  $("jrand").onclick = () => { const a = "abcdefghjkmnpqrstuvwxyz23456789"; let c = ""; for (let i = 0; i < 6; i++) c += a[Math.floor(Math.random() * a.length)]; $("jnew").value = c; };
  $("jset").onclick = async () => {
    const c = $("jnew").value.trim();
    if (c.length < 4 || c.length > 30) { $("jmsg").textContent = "加入碼請用 4～30 個字"; return; }
    try { await setDoc(doc(db, "config", "join"), { code: c }); joinCode = c; $("jc").textContent = c; $("jnew").value = ""; $("jmsg").textContent = "✓ 已更新"; }
    catch (e) { $("jmsg").textContent = "設定失敗（" + (e.code || e.message) + "），確認權限規則已發布"; }
  };
  const ta = $("ta"), msg = $("msg");
  ta.oninput = () => { const { out, bad } = parseLines(ta.value); msg.textContent = out.length + " 人可加入" + (bad.length ? "，" + bad.length + " 行看不懂：" + bad.slice(0, 2).join("／") : ""); };
  $("add").onclick = async () => {
    const { out, bad } = parseLines(ta.value);
    if (!out.length) { msg.textContent = "沒有可加入的資料"; return; }
    $("add").disabled = true; msg.textContent = "寫入中…";
    let ok = 0, fail = 0;
    for (const r of out) {
      try { await setDoc(doc(db, "roster", r.email), { cls: String(r.cls), seat: r.seat, name: r.name }); ok++; } catch (e) { fail++; }
    }
    await loadAll(); drawRoster();
    $("msg").textContent = "加入／更新 " + ok + " 人" + (fail ? "，失敗 " + fail : "") + (bad.length ? "，略過 " + bad.length + " 行" : "");
  };
  p.querySelectorAll("[data-del]").forEach(b => {
    let armed = false;
    b.onclick = async () => {
      if (!armed) { armed = true; b.textContent = "確定？"; setTimeout(() => { armed = false; b.textContent = "移出"; }, 3000); return; }
      const r = roster[+b.dataset.del];
      await deleteDoc(doc(db, "roster", r.email));
      await loadAll(); drawRoster();
    };
  });
}

/* ---------- 全班紀錄 ---------- */
function subscribe() {
  unsubs.forEach(f => f()); unsubs = []; live = {};
  roster.forEach(r => {
    const uid = uidOf[r.email];
    if (!uid) return;
    unsubs.push(onSnapshot(doc(db, "records", uid, "units", unitSlug), d => {
      try { live[r.email] = d.exists() ? JSON.parse(d.data().data) : null; } catch (e) { live[r.email] = null; }
      if (tab === "rec") drawRecordsBody();
    }, () => {}));
  });
}
function drawRecords() {
  const p = $("pane");
  p.innerHTML = '<div class="row"><select id="us">' + U.map(u => '<option value="' + u.slug + '"' + (u.slug === unitSlug ? " selected" : "") + ">" + esc(u.chap + "　" + u.title) + "</option>").join("") +
    '</select><select id="ss"><option value="">全部站（總覽）</option>' + Object.keys(cfg().stations).map((id, i) => '<option value="' + id + '"' + (id === station ? " selected" : "") + ">第 " + (i + 1) + " 站</option>").join("") +
    '<option value="quiz"' + (station === "quiz" ? " selected" : "") + '>判斷題</option></select>' + clsSelect() + '<button id="rf">重新整理名單</button><button id="csv2">匯出這一章 CSV</button><span class="muted" id="rmsg">學生一存檔，這裡就會更新。</span></div><div id="body"></div>';
  bindCls(drawRecordsBody);
  $("csv2").onclick = exportUnit;
  $("us").onchange = e => { unitSlug = e.target.value; station = ""; drawRecords(); };
  $("ss").onchange = e => { station = e.target.value; drawRecordsBody(); };
  $("rf").onclick = async () => { await loadAll(); drawRecords(); };
  subscribe();
  drawRecordsBody();
}
const cfg = () => U.find(u => u.slug === unitSlug);
function predText(c, s) {
  const parts = [];
  if (c.opts && s.opts && s.opts.length) parts.push(s.opts.map(i => c.opts[i]).join("、"));
  else if (c.opts && c.multi && s.locked) parts.push("一個都沒選");
  if ((s.pred || "").trim()) parts.push(s.pred.trim());
  return parts.join("；");
}
function drawRecordsBody() {
  const b = $("body"); if (!b) return;
  const C = cfg(), ids = Object.keys(C.stations);
  const people = shown().map(r => ({ r, S: live[r.email], in: !!uidOf[r.email] }));
  if (!station) {
    let h = '<div class="card scroll"><table><thead><tr><th>班級</th><th>座號</th><th>姓名</th>' + ids.map((_, i) => "<th>" + (i + 1) + "</th>").join("") + "<th>判斷題</th><th>章</th><th>最後存檔</th></tr></thead><tbody>";
    people.forEach(({ r, S, in: inn }) => {
      h += "<tr><td>" + esc(r.cls) + "</td><td>" + esc(r.seat) + "</td><td>" + esc(r.name) + "</td>";
      if (!inn) { h += '<td colspan="' + (ids.length + 3) + '" class="empty">還沒登入過</td></tr>'; return; }
      ids.forEach(id => { const s = S && S.st && S.st[id]; h += '<td><span class="dot' + (s && s.done ? " ok" : s && s.locked ? " half" : "") + '"></span></td>'; });
      const qd = C.quiz.filter((_, i) => S && S.quiz && S.quiz[i] && S.quiz[i].ok).length;
      const first = C.quiz.filter((q, i) => S && S.quiz && S.quiz[i] && S.quiz[i].tried[0] === q.ans).length;
      h += "<td>" + qd + " ／ " + C.quiz.length + (qd ? '<span class="muted">（一次就對 ' + first + "）</span>" : "") + "</td><td>" + (S && S.stampAt ? '<span class="tag ok" title="' + esc(fmt(S.stampAt, 1)) + '">已蓋章 ' + esc(fmt(S.stampAt)) + "</span>" : "") + '</td><td class="time" title="' + esc(fmt(S && S.updated, 1)) + '">' + esc(ago(S && S.updated)) + "</td></tr>";
    });
    h += '</tbody></table><p class="muted">○ 還沒開始　◐ 寫了預測　● 記錄完成</p></div>';
    b.innerHTML = h; return;
  }
  if (station === "quiz") {
    let h = "";
    C.quiz.forEach((q, i) => {
      const cnt = q.opts.map(() => 0); let n = 0;
      people.forEach(({ S }) => { const t = S && S.quiz && S.quiz[i] && S.quiz[i].tried; if (t && t.length) { cnt[t[0]]++; n++; } });
      h += '<div class="card"><b>第 ' + (i + 1) + " 題　</b>" + esc(q.q) + '<p class="muted">第一次選了什麼（' + n + " 人作答）</p>" + bars(q.opts.map((o, j) => [o + (j === q.ans ? "　✓" : ""), cnt[j]]), n) + "</div>";
    });
    b.innerHTML = h; return;
  }
  const c = C.stations[station];
  let h = '<div class="card"><b>' + esc(c.mode === "predict" ? c.q : "（這站直接操作，沒有預測）") + "</b>";
  if (c.opts) {
    const cnt = c.opts.map(() => 0); let n = 0;
    people.forEach(({ S }) => { const s = S && S.st && S.st[station]; if (s && s.locked) { n++; (s.opts || []).forEach(j => cnt[j]++); } });
    h += '<p class="muted">預測選項（' + n + " 人送出" + (c.multi ? "，可複選" : "") + "）</p>" + bars(c.opts.map((o, j) => [o, cnt[j]]), n);
  }
  h += '<p class="muted" style="margin-top:12px">觀察題：' + esc(c.obs) + "</p></div>";
  h += '<div class="card scroll"><table><thead><tr><th>班級</th><th>座號</th><th>姓名</th><th>預測</th><th>看到的</th><th>最後存檔</th></tr></thead><tbody>';
  people.forEach(({ r, S, in: inn }) => {
    const s = S && S.st && S.st[station];
    const pr = c.mode !== "predict" ? '<span class="empty">—</span>' : s && s.locked ? '<span class="pred">' + esc(predText(c, s)) + "</span>" : '<span class="empty">' + (inn ? "還沒寫" : "還沒登入過") + "</span>";
    const ob = s && s.done ? '<span class="obs">' + esc(s.obs) + "</span>" : '<span class="empty">還沒寫</span>';
    h += "<tr><td>" + esc(r.cls) + "</td><td>" + esc(r.seat) + "</td><td>" + esc(r.name) + "</td><td>" + pr + "</td><td>" + ob + '</td><td class="time" title="' + esc(fmt(S && S.updated, 1)) + '">' + esc(ago(S && S.updated)) + "</td></tr>";
  });
  b.innerHTML = h + "</tbody></table></div>";
}
function exportUnit() {
  const C = cfg(), ids = Object.keys(C.stations), i0 = U.indexOf(C);
  const head = ["班級", "座號", "姓名", "帳號", "完成站數", "判斷題答對", "一次就對", "蓋章時間", "最後存檔"];
  ids.forEach((id, i) => { const c = C.stations[id]; if (c.mode === "predict") head.push("第" + (i + 1) + "站 預測"); head.push("第" + (i + 1) + "站 看到的"); });
  C.quiz.forEach((q, i) => head.push("判斷題" + (i + 1) + " 第一次選"));
  const rows = [head];
  shown().forEach(r => {
    const S = live[r.email];
    if (!uidOf[r.email] || !S) { rows.push([r.cls, r.seat, r.name, r.email, uidOf[r.email] ? "還沒開始" : "還沒登入過"]); return; }
    const st = S.st || {}, qz = S.quiz || {};
    const row = [r.cls, r.seat, r.name, r.email,
      ids.filter(id => st[id] && st[id].done).length + "／" + ids.length,
      C.quiz.filter((_, i) => qz[i] && qz[i].ok).length + "／" + C.quiz.length,
      C.quiz.filter((q, i) => qz[i] && qz[i].tried && qz[i].tried[0] === q.ans).length,
      fmt(S.stampAt, 1), fmt(S.updated, 1)];
    ids.forEach(id => { const c = C.stations[id], s = st[id];
      if (c.mode === "predict") row.push(s && s.locked ? predText(c, s) : "");
      row.push(s && s.done ? (s.obs || "") : ""); });
    C.quiz.forEach((q, i) => { const t = qz[i] && qz[i].tried; row.push(t && t.length ? q.opts[t[0]] + (t[0] === q.ans ? "（對）" : "") : ""); });
    rows.push(row);
  });
  downloadCSV("探索島_" + UL[i0] + "_" + C.title + (cls ? "_" + cls : "") + "_" + today() + ".csv", rows);
  $("rmsg").textContent = "✓ 已下載 " + (rows.length - 1) + " 人";
}
function bars(rows, n) {
  const m = Math.max(1, ...rows.map(r => r[1]));
  return '<div class="bars">' + rows.map(([t, v]) => "<span>" + esc(t) + '</span><span><i style="width:' + (v / m * 100) + '%"></i></span><span>' + v + "</span>").join("") + "</div>";
}
</script>
</body>
</html>
