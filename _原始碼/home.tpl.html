<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學探索島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#fdfcf8; --ink:#1d1d1d; --ink-2:#555; --ink-3:#8a8a8a;
  --sand:#f1e4c3; --sand-2:#e6d3a3; --grass:#cfe3bf; --sea:#9fbbd1; --red:#c8321e; --blue:#24489a;
  --card:#fffefa; --edge:#b9b5aa;
  --hand:"LXGW WenKai TC","Kaiti TC","KaiTi","STKaiti",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hand);line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 70px}
header{padding:34px 0 6px;text-align:center}
h1{font-size:clamp(40px,7vw,64px);margin:0;letter-spacing:.12em;font-weight:700}
.say{font-size:clamp(16px,2.4vw,20px);color:var(--ink-2);margin:6px 0 0}
.say small{display:block;font-size:14px;color:var(--ink-3);margin-top:2px}
#main{margin-top:14px}
.mapbox{position:relative;overflow-x:auto;border:2.5px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;background:var(--card);padding:6px;margin-top:10px}
svg.map{display:block;width:100%;height:auto;min-width:880px}
.swipe{display:none;text-align:center;font-size:13px;color:var(--ink-3);margin:4px 0 0}
@media (max-width:900px){.swipe{display:block}}
svg.map text{font-family:var(--hand);fill:var(--ink)}
svg.map a{cursor:pointer}
svg.map a:hover .isle{fill:#e3f0d6}
svg.map a:focus-visible{outline:none}
svg.map a:focus-visible .isle{stroke:var(--blue);stroke-width:3.5}
.lab{font-size:15px}
.tiny{font-size:12.5px;fill:var(--ink-2)}
.big{font-size:22px;font-weight:700}
.note{font-size:14px;fill:var(--ink-2)}
.grey text{fill:var(--ink-3)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:18px 0 16px}
.how div{border:2px solid var(--ink);border-radius:14px 225px 14px 255px/255px 14px 225px 14px;padding:14px 18px;background:var(--card)}
.how b{font-size:19px;display:block;margin-bottom:2px}
.how p{margin:0;color:var(--ink-2);font-size:15.5px}
.how a{color:var(--blue)}
footer{margin-top:36px;text-align:center;color:var(--ink-3);font-size:14px}
.isl-auth{font-family:var(--hand)!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>數學探索島</h1>
  <p class="say">一群小島。每座島上有幾台機器，你要先猜它會怎樣，再動手試試看。<small>（猜錯沒關係。猜錯的地方，正是你等一下會看懂的地方。）</small></p>
</header>
<div class="how">
  <div><b>1. 先猜</b><p>每一站先寫下你覺得會發生什麼，寫好了機器才會打開。</p></div>
  <div><b>2. 動手</b><p>拉、點、拖，看機器真的怎麼做，再寫下你看到的。</p></div>
  <div><b>3. 對照</b><p>寫完才看得到那一站的重點，拿來跟你猜的比一比。</p></div>
  <div><b>4. 蓋章</b><p>每站都寫完、最後幾題都答對，那座島就會蓋上章。<a href="passport.html">看看你的本子 →</a></p></div>
</div>
<div id="main"></div>
<p class="swipe">← 地圖可以左右滑 →</p><div class="mapbox"><svg class="map" id="map" viewBox="0 0 1200 900" role="img" aria-label="數學探索島地圖"></svg></div>


</div>

<script>window.ISLAND_MAP = { units: /*UNITS*/[], grades: /*GRADES*/[], plain: /*PLAIN*/{} };</script>
<script src="island-map.js"></script>
<script>
window.ISLAND_PASSPORT = { show: (cloud, name) => { window.__who = name || ""; IslandMap.draw(cloud); } };
IslandMap.draw(null);
</script>
<script src="firebase-config.js"></script>
<script type="module" src="island-cloud.js"></script>
</body>
</html>
