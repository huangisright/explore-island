<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索紀錄本｜探索島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#fdfcf8; --card:#fffefa; --ink:#1d1d1d; --ink-2:#555; --ink-3:#8a8a8a;
  --edge:#b9b5aa; --edge-soft:#dedad0; --grass:#cfe3bf; --sand:#efe8d6;
  --red:#c8321e; --blue:#24489a; --green:#2f7a3a; --orange:#d4472b;
  --indigo:#24489a; --hl:#fff2a8;
  --hand:"LXGW WenKai TC","Kaiti TC","KaiTi","STKaiti",serif;
  --sans:var(--hand);
  --wob:255px 14px 225px 14px/14px 225px 14px 255px;
  --wob2:14px 255px 14px 225px/225px 14px 255px 14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hand);line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 70px}
.top{padding:18px 0 0;font-size:15px}
.top a{color:var(--blue);text-decoration:none}
header{padding:16px 0 10px;text-align:center}
h1{font-size:clamp(36px,6vw,54px);margin:0;letter-spacing:.1em}
.say{margin:2px 0 0;color:var(--ink-2);font-size:17px}
.who{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:6px 22px;margin-top:14px;font-size:18px}
.who input{font:inherit;font-size:20px;width:7.5em;text-align:center;padding:0 4px 2px;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink)}
.who input:focus{outline:none;background:var(--hl)}
.tally{color:var(--ink-2);font-size:16px}
.tally b{color:var(--red);font-size:24px}
.mapbox{position:relative;overflow-x:auto;border:2.5px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;background:var(--card);padding:6px;margin-top:10px}
svg.map{display:block;width:100%;height:auto;min-width:880px}
.swipe{display:none;text-align:center;font-size:13px;color:var(--ink-3);margin:4px 0 0}
@media (max-width:900px){.swipe{display:block}}
svg.map text{font-family:var(--hand);fill:var(--ink)}
svg.map a{cursor:pointer}
svg.map a:hover .isle{fill:#e3f0d6}
svg.map a:focus-visible{outline:none}
svg.map a:focus-visible .isle{stroke:var(--blue);stroke-width:3.5}
svg.map .lab{font-size:15px}
svg.map .tiny{font-size:12.5px;fill:var(--ink-2)}
svg.map .big{font-size:22px;font-weight:700}
svg.map .note{font-size:14px;fill:var(--ink-2)}
.grey text{fill:var(--ink-3)}
.note{margin:38px auto 0;max-width:40em;text-align:center;font-size:15px;color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;margin-top:10px;font-size:14.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:14px;border:1.8px solid var(--ink);border-radius:var(--wob2)}
.legend .st{color:var(--red);font-weight:700}
.isl-auth{font-family:var(--hand)!important;border:2px solid var(--ink)!important;border-radius:var(--wob)!important}
.isl-auth button{border:2px solid var(--ink)!important;border-radius:var(--wob2)!important;background:var(--card)!important;color:var(--ink)!important}
@media print{ .note,.top,.isl-auth{display:none!important} .who input{border-bottom:1px solid #999} }
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="index.html">← 回到地圖</a></div>
<header>
  <h1>探索紀錄本</h1>
  <p class="say">記你走過哪些島的本子。走完一座島，這裡就會蓋一個章。</p>
  <div class="who"><label>這本是 <input id="nm" type="text" maxlength="20" placeholder="你的名字"> 的</label><span class="tally" id="tally"></span></div>
  <div class="legend">
    <span><i style="background:var(--grass)"></i>能去的島</span>
    <span><i style="border-style:dashed;border-color:var(--edge);background:#efe8d6"></i>橋還沒蓋好</span>
    <span><span class="st">○完成</span>走完的島</span>
  </div>
</header>
<main id="main"></main>
<p class="swipe">← 地圖可以左右滑 →</p><div class="mapbox"><svg class="map" id="map" viewBox="0 0 1200 900" role="img" aria-label="探索紀錄地圖"></svg></div>
<p class="note">沒登入的時候，這本只記在這台電腦裡；用名單上的帳號登入，就會記在雲端，換一台電腦也看得到。在大家一起用的電腦上，用完記得登出。</p>
</div>
<script>window.ISLAND_MAP = { units: /*UNITS*/[], grades: /*GRADES*/[], plain: /*PLAIN*/{} };</script>
<script src="island-map.js"></script>
<script>
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const nm = document.getElementById("nm");
nm.addEventListener("input", () => { if (!nm.readOnly) set("isl:name", nm.value); });
function render(cloud, cname) {
  if (cloud) { nm.value = cname || ""; nm.readOnly = true; } else { nm.value = get("isl:name") || ""; nm.readOnly = false; }
  window.__who = cloud ? (cname || "") : (get("isl:name") || "");
  const open = ISLAND_MAP.units.filter(u => u.open);
  let stamps = 0;
  open.forEach(u => {
    let S = null;
    if (cloud) S = cloud[u.slug]; else { try { S = JSON.parse(get("isl:" + u.slug)); } catch (e) {} }
    if (S && S.stampAt) stamps++;
  });
  document.getElementById("tally").innerHTML = "已經蓋了 <b>" + stamps + "</b> 個章（能去的島有 " + open.length + " 座）";
  IslandMap.draw(cloud, { book: true });
}
window.ISLAND_PASSPORT = { show: render };
render(null);
</script>
<script src="firebase-config.js"></script>
<script type="module" src="island-cloud.js"></script>
</body>
</html>
