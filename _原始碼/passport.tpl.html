<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索紀錄本｜數學探索島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --desk:#ece7da; --paper:#fdfcf8; --card:#fffefa; --ink:#1d1d1d; --ink-2:#555; --ink-3:#8a8a8a;
  --edge:#b9b5aa; --edge-soft:#dedad0; --rule:#cfd9e6; --margin:#e3a59b; --cover:#2f4a3a; --cover-ink:#f6f1e1;
  --red:#c8321e; --blue:#24489a; --green:#2f7a3a; --orange:#d4472b; --indigo:#24489a; --hl:#fff2a8;
  --hand:"LXGW WenKai TC","Kaiti TC","KaiTi","STKaiti",serif;
  --sans:var(--hand);
  --wob:255px 14px 225px 14px/14px 225px 14px 255px;
  --wob2:14px 255px 14px 225px/225px 14px 255px 14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--hand);line-height:1.6;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 70px}
.top{padding:16px 2px 8px;font-size:15px}
.top a{color:var(--blue);text-decoration:none}
a{color:var(--blue)}

/* ---- 封面 ---- */
.cover{position:relative;margin-top:10px;background:var(--cover);color:var(--cover-ink);border-radius:6px 14px 14px 6px;padding:26px 28px 24px 46px;
  box-shadow:0 2px 0 #1e3026, 0 10px 24px rgba(40,34,20,.18)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;border-radius:6px 0 0 6px;background:#243a2d;border-right:1px solid rgba(255,255,255,.14)}
.cover .site{font-size:14px;letter-spacing:.3em;opacity:.8}
.cover h1{font-size:clamp(32px,6vw,46px);line-height:1.2;margin:2px 0 14px;letter-spacing:.12em}
.label{background:var(--paper);color:var(--ink);border-radius:3px;padding:12px 16px 10px;max-width:440px;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 10px;align-items:baseline;font-size:16px}
.label .k{color:var(--ink-3);font-size:13.5px;white-space:nowrap}
.label .v{border-bottom:1.5px solid var(--ink);min-height:1.7em;padding:0 4px;font-size:18px}
.label .wide{grid-column:2 / -1}
.label input{font:inherit;width:100%;border:0;background:transparent;color:var(--ink);padding:0}
.label input:focus{outline:none;background:var(--hl)}
.tally{margin:14px 0 0;font-size:15.5px;opacity:.95}
.tally b{font-size:24px;color:#ffd9a0;margin:0 2px}

/* ---- 索引標籤 ---- */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 0;padding:0 14px}
.tabs{position:relative;z-index:1}
.tabs button{font:inherit;display:block;padding:5px 14px 3px;margin:6px 0 0;background:#f1ede2;border:1.5px solid var(--edge);border-bottom:0;border-radius:8px 8px 0 0;color:var(--ink-3);font-size:15px;cursor:pointer}
.tabs button b{color:var(--red);font-weight:700;margin-left:4px;font-size:13px}
.tabs button:hover{background:var(--hl);color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.tabs button.on{background:var(--paper);color:var(--ink);font-weight:700;font-size:17px;margin-top:0;padding:8px 18px 5px;margin-bottom:-1.5px;border-bottom:1.5px solid var(--paper)}

/* ---- 內頁 ---- */
.page{position:relative;background:var(--paper);border:1.5px solid var(--edge);border-radius:3px;margin:0 0 22px;padding:20px 22px 18px 56px;
  box-shadow:0 1px 0 #fff inset, 0 6px 16px rgba(40,34,20,.10)}
.page::before{content:"";position:absolute;left:40px;top:0;bottom:0;border-left:1.5px solid var(--margin)}
.page::after{content:"";position:absolute;left:13px;top:34px;bottom:34px;width:14px;
  background:radial-gradient(circle at 7px 7px, var(--desk) 0 6px, rgba(0,0,0,.18) 6px 7px, transparent 7.5px) 0 0 / 14px 25% repeat-y}
.page{display:none}
.page.on{display:block}
.page h2{font-size:24px;margin:0 0 2px;letter-spacing:.08em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.page h2 small{font-size:14px;font-weight:400;color:var(--ink-3);letter-spacing:0}
.page .pno{margin-left:auto;font-size:13px;color:var(--ink-3);font-weight:400;letter-spacing:0}

.cols,.row > summary,a.row{display:grid;grid-template-columns:4.4em minmax(0,1fr) auto 4.6em 58px;gap:0 12px;align-items:center}
.cols{font-size:12.5px;color:var(--ink-3);border-bottom:2px solid var(--ink);padding:10px 0 3px;letter-spacing:.06em}
.cols span:nth-child(4),.cols span:nth-child(5){text-align:center}
.row{border-bottom:1px solid var(--rule)}
.row > summary,a.row{min-height:58px;padding:5px 0;cursor:pointer;list-style:none;color:inherit;text-decoration:none}
.row > summary::-webkit-details-marker{display:none}
.row > summary:hover,a.row:hover{background:linear-gradient(transparent 62%, var(--hl) 62% 92%, transparent 92%)}
.row > summary:focus-visible,a.row:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ch{font-size:15px;color:var(--ink-2);white-space:nowrap}
.ti{font-size:18px;font-weight:700;line-height:1.35}
.ti small{display:block;font-size:13px;font-weight:400;color:var(--ink-3)}
.row > summary .ti .o,.row[open] > summary .ti .c{display:none}
.row[open] > summary .ti .o{display:block}
.new .ti{font-weight:400;color:var(--ink-2)}
.boxes{display:flex;flex-wrap:wrap;gap:4px;max-width:150px}
.bx{width:17px;height:17px;border:1.6px solid var(--ink);border-radius:2px;position:relative;background:var(--card)}
.new .bx{border-color:var(--edge)}
.bx.half::after{content:"";position:absolute;left:1px;right:1px;top:50%;border-top:1.8px solid var(--blue);transform:rotate(-45deg)}
.bx.ok::after{content:"";position:absolute;left:3px;top:-3px;width:7px;height:13px;border:solid var(--blue);border-width:0 2.6px 2.6px 0;transform:rotate(40deg)}
.qz{text-align:center;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qz.ok{color:var(--green);font-weight:700}
.new .qz{color:var(--edge)}
.stp{width:52px;height:52px;margin:0 auto;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-size:10.5px;border:1.5px dashed var(--edge);color:var(--edge)}
.stp.on{border:2.6px solid var(--red);color:var(--red);font-weight:700;transform:rotate(-10deg);box-shadow:0 0 0 2px var(--paper) inset, 0 0 0 3px var(--red) inset}
.stp.on b{font-size:15px}
.stp.on i{font-style:normal;font-size:9.5px;font-weight:400}

/* ---- 展開：這一章的紀錄單 ---- */
.sheet{margin:2px 0 14px;padding:0 0 4px}
.sheet table{width:100%;border-collapse:collapse;font-size:15.5px;table-layout:fixed}
.sheet th{font-size:12.5px;font-weight:400;color:var(--ink-3);text-align:left;padding:6px 8px 2px;border-bottom:1.5px solid var(--ink-2);letter-spacing:.06em}
.sheet th:first-child{width:4.6em}
.sheet td{padding:7px 8px;border-bottom:1px dashed var(--edge);vertical-align:top;overflow-wrap:anywhere;white-space:pre-wrap}
.sheet td:first-child{color:var(--ink-2);white-space:nowrap}
.sheet .p{color:var(--blue)}
.sheet .e{color:var(--edge)}
.sheet .foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-top:8px;font-size:14px;color:var(--ink-3)}
.sheet .go{margin-left:auto;font-size:15.5px;text-decoration:none;border:1.8px solid var(--ink);border-radius:var(--wob2);padding:2px 14px;color:var(--ink);background:var(--card)}
.sheet .go:hover{background:var(--hl)}

.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:4px}
.tools button{font:inherit;font-size:15.5px;border:1.8px solid var(--ink);border-radius:var(--wob2);padding:3px 16px;background:var(--card);color:var(--ink);cursor:pointer}
.tools button:hover{background:var(--hl)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.note{margin:22px auto 0;max-width:40em;text-align:center;font-size:14.5px;color:var(--ink-3)}
.isl-auth{font-family:var(--hand)!important;border:1.8px solid var(--ink)!important;border-radius:var(--wob)!important;background:var(--card)!important;margin:0 0 6px!important}
.isl-auth button{border:1.8px solid var(--ink)!important;border-radius:var(--wob2)!important;background:var(--card)!important;color:var(--ink)!important}

@media (max-width:640px){
  .cover{padding:20px 18px 18px 36px}
  .label{grid-template-columns:auto 1fr}
  .label .wide{grid-column:2}
  .page{padding:16px 12px 14px 34px}
  .page::before{left:24px}
  .page::after{display:none}
  .cols{display:none}
  .row > summary,a.row{grid-template-columns:minmax(0,1fr) 58px;grid-template-areas:"ch st" "ti st" "bx st" "qz st";gap:1px 10px;padding:9px 0}
  .ch{grid-area:ch;font-size:13.5px} .ti{grid-area:ti} .boxes{grid-area:bx;max-width:none;margin-top:4px} .qz{grid-area:qz;text-align:left;font-size:13.5px} .stp{grid-area:st}
  .qz::before{content:"判斷題 "}
  .sheet table,.sheet tbody,.sheet tr,.sheet td{display:block}
  .sheet thead{display:none}
  .sheet tr{border-bottom:1px dashed var(--edge);padding:6px 0}
  .sheet td{border:0;padding:1px 4px}
  .sheet td[data-h]::before{content:attr(data-h) "：";color:var(--ink-3);font-size:12.5px}
}
@media print{
  body{background:#fff}
  .top,.isl-auth,.tabs,.tools,.note,.sheet .go{display:none!important}
  .wrap{max-width:none;padding:0}
  .cover{box-shadow:none;background:#fff;color:#000;border:2px solid #000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cover::before{display:none} .tally b{color:#000}
  .page{box-shadow:none;break-inside:auto;margin-bottom:14px}
  .page.has{display:block!important}
  .anyhas .page:not(.has){display:none!important}
  .page::after{display:none}
  .row{break-inside:avoid}
  .stp.on,.bx.ok::after,.bx.half::after{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="index.html">← 回到地圖</a></div>
<main id="main"></main>
<header class="cover">
  <div class="site">數學探索島</div>
  <h1>探索紀錄本</h1>
  <div class="label">
    <span class="k">班級</span><span class="v" id="cls"></span>
    <span class="k">座號</span><span class="v" id="seat"></span>
    <span class="k">姓名</span><span class="v wide"><input id="nm" type="text" maxlength="20" placeholder="寫上名字" aria-label="姓名"></span>
  </div>
  <p class="tally" id="tally"></p>
</header>
<div class="tabs" id="tabs" role="tablist" aria-label="學期"></div>
<div id="pages"></div>
<div class="tools">
  <div class="legend">
    <span><i class="bx"></i>還沒去的站</span>
    <span><i class="bx half"></i>寫了預測</span>
    <span><i class="bx ok"></i>記錄完成</span>
  </div>
  <button id="prt" type="button">列印這本紀錄本</button>
</div>
<p class="note">點有紀錄的那一章，會打開那一章的紀錄單。沒登入的時候，這本只記在這台電腦裡；用名單上的帳號登入，就會記在雲端，換一台電腦也看得到。在大家一起用的電腦上，用完記得登出。</p>
</div>
<script>window.ISLAND_MAP = { units: /*UNITS*/[], grades: /*GRADES*/[], plain: /*PLAIN*/{} };</script>
<script>
(function () {
const { units: UNITS, grades: GRADES } = window.ISLAND_MAP;
const SHORT = { "七年級上": "七上", "七年級下": "七下", "八年級上": "八上", "八年級下": "八下", "九年級上": "九上", "九年級下": "九下" };
const $ = id => document.getElementById(id);
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = iso => { const d = new Date(iso); return isNaN(d) ? "" : (d.getMonth() + 1) + "/" + d.getDate(); };
const ymd = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate(); };
const nm = $("nm");
nm.addEventListener("input", () => { if (!nm.readOnly) set("isl:name", nm.value); });
const openSet = new Set();          // 展開中的章（重畫時保留）
let cur = null;                     // 現在翻到哪一個學期（GRADES 的第幾個）；null = 還沒選過
try { const v = sessionStorage.getItem("isl:tab"); if (v !== null && v !== "") cur = +v; } catch (e) {}
function turn(gi, byUser) {
  cur = gi;
  if (byUser) { try { sessionStorage.setItem("isl:tab", gi); } catch (e) {} }
  document.querySelectorAll("#tabs button").forEach(b => { const on = +b.dataset.g === gi; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; });
  document.querySelectorAll(".page").forEach(pg => pg.classList.toggle("on", pg.id === "p" + gi));
}

/* 一站的狀態與文字。預測的選項文字存在 pt（舊紀錄沒有 pt，就只有寫下的那一句） */
const stOf = (S, id) => (S && S.st && S.st[id]) || {};
const predOf = s => s.pt != null ? s.pt : ((s.opts && s.opts.length ? "選了第 " + s.opts.map(i => i + 1).join("、") + " 個；" : "") + (s.pred || "").trim());
const started = S => !!S && (!!S.stampAt || Object.values(S.st || {}).some(x => x.locked || x.done || (x.pred || "").trim() || (x.obs || "").trim()) || Object.values(S.quiz || {}).some(x => x.tried && x.tried.length));

function rowHtml(u, S) {
  const ids = u.st || [], nq = u.q || 0;
  const boxes = ids.map((id, i) => { const s = stOf(S, id); return '<i class="bx' + (s.done ? " ok" : s.locked ? " half" : "") + '" title="第 ' + (i + 1) + ' 站"></i>'; }).join("");
  const nd = ids.filter(id => stOf(S, id).done).length;
  const qd = S ? Math.min(nq, Object.values(S.quiz || {}).filter(x => x.ok).length) : 0;
  const head = '<span class="ch">' + esc(u.ch.replace(" ", "")) + "</span>";
  const stamp = S && S.stampAt ? '<span class="stp on" title="' + ymd(S.stampAt) + ' 完成"><b>完成</b><i>' + md(S.stampAt) + "</i></span>" : '<span class="stp" aria-hidden="true">蓋章處</span>';
  const boxesWrap = '<span class="boxes" aria-label="探索站 ' + nd + "／" + ids.length + '">' + boxes + "</span>";
  const qz = '<span class="qz' + (nq && qd === nq ? " ok" : "") + '">' + qd + "／" + nq + "</span>";
  if (!started(S)) {
    return '<a class="row new" href="' + u.slug + '.html"><span class="ch">' + esc(u.ch.replace(" ", "")) + '</span><span class="ti">' + esc(u.title) + "<small>還沒去過，點這一列出發</small></span>" + boxesWrap + qz + stamp + "</a>";
  }
  let sheet = '<div class="sheet"><table><thead><tr><th>站</th><th>我的預測</th><th>我看到的</th></tr></thead><tbody>';
  ids.forEach((id, i) => {
    const s = stOf(S, id), p = s.locked ? predOf(s) : "", o = s.done ? (s.obs || "").trim() : "";
    sheet += "<tr><td>第 " + (i + 1) + ' 站</td><td data-h="預測"' + (p ? ' class="p">' + esc(p) : ' class="e">' + ((u.ob || []).includes(id) ? "（這站直接操作）" : "還沒寫")) + '</td><td data-h="看到"' + (o ? ">" + esc(o) : ' class="e">還沒寫') + "</td></tr>";
  });
  sheet += '</tbody></table><div class="foot"><span>探索站 ' + nd + "／" + ids.length + "　判斷題 " + qd + "／" + nq + "</span>" +
    (S.stampAt ? "<span>" + ymd(S.stampAt) + " 蓋章</span>" : S.updated ? "<span>上次寫到 " + ymd(S.updated) + "</span>" : "") +
    '<a class="go" href="' + u.slug + '.html">' + (S.stampAt ? "回這座島看看" : "接著寫") + " →</a></div></div>";
  return '<details class="row" data-slug="' + u.slug + '"' + (openSet.has(u.slug) ? " open" : "") + "><summary>" + head + '<span class="ti">' + esc(u.title) +
    '<small class="c">' + (S.stampAt ? "點開看紀錄單" : "寫到一半，點開看紀錄單") + '</small><small class="o">點一下收起來</small></span>' + boxesWrap + qz + stamp + "</summary>" + sheet + "</details>";
}

function render(cloud, cname, me) {
  if (cloud) { nm.value = cname || ""; nm.readOnly = true; } else { nm.value = get("isl:name") || ""; nm.readOnly = false; }
  $("cls").textContent = cloud && me && me.cls ? me.cls : "";
  $("seat").textContent = cloud && me && me.seat ? me.seat : "";
  const rec = u => { if (cloud) return cloud[u.slug] || null; try { return JSON.parse(get("isl:" + u.slug)); } catch (e) { return null; } };
  const open = UNITS.filter(u => u.open);
  let stamps = 0, stations = 0, tabs = "", pages = "", shown = [], last = ["", null];
  GRADES.forEach((g, gi) => {
    const us = open.filter(u => u.grade === g);
    if (!us.length) return;
    let gs = 0, rows = "", has = false;
    us.forEach(u => {
      const S = rec(u);
      if (S && S.stampAt) { stamps++; gs++; }
      if (started(S)) { has = true; if ((S.updated || S.stampAt || "") >= last[0]) last = [S.updated || S.stampAt || "", gi]; }
      stations += (u.st || []).filter(id => stOf(S, id).done).length;
      rows += rowHtml(u, S);
    });
    shown.push(gi);
    tabs += '<button type="button" role="tab" data-g="' + gi + '" aria-controls="p' + gi + '">' + SHORT[g] + (gs ? "<b>" + gs + " 章</b>" : "") + "</button>";
    pages += '<section class="page' + (has ? " has" : "") + '" role="tabpanel" id="p' + gi + '"><h2>' + esc(g) + "<small>" + us.length + " 座島，蓋了 " + gs + ' 個章</small><span class="pno">第 ' + (gi + 1) + " 頁</span></h2>" +
      '<div class="cols"><span>章</span><span>島名</span><span>探索站</span><span>判斷題</span><span>完成章</span></div>' + rows + "</section>";
  });
  $("tabs").innerHTML = tabs;
  $("pages").innerHTML = pages;
  document.body.classList.toggle("anyhas", !!document.querySelector(".page.has"));
  $("tally").innerHTML = "蓋了<b>" + stamps + "</b>個章，記錄了<b>" + stations + "</b>站（能去的島有 " + open.length + " 座）";
  // 沒選過學期：翻到最近寫過的那一頁；都沒寫過就翻第一頁
  turn(shown.includes(cur) ? cur : (last[1] !== null ? last[1] : shown[0]), false);
  document.querySelectorAll("#tabs button").forEach(b => {
    b.addEventListener("click", () => turn(+b.dataset.g, true));
    b.addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const i = shown.indexOf(cur), n = shown[(i + (e.key === "ArrowRight" ? 1 : shown.length - 1)) % shown.length];
      turn(n, true); document.querySelector('#tabs button[data-g="' + n + '"]').focus();
    });
  });
  document.querySelectorAll("details.row").forEach(d => d.addEventListener("toggle", () => { d.open ? openSet.add(d.dataset.slug) : openSet.delete(d.dataset.slug); }));
}

/* 列印：有紀錄的章全部展開，印完再收回原樣 */
let before = null;
/* 有紀錄的學期都印（都沒有紀錄，就印現在翻到的那一頁） */
window.addEventListener("beforeprint", () => { before = [...document.querySelectorAll("details.row")].map(d => [d, d.open]); before.forEach(([d]) => { d.open = true; }); });
window.addEventListener("afterprint", () => { if (before) before.forEach(([d, o]) => { d.open = o; }); before = null; });
$("prt").addEventListener("click", () => window.print());

window.ISLAND_PASSPORT = { show: render };
render(null);
})();
</script>
<script src="firebase-config.js"></script>
<script type="module" src="island-cloud.js"></script>
</body>
</html>
