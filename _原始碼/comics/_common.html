<!-- 開場翻格漫畫的共用樣式、圖件、程式；build.py 接在各節片段（<slug>.html）後面 -->
<style>
.cm{--cm-bg:#FFFDF8; --cm-edge:#DED3BE; --cm-fg:#2B2621; --cm-mute:#7A6A55; --cm-nar:#6B5B45; --cm-acc:#5939A4;
  --cm-btn:#FFF; --cm-nap-bg:#E4E8F2; --cm-nap-fg:#23345C; --cm-exp-bg:#F1ECE2; --cm-exp-fg:#3A332B; --cm-art:none;
  margin:18px 0 22px; border:1px solid var(--cm-edge); border-radius:16px; background:var(--cm-bg);
  box-shadow:0 4px 16px rgba(60,45,25,.08); overflow:hidden; color:var(--cm-fg)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .cm{--cm-bg:#2A2235; --cm-edge:#45394F; --cm-fg:#F3EADF; --cm-mute:#C3B3CC;
  --cm-nar:#E0D2C2; --cm-acc:#CBB1FF; --cm-btn:#1F1A28; --cm-nap-bg:#2E3550; --cm-nap-fg:#C9D6F2; --cm-exp-bg:#3A3242; --cm-exp-fg:#EDE3D6;
  --cm-art:brightness(.8) saturate(.92); box-shadow:none} }
:root[data-theme="dark"] .cm{--cm-bg:#2A2235; --cm-edge:#45394F; --cm-fg:#F3EADF; --cm-mute:#C3B3CC;
  --cm-nar:#E0D2C2; --cm-acc:#CBB1FF; --cm-btn:#1F1A28; --cm-nap-bg:#2E3550; --cm-nap-fg:#C9D6F2; --cm-exp-bg:#3A3242; --cm-exp-fg:#EDE3D6;
  --cm-art:brightness(.8) saturate(.92); box-shadow:none}
.cm-top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px 10px;
  font-size:13px; letter-spacing:.04em; color:var(--cm-mute); border-bottom:1px dashed var(--cm-edge)}
.cm-top b{font-weight:700; color:var(--cm-fg); letter-spacing:.02em; font-size:14px}
.cm-skip{color:var(--cm-acc); text-decoration:none; font-weight:600; white-space:nowrap}
.cm-skip:hover{text-decoration:underline}
.cm-stage{position:relative; background:#EDE4CF; cursor:pointer; -webkit-tap-highlight-color:transparent}
.cm-stage svg{display:block; width:100%; height:auto; filter:var(--cm-art)}
.cm-say{padding:14px 20px 6px; min-height:8.6em}
.cm-say p{margin:0 0 9px; display:flex; gap:10px; align-items:flex-start; line-height:1.65; font-size:15.5px}
.cm-say p.nar{font-family:"Noto Serif TC","Songti TC",serif; color:var(--cm-nar); font-size:15px}
.cm-who{flex:none; display:inline-flex; align-items:center; gap:5px; min-width:4.6em; padding:1px 8px 1px 4px;
  border-radius:20px; font-size:13px; font-weight:700; line-height:1.9; white-space:nowrap}
.cm-who svg{width:20px; height:20px}
.cm-who.nap{background:var(--cm-nap-bg); color:var(--cm-nap-fg)}
.cm-who.exp{background:var(--cm-exp-bg); color:var(--cm-exp-fg)}
.cm-who.exp svg circle{stroke:currentColor}
.cm-who.nap svg *{fill:currentColor}
.cm-nav{display:flex; align-items:center; gap:10px; padding:6px 14px 14px}
.cm-dots{display:flex; gap:7px; align-items:center; margin-left:auto; padding-right:4px}
.cm-btn{font:inherit; font-size:14px; font-weight:600; border:1px solid var(--cm-edge); background:var(--cm-btn);
  color:var(--cm-fg); border-radius:22px; padding:7px 16px; cursor:pointer}
.cm-btn:hover:not(:disabled){border-color:var(--cm-acc); color:var(--cm-acc)}
.cm-btn:disabled{opacity:.35; cursor:default}
.cm-btn.go{background:#5939A4; border-color:#5939A4; color:#fff}
.cm-btn.go:hover{color:#fff; filter:brightness(1.1)}
.cm-btn:focus-visible,.cm-stage:focus-visible{outline:2px solid #673AC1; outline-offset:2px}
.cm-dots i{width:8px; height:8px; border-radius:50%; background:var(--cm-edge); transition:.25s}
.cm-dots i.on{background:var(--cm-acc); width:20px; border-radius:5px}
.cm-panel[hidden]{display:none}
@media (min-width:900px){
  .cm-panel{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); align-items:center}
  .cm-say{min-height:0; padding:18px 22px}
  .cm-say p{flex-direction:column; gap:4px}
}
.cm .slap{transform-box:fill-box; transform-origin:center}
.cm .cm-panel.on .slap{animation:cm-slap .55s cubic-bezier(.2,.9,.3,1.25) both; animation-delay:var(--d,0s)}
@keyframes cm-slap{from{opacity:0; transform:translateY(-26px) scale(1.22) rotate(-7deg)} to{opacity:1; transform:none}}
.cm .bob{transform-box:fill-box; transform-origin:50% 100%}
.cm .cm-panel.on .bob{animation:cm-bob 2.6s ease-in-out .5s infinite}
@keyframes cm-bob{0%,100%{transform:rotate(0)} 50%{transform:rotate(-2.2deg)}}
.cm .cm-panel.on .cm-say p{animation:cm-in .4s ease both}
.cm .cm-panel.on .cm-say p:nth-child(2){animation-delay:.35s}
.cm .cm-panel.on .cm-say p:nth-child(3){animation-delay:.7s}
@keyframes cm-in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.cm *{animation:none!important; transition:none!important}}
@media (max-width:560px){
  .cm{border-radius:12px; margin:14px 0 18px}
  .cm-top{padding:10px 12px 8px}
  .cm-say{padding:12px 14px 4px; min-height:11em}
  .cm-say p{font-size:15px; flex-direction:column; gap:3px}
  .cm-nav{padding:6px 10px 12px}
  .cm-btn{padding:7px 12px}
}
@media print{.cm{display:none}}
</style>

<script>
(function(){
  var root = document.getElementById("comic");
  if (!root) return;
  var panels = [].slice.call(root.querySelectorAll(".cm-panel"));
  var dots = root.querySelector(".cm-dots"), count = root.querySelector(".cm-count");
  var prev = root.querySelector('[data-go="-1"]'), next = root.querySelector('[data-go="1"]');
  var i = 0;
  panels.forEach(function(){ dots.appendChild(document.createElement("i")); });
  function toLab(){ var t = document.getElementById("lab1"); if (t) t.scrollIntoView({behavior:"smooth", block:"start"}); }
  function show(n){
    i = Math.max(0, Math.min(panels.length - 1, n));
    panels.forEach(function(p, k){ p.hidden = k !== i; p.classList.remove("on"); });
    void panels[i].offsetWidth;            // 重新觸發「貼上去」的動畫
    panels[i].classList.add("on");
    [].forEach.call(dots.children, function(d, k){ d.classList.toggle("on", k === i); });
    prev.disabled = i === 0;
    var last = i === panels.length - 1;
    next.textContent = last ? "到第 1 站 ↓" : "下一格 ›";
    count.textContent = "第 " + (i + 1) + " 格，共 " + panels.length + " 格";
  }
  prev.addEventListener("click", function(){ show(i - 1); });
  next.addEventListener("click", function(){ if (i === panels.length - 1) toLab(); else show(i + 1); });
  root.addEventListener("click", function(e){
    var st = e.target.closest(".cm-stage"); if (!st) return;
    if (i === panels.length - 1) toLab(); else show(i + 1);
  });
  root.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight") { show(i + 1); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { show(i - 1); e.preventDefault(); }
    else if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("cm-stage")) { next.click(); e.preventDefault(); }
  });
  show(0);
})();
</script>
