<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幾何拾光星座圖｜一線數光</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* layout: 星座卡片冊。四個天區，每區一排直式卡片；點一張卡，換成那個星座的專頁。單一夜色主題。 */
:root{
  color-scheme:dark;
  --night:#0b1226; --night-2:#141e3f; --ink:#f5eedb; --ink-soft:#a7b1cb; --faint:#5a668e;
  --gold:#f2c14e; --line:#f5eedb24;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--ink);font:15px/1.6 var(--f-body);min-height:100vh}
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.page{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.topnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.topnav .home{border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:13px;background:#121b36cc}
.topnav .home:hover{background:#ffffff14}
.views{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#121b36cc}
.views a{color:var(--ink-soft);text-decoration:none;font-weight:600;font-size:13px;padding:5px 14px;border-radius:999px}
.views a[aria-current="page"]{background:var(--ink);color:var(--night)}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.top h1{margin:0;font:700 30px/1.2 var(--f-display);letter-spacing:.1em}
.top p{margin:4px 0 0;color:var(--ink-soft);font-size:14px}
.tools{display:flex;gap:10px;align-items:center}
.count{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.count b{color:var(--gold);font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#121b36cc}
.seg[hidden]{display:none}
.seg button{border:0;background:none;color:var(--ink-soft);font-weight:600;font-size:13px;padding:5px 13px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--night)}

.zone{margin-top:30px}
.zone-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px}
.zone-head h2{margin:0;font:700 21px/1.3 var(--f-display);letter-spacing:.12em}
.zone-head span{color:var(--ink-soft);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:18px}

.cardbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;aspect-ratio:3/4.15;border-radius:16px;padding:8px;
  background:linear-gradient(165deg,color-mix(in srgb,var(--c) 22%,var(--night-2)),var(--night) 72%);
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);position:relative;
  transition:transform .25s,box-shadow .25s}
.cardbtn::before{content:"";position:absolute;inset:6px;border:1px solid color-mix(in srgb,var(--c) 28%,transparent);border-radius:11px;pointer-events:none}
.cardbtn:hover,.cardbtn:focus-visible{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 14px 34px -10px color-mix(in srgb,var(--c) 60%,transparent),0 0 0 1px var(--c)}
.cardbtn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cardbtn .no{position:absolute;top:14px;left:16px;font:600 11px var(--f-body);letter-spacing:.14em;color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.cardbtn .kind{position:absolute;top:14px;right:16px;font-size:11px;color:var(--ink-soft);letter-spacing:.1em}
.cardbtn svg{flex:1;min-height:0;width:100%;margin-top:14px}
.cardbtn .txt{padding:0 12px 12px;text-align:center}
.cardbtn .nm{font:700 21px/1.25 var(--f-display);letter-spacing:.06em;color:var(--ink);text-wrap:balance}
.cardbtn .hook{font-size:12.5px;color:var(--ink-soft);margin-top:4px;min-height:2.9em;text-wrap:balance}
.cardbtn .ft{font-size:11px;color:color-mix(in srgb,var(--c) 70%,var(--ink));letter-spacing:.08em;margin-top:6px}
.cardbtn .flag{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:var(--gold);color:var(--night);font-size:11px;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap}
.cardbtn.back{--c:#7d89b5;background:repeating-linear-gradient(45deg,#18224455 0 10px,#0f183455 10px 20px),var(--night-2);align-items:center;justify-content:center;cursor:default}
.cardbtn.back:hover{transform:none;box-shadow:none}
.cardbtn.back .q{font:700 64px/1 var(--f-display);color:var(--faint)}
.cardbtn.back .hint{font-size:12px;color:var(--faint);margin-top:10px;text-align:center;padding:0 18px}

/* 星座圖形 */
.fig .ghost{fill:none;stroke:var(--c);stroke-width:.6;opacity:.38;stroke-dasharray:1.2 2.2;stroke-linecap:round}
.fig .edge{fill:none;stroke:var(--c);stroke-width:1.1;stroke-linecap:round;opacity:.9}
.fig .halo{fill:var(--c);opacity:.22}
.fig .core{fill:#fff}
.fig .st{transition:opacity .2s}
.fig .st.hot .halo{opacity:.7}
.fig.big .st{cursor:pointer}
.fig.big .num{font:700 4px var(--f-body);fill:var(--night);text-anchor:middle;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .cardbtn:hover .halo{animation:tw 1.6s ease-in-out infinite}
  .cardbtn:hover .st:nth-child(2n) .halo{animation-delay:.5s}
  @keyframes tw{50%{opacity:.6}}
}

/* 專頁 */
.back-link{border:0;background:none;color:var(--ink-soft);padding:0;font-size:14px;margin-top:10px}
.back-link:hover{color:var(--ink)}
.detail{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:34px;margin-top:14px;align-items:start}
.plate{border-radius:20px;padding:14px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:radial-gradient(90% 80% at 50% 35%,color-mix(in srgb,var(--c) 22%,var(--night-2)),var(--night) 80%);position:sticky;top:16px}
.plate svg{width:100%;display:block}
.info .eyebrow{font-size:12px;letter-spacing:.14em;color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.info h2{margin:2px 0 0;font:700 40px/1.2 var(--f-display);letter-spacing:.08em;text-wrap:balance}
.info .hook{font:400 19px/1.5 var(--f-display);color:var(--ink);margin:8px 0 0}
.info .meta{color:var(--ink-soft);font-size:13.5px;margin:10px 0 0}
.tl{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#121b3699}
.tl li.hot{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#121b36)}
.tl li.naming{border-color:var(--gold)}
.tl .n{width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--night);font-weight:700;font-size:13px;display:grid;place-items:center}
.tl .t{font:700 17px/1.35 var(--f-display)}
.tl .s{font-size:12.5px;color:var(--ink-soft)}
.tl .s b{color:var(--gold);font-weight:700}
.btn{display:inline-block;border:1px solid var(--line);background:none;border-radius:8px;padding:6px 12px;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:#ffffff14}.btn.on{border-color:var(--gold);color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.row label{font-size:13.5px;color:var(--ink-soft)}
input[type=text]{font:inherit;color:var(--ink);background:#0b122699;border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.note{color:var(--ink-soft);font-size:13px;margin-top:26px}
footer{color:var(--faint);font-size:13px;text-align:center;margin-top:40px}

@media (max-width:760px){
  .page{padding:16px 16px 36px}.top h1{font-size:24px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cardbtn .nm{font-size:17px}.cardbtn .hook{font-size:11.5px}.cardbtn .kind{display:none}
  .detail{grid-template-columns:1fr;gap:18px}.plate{position:static;max-width:340px;margin:0 auto}
  .info h2{font-size:30px}
  .tl li{grid-template-columns:30px minmax(0,1fr)}.tl li .btn{grid-column:2;justify-self:start}
}
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<div class="page">

      </div></div>

  <main id="main"></main>

</div>

<script>
// 節次標題用學生版的中性標題；thm、type 只在教師視角顯示。
const UNITS = [
  { n:1, zh:'一', isle:'不變島',   unit:'面積會加',     c:[165,205], a0:-90,
    s:[['一個不會變的數','維維安尼','C'],['空白搬了家','勾股拼圖',''],['三條線，交在一點','塞瓦（面積法的載體）','']] },
  { n:2, zh:'二', isle:'捷徑島',   unit:'把折線拉直',   c:[455,155], a0:-90,
    s:[['光走的那一條','海倫最短路徑',''],['最短的那一圈','法尼亞諾','B'],['三條路接成一條','費馬點','B']] },
  { n:3, zh:'三', isle:'比值群礁', unit:'比的語言',     c:[745,210], a0:-90,
    s:[['離 A 是離 B 的兩倍','阿氏圓','B'],['從頂點到底邊的那一條','斯圖爾特','A'],['切下來的那一塊','黃金比','B']] },
  { n:4, zh:'四', isle:'交會島',   unit:'乘積等於一',   c:[1035,165], a0:-90,
    s:[['又交在一點','塞瓦當工具','A'],['一條線穿過去','梅涅勞斯',''],['三組對邊，交在一條線上','笛沙格','C']] },
  { n:5, zh:'五', isle:'九點島',   unit:'位似',         c:[1040,525], a0:-90,
    s:[['三個點排成一列','歐拉線','C'],['九個點，一個圓','九點圓','A'],['三個尖，一條線','蒙日定理','B']] },
  { n:6, zh:'六', isle:'雙圓島',   unit:'圓的冪',       c:[750,575], a0:-135,
    s:[['乘起來還是那個數','圓冪','A'],['站在兩個圓中間','根軸與根心','B'],['中點兩邊一樣長','蝴蝶定理','C'],['對角線乘起來','托勒密（反演只示範）','']] },
  { n:7, zh:'七', isle:'迴旋島',   unit:'旋轉的合成',   c:[455,535], a0:-135,
    s:[['轉兩次','旋轉接旋轉','B'],['三個中心','拿破崙',''],['中點又是正三角形','愛可爾斯','B'],['轉回原樣','正三角形的六個動作','']] },
  { n:8, zh:'八', isle:'無尺島',   unit:'丟掉長度',     c:[165,550], a0:-90,
    s:[['畫出來的地板','透視的地板','B'],['一個數都不用算','笛沙格再訪','C'],['圓上六個點','帕斯卡與帕普斯','C'],['翻譯過來的句子','布里昂雄','B'],['最後一題','第 27 章角度題','']] },
];

// 星座＝同一招在不同節次再出現。cls 是課堂名的示例（名字由學生取），acad 是學術名。
// kind: tool 工具／hand 手法／thread 貫串線。when: 1 第一次、2 第二次、N 命名、R 再出現。
const CONS = [
  { id:'area', kind:'tool', color:'#f2c14e', cls:'切三塊', acad:'面積法', sig:'線段比、三線共點、「和為定值」',
    path:[['1-1','1','連三條線，切成三塊'],['1-2','2','同一塊面積，兩種算法'],['1-3','N','面積比換成線段比；命名事件在這裡'],['6-3','R','史蒂文證法：面積比接相交弦'],['8-5','R','拿下第一節牆上的逆命題']] },
  { id:'unfold', kind:'tool', color:'#ff8a5b', cls:'把折線拉直', acad:'反射與旋轉', sig:'最短路徑、兩點同側、正三角形',
    path:[['2-1','1','翻過去，兩段變一條'],['2-2','N','連續翻兩次；命名事件'],['2-3','R','轉 60° 拉直三段：併名還是拆名？'],['7-1','R','轉一次等於翻兩次']] },
  { id:'ratio', kind:'tool', color:'#9bd67a', cls:'不求長度，先求比', acad:'比值', sig:'長度難比的時候',
    path:[['3-1','1','猜直線，答案是圓'],['3-2','2','用比當權重，收掉分點'],['3-3','N','命名事件'],['4-1','R','「一個比只指一點」拿下逆定理'],['6-4','R','★ 正五邊形，黃金比回來']] },
  { id:'cycle', kind:'tool', color:'#5fd0c5', cls:'繞一圈乘起來', acad:'塞瓦與梅涅勞斯', sig:'三點共線、三線共點',
    path:[['1-3','1','塞瓦還只是載體'],['4-1','2','塞瓦當工具，一次收掉各種構型'],['4-2','N','三次並排；命名事件'],['4-3','R','梅氏連用三次'],['5-3','R','梅氏證法當回頭，和縮放並排'],['8-3','R','圓上六個點，對哪個三角形用？']] },
  { id:'half', kind:'tool', color:'#7fb2ff', cls:'縮一半', acad:'位似', sig:'對應邊平行、中點、比例 1:2',
    path:[['4-3','1','【三】(2) 先碰到一次'],['5-1','2','中點三角形：從重心倒過來一半'],['5-2','N','從垂心縮一半收掉九個點；命名後才認證「位似」'],['5-3','R','兩次縮放合起來']] },
  { id:'power', kind:'tool', color:'#c79bff', cls:'乘積不會變', acad:'圓冪', sig:'交點、切線、兩線段相乘',
    path:[['6-1','1','三種構型，一個常數'],['6-2','N','兩個圓的那個數相等；命名事件'],['6-3','R','相交弦'],['6-4','R','把名詞變成動作：反演示範一次'],['8-3','R','和繞一圈乘起來接在一起'],['8-4','R','三條根軸交於一點']] },
  { id:'compose', kind:'tool', color:'#ff9ec7', cls:'把動作接起來看', acad:'變換的合成', sig:'連做兩個動作',
    path:[['5-3','1','縮一半再放大兩倍，不是回到原樣'],['7-1','2','轉兩次還是轉一次'],['7-2','N','三次轉 120° 回原樣；學生取名'],['7-3','R','先平移再轉 60°'],['7-4','R','六個動作的表，接群論']] },
  { id:'space', kind:'tool', color:'#e6e2d6', cls:'搬到空間', acad:'射影觀點', sig:'只有連線與交點、沒有長度',
    path:[['5-3','1','★★★ 三顆球'],['8-1','2','眼睛和一條直線張成平面'],['8-2','N','立體版一句話證完；命名事件']] },
  { id:'dual', kind:'tool', color:'#b8e04a', cls:'點線互換', acad:'對偶', sig:'一句話裡的點和線可以對調',
    path:[['4-2','1','共點和共線並排'],['8-2','2','★★ 逆定理'],['8-4','N','把一個定理翻譯成另一個；命名事件']] },
  { id:'extreme', kind:'hand', color:'#ffc9a8', cls:'極端一點', acad:'極端化（手法）', sig:'不知道從哪裡下手',
    path:[['1-1','N','試角落；手法當堂就能填'],['8-3','R','兩點合成一點，割線變切線'],['8-5','R','牆上那一題的鑰匙']] },
  { id:'sign', kind:'hand', color:'#8fe3ff', cls:'讓正負號管構型', acad:'有向線段（手法）', sig:'圖畫得不一樣就要重證',
    path:[['1-1','1','★ 點跑到三角形外'],['4-2','2','−1 與 ＋1'],['6-1','R','圓內圓外，正負號自己分'],['6-3','R','延長線版只改正負號']] },
  { id:'verify', kind:'thread', color:'#ffffff', cls:'驗證 ≠ 理解', acad:'貫串線', sig:'',
    path:[['1-1','1','電腦確認了一千個點，你還需要什麼？'],['1-3','R','單元一末：勾股定理 400 多種證法'],['4-3','R','單元四末：隔了 140 年的簡潔證法'],['5-3','R','兩個證法並排'],['8-5','R','算出 30° 和畫出那條線，差在哪裡？']] },
];
const WHEN = { '1':'第一次', '2':'第二次', 'N':'命名', 'R':'再出現' };
const KIND = { tool:'工具', hand:'手法', thread:'貫串線' };

// 天區：依「不變量／變換／換一個世界／手法」分。name 給學生看，t 是教師才看到的說明。
const ZONES = [
  { name:'不會變的東西', t:'不變量', ids:['area','ratio','cycle','power'] },
  { name:'讓圖動起來',   t:'變換',   ids:['unfold','half','compose'] },
  { name:'換一個世界看', t:'射影與對偶', ids:['space','dual'] },
  { name:'想事情的手法', t:'手法與貫串線', ids:['extreme','sign','verify'] },
];
// 每個星座的圖形：p 是星星（順序對應遭遇順序），e 是亮線，g 是淡淡的輔助圖（svg 片段），hook 是卡片上的一句話。
const FIG = {
  area:   { hook:'切開來，再加回去。', p:[[50,56],[50,12],[12,84],[88,84],[50,84]], e:[[1,2],[2,3],[3,1],[0,1],[0,2],[0,3]], g:'<path d="M50 56V84"/>' },
  ratio:  { hook:'量不出來，就比一比。', p:[[50,8],[26,88],[74,88],[65,58],[42,70]], e:[[0,1],[1,2],[2,0],[1,3],[2,4]], g:'<path d="M42 70L65 58"/>' },
  cycle:  { hook:'繞三角形一圈，乘起來是 1。', p:[[50,10],[10,86],[90,86],[50,86],[70,48],[30,48]], e:[[0,1],[1,2],[2,0],[0,3],[1,4],[2,5]], g:'<circle cx="50" cy="60.7" r="9"/>' },
  power:  { hook:'怎麼畫，乘起來都是那個數。', p:[[14,37],[84,67],[62,14],[55,88],[58,56],[50,50]], e:[[0,1],[2,3]], g:'<circle cx="50" cy="50" r="38"/><path d="M50 50L58 56"/>' },
  unfold: { hook:'彎的路，翻一下就直了。', p:[[15,25],[51,60],[82,30],[82,90]], e:[[0,1],[1,2]], g:'<path d="M4 60H96M51 60L82 90M82 30V90"/>' },
  half:   { hook:'從一個點看出去，全部縮一半。', p:[[50,8],[8,88],[92,88],[50,61]], e:[[0,1],[1,2],[2,0]], g:'<path d="M29 48H71L50 88ZM50 8V88M8 88L71 48M92 88L29 48"/>' },
  compose:{ hook:'做兩次，等於做一次什麼？', p:[[50,14],[16,74],[84,74],[50,54],[50,92]], e:[[0,1],[1,2],[2,0]], g:'<path d="M50 92L16 34H84Z"/><circle cx="50" cy="54" r="40"/>' },
  space:  { hook:'平面上想不通，就站起來看。', p:[[50,12],[18,78],[84,68]], e:[[0,1],[1,2],[2,0]], g:'<path d="M50 12L58 92L18 78M58 92L84 68"/>' },
  dual:   { hook:'點和線對調，句子還是對的。', p:[[50,24],[24,72],[76,72]], e:[[0,1],[1,2],[2,0]], g:'<path d="M63 0L11 96M37 0L89 96M2 72H98"/>' },
  extreme:{ hook:'先推到最邊邊試試。', p:[[52,58],[32,71],[12,84]], e:[[0,1],[1,2]], g:'<path d="M50 12L12 84H88Z"/>' },
  sign:   { hook:'讓正負號替你分情況。', p:[[8,52],[30,52],[54,52],[90,52]], e:[[0,1],[1,2],[2,3]], g:'<circle cx="42" cy="52" r="27"/><path d="M42 20V84" />' },
  verify: { hook:'確認了一千次，算不算懂？', p:[[33,30],[50,14],[68,30],[51,54],[51,86]], e:[[0,1],[1,2],[2,3]], g:'<path d="M51 54V86"/>' },
};
// 已經做成探索島紀錄版的節（build.py 產生時填入）
const GP_DONE = /*GP_DONE*/[];
const LESSON = {};
UNITS.forEach(u => u.s.forEach(([title, thm, type], i) => { LESSON[u.n + '-' + (i + 1)] = { title, thm, type, isle:u.isle, code:u.zh + '-' + (i + 1),
  url: GP_DONE.includes(`gp-u${u.n}-${i + 1}`) ? `gp-u${u.n}-${i + 1}.html` : `https://huangisright.github.io/GiftedMath/units/gp-u${u.n}-${i + 1}.html` }; }));
const BY = Object.fromEntries(CONS.map((c, i) => [c.id, Object.assign(c, { no:i + 1 })]));

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
// 教師視角的按鈕平常不出現；網址加 #teacher 開一次，這台電腦之後就會記得（和群島共用）。
if (location.hash === '#teacher') store.set('gp-teacher-ok', true);
const teacherOK = store.get('gp-teacher-ok', false);
const st = { mode: teacherOK ? store.get('gps-mode', 'student') : 'student',
  revealed: new Set(store.get('gps-revealed', [])), names: store.get('gps-names', {}), open: null };
const T = () => st.mode === 'teacher';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const $ = s => document.querySelector(s);
const shown = c => T() || st.revealed.has(c.id);
const conName = c => T() ? c.cls : (st.names[c.id] || '還沒取名');
const namingCode = c => { const p = c.path.find(p => p[1] === 'N'); return p ? LESSON[p[0]].code : ''; };

function sparkle(x, y, r){ const k = r * .26; return `M${x} ${y - r}L${x + k} ${y - k}L${x + r} ${y}L${x + k} ${y + k}L${x} ${y + r}L${x - k} ${y + k}L${x - r} ${y}L${x - k} ${y - k}Z`; }
function figure(c, big){
  const f = FIG[c.id];
  return `<svg class="fig ${big ? 'big' : ''}" viewBox="-4 -2 108 104" aria-hidden="${big ? 'false' : 'true'}"><g class="ghost">${f.g}</g>
    ${f.e.map(([a, b]) => `<line class="edge" x1="${f.p[a][0]}" y1="${f.p[a][1]}" x2="${f.p[b][0]}" y2="${f.p[b][1]}"/>`).join('')}
    ${f.p.map(([x, y], i) => `<g class="st" data-i="${i}"><circle class="halo" cx="${x}" cy="${y}" r="${big ? 7 : 6.5}"/>${
      big ? `<circle cx="${x}" cy="${y}" r="3.6" fill="${c.color}"/><text class="num" x="${x}" y="${y + 1.5}">${i + 1}</text>` : `<path class="core" d="${sparkle(x, y, 3.4)}"/>`}</g>`).join('')}</svg>`;
}
function cardHTML(c){
  if (!shown(c)) return `<div class="cardbtn back" role="img" aria-label="還沒翻開的星座"><span class="q">？</span><span class="hint">等大家第三次遇到同一招，這張才會翻開</span></div>`;
  return `<button type="button" class="cardbtn" style="--c:${c.color}" data-open="${c.id}">
    <span class="no">No. ${String(c.no).padStart(2, '0')}</span><span class="kind">${KIND[c.kind]}</span>
    ${figure(c)}
    <span class="txt"><span class="nm">${esc(conName(c)).split("，").map((t, i, a) => `<span style="display:inline-block">${t}${i < a.length - 1 ? "，" : ""}</span>`).join("")}</span><br><span class="hook">${esc(FIG[c.id].hook)}</span><br>
    <span class="ft">${c.path.length} 顆星${T() && namingCode(c) ? '・命名於 ' + namingCode(c) : ''}</span></span>
    ${T() && st.revealed.has(c.id) ? '<span class="flag">已向學生翻開</span>' : ''}</button>`;
}
function homeHTML(){
  return ZONES.map(z => `<section class="zone"><div class="zone-head"><h2>${z.name}</h2>${T() ? `<span>${z.t}・${z.ids.length} 個星座</span>` : ''}</div>
    <div class="grid">${z.ids.map(id => cardHTML(BY[id])).join('')}</div></section>`).join('');
}
function detailHTML(c){
  const on = st.revealed.has(c.id);
  return `<button type="button" class="back-link" data-home>← 回到全部星座</button>
  <div class="detail" style="--c:${c.color}">
    <div class="plate">${figure(c, true)}</div>
    <div class="info">
      <div class="eyebrow">No. ${String(c.no).padStart(2, '0')}・${KIND[c.kind]}</div>
      <h2>${esc(conName(c))}</h2>
      <p class="hook">${esc(FIG[c.id].hook)}</p>
      ${T() ? `<p class="meta">學術名：${esc(c.acad)}${c.sig ? '　｜　觸發訊號：' + esc(c.sig) : ''}</p>` : `<p class="meta">有人發現，下面這幾節用的是同一招。</p>`}
      <ol class="tl">${c.path.map((p, i) => { const l = LESSON[p[0]];
        return `<li data-i="${i}" class="${T() && p[1] === 'N' ? 'naming' : ''}"><span class="n">${i + 1}</span>
          <span><span class="t">${esc(l.title)}</span><br><span class="s">${l.isle}・${l.code}${T() ? `　${p[1] === 'N' ? '<b>命名</b>' : WHEN[p[1]]}：${esc(p[2])}` : ''}</span></span>
          <a class="btn" href="${l.url}"${l.url.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>打開這一節</a></li>`; }).join('')}</ol>
      ${T() ? `<div class="row"><button type="button" class="btn ${on ? 'on' : ''}" data-reveal="${c.id}">${on ? '已向學生翻開（再按蓋回去）' : '向學生翻開這張卡'}</button></div>
              <p class="note">課堂名「${esc(c.cls)}」只是示例。學生視角不顯示這個名字，由他們自己取。翻開的狀態只存在這台電腦。</p>`
            : `<div class="row"><label for="cn">你們叫它什麼？</label><input id="cn" type="text" maxlength="16" value="${esc(st.names[c.id] || '')}" data-name="${c.id}" placeholder="用動詞取名"></div>`}
    </div></div>`;
}
function render(){
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === st.mode)));
  const n = CONS.filter(c => st.revealed.has(c.id)).length;
  $('#count').innerHTML = `${T() ? '已向學生翻開' : '已翻開'} <b>${n}</b>／${CONS.length}`;
  $('#sub').textContent = T() ? '同一招在不同節次再出現，連起來就是一個星座。點一張卡，看它走過哪幾節。' : '每張卡是一個星座。翻開的可以點進去看。';
  const c = st.open && BY[st.open];
  $('#main').innerHTML = c && shown(c) ? detailHTML(c) : homeHTML();
}
function open(id){ st.open = id; render(); window.scrollTo(0, 0); }

$('#main').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  if (d.open) open(d.open);
  else if ('home' in d) open(null);
  else if (d.reveal) { st.revealed.has(d.reveal) ? st.revealed.delete(d.reveal) : st.revealed.add(d.reveal); store.set('gps-revealed', [...st.revealed]); render(); }
});
$('#main').addEventListener('input', e => { const d = e.target.dataset;
  if (d.name) { st.names[d.name] = e.target.value.trim(); store.set('gps-names', st.names); const h = $('.info h2'); if (h) h.textContent = st.names[d.name] || '還沒取名'; } });
// 專頁：星星和節次互相對應
function hot(i, on){ document.querySelectorAll(`.fig.big .st[data-i="${i}"], .tl li[data-i="${i}"]`).forEach(el => el.classList.toggle('hot', on)); }
['mouseover','mouseout','focusin','focusout'].forEach(ev => $('#main').addEventListener(ev, e => {
  const el = e.target.closest && e.target.closest('.fig.big .st, .tl li'); if (el) hot(el.dataset.i, ev === 'mouseover' || ev === 'focusin'); }));
if (teacherOK) $('.seg').hidden = false;
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { st.mode = b.dataset.mode; store.set('gps-mode', st.mode); render(); }));

function dust(){
  const cv = $('#dust'), dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0b1226'); bg.addColorStop(1, '#171e42'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  [[.15, .2, '#3a4fa044'], [.85, .7, '#6a3f8a33']].forEach(([x, y, col]) => { const r = Math.max(W, H) * .5, n = g.createRadialGradient(x * W, y * H, 0, x * W, y * H, r);
    n.addColorStop(0, col); n.addColorStop(1, '#0000'); g.fillStyle = n; g.fillRect(0, 0, W, H); });
  let s = 20261110; const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
  for (let i = 0, n = Math.round(W * H / 4200); i < n; i++) { g.globalAlpha = .1 + rnd() * .45; g.fillStyle = '#f5eedb';
    g.beginPath(); g.arc(rnd() * W, rnd() * H, rnd() < .92 ? .6 : 1.2, 0, 7); g.fill(); }
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(dust, 150); });
dust(); render();
</script>
</body>
</html>
